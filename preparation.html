<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饮品制作 - Fuji Electric</title>
  <style>
    :root {
      --blue: #0877c9;
      --blue-dark: #075b9e;
      --blue-soft: #e9f5fc;
      --ink: #102d43;
      --muted: #708593;
      --line: #dfeaf0;
      --green: #168565;
      --surface: rgba(255,255,255,.92);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 860px; }
    body {
      color: var(--ink);
      background: #f4f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(8,119,201,.3); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .preparation-page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      background:
        radial-gradient(circle at 13% 43%, rgba(168,220,245,.2), transparent 28%),
        radial-gradient(circle at 87% 37%, rgba(191,226,245,.22), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, #f3f9fc 67%, #e7f4fb 100%);
    }
    .preparation-page::before, .preparation-page::after {
      position: absolute;
      z-index: 0;
      border: 1px solid rgba(91,172,216,.12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .preparation-page::before { top: 250px; left: -180px; width: 480px; height: 480px; }
    .preparation-page::after { right: -120px; bottom: 80px; width: 380px; height: 380px; }

    .demo-bar {
      position: relative;
      z-index: 20;
      display: flex;
      flex: 0 0 70px;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 0 32px;
      color: #fff;
      background: var(--blue-dark);
      box-shadow: 0 4px 18px rgba(7,91,158,.12);
    }
    .demo-title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .demo-badge { padding: 4px 8px; border: 1px solid rgba(255,255,255,.4); border-radius: 5px; font-size: 10px; letter-spacing: .12em; }
    .demo-buttons { display: flex; gap: 6px; padding: 4px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(0,0,0,.09); }
    .demo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 158px;
      height: 38px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      color: #dceefa;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s, background .2s;
    }
    .demo-button::before { width: 8px; height: 8px; border: 2px solid currentColor; border-radius: 50%; content: ""; }
    .demo-button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
    .demo-button.active { color: var(--blue-dark); background: #fff; }
    .demo-button.active::before { background: var(--blue); border-color: var(--blue); box-shadow: inset 0 0 0 2px #fff; }
    .demo-button:disabled { opacity: .38; cursor: not-allowed; }

    .brand-header {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 0 0 92px;
      align-items: center;
      justify-content: space-between;
      width: min(1560px, calc(100% - 96px));
      margin: 0 auto;
      border-bottom: 1px solid rgba(196,216,227,.72);
    }
    .brand { display: flex; align-items: baseline; gap: 14px; }
    .brand-name { color: #142c3d; font-size: 24px; font-weight: 750; letter-spacing: .01em; }
    .brand-sub { color: #77909f; font-size: 11px; font-weight: 650; letter-spacing: .18em; }
    .order-reference { color: #78909f; font-size: 13px; letter-spacing: .05em; }

    .main-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 30px 48px 28px;
    }
    .title-block { flex: 0 0 auto; text-align: center; }
    .eyebrow { margin: 0 0 9px; color: var(--blue); font-size: 12px; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
    .page-title { margin: 0; font-size: 38px; font-weight: 730; line-height: 1.3; letter-spacing: .015em; }
    .page-subtitle { margin: 10px 0 0; color: var(--muted); font-size: 18px; line-height: 1.5; }

    .hero {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 310px;
    }
    .hero-stage { position: relative; display: flex; align-items: center; justify-content: center; width: 420px; height: 350px; }
    .halo { position: absolute; border-radius: 50%; }
    .halo.outer { width: 336px; height: 336px; border: 1px solid rgba(62,157,210,.18); animation: breathe 4s ease-in-out infinite; }
    .halo.middle { width: 292px; height: 292px; background: rgba(219,240,251,.55); box-shadow: 0 20px 70px rgba(47,132,181,.08); }
    .halo.inner { width: 242px; height: 242px; border: 1px dashed rgba(8,119,201,.22); animation: spin 28s linear infinite; }
    .orbit-dot { position: absolute; top: 24px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border: 3px solid #f5fbff; border-radius: 50%; background: #55b2e3; box-shadow: 0 2px 9px rgba(8,119,201,.2); }
    .hero-image { position: relative; z-index: 2; display: block; width: 235px; height: 285px; object-fit: contain; filter: drop-shadow(0 20px 18px rgba(24,65,89,.16)); animation: product-float 4s ease-in-out infinite; }
    .steam { position: absolute; z-index: 3; top: 28px; left: 50%; width: 90px; height: 75px; color: rgba(8,119,201,.42); transform: translateX(-50%); }
    .steam path { stroke-dasharray: 80; animation: steam 2.8s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: .7s; }
    .steam path:nth-child(3) { animation-delay: 1.4s; }
    .making-indicator { position: absolute; z-index: 4; right: 47px; bottom: 48px; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border: 6px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 8px 24px rgba(8,119,201,.24); }
    .making-indicator svg { width: 34px; height: 34px; color: #fff; }
    .making-indicator .gear { transform-origin: 24px 24px; animation: spin 7s linear infinite; }
    .ambient { position: absolute; border-radius: 50%; background: rgba(101,183,224,.25); filter: blur(.2px); }
    .ambient.one { top: 27%; left: calc(50% - 340px); width: 14px; height: 14px; }
    .ambient.two { right: calc(50% - 325px); bottom: 29%; width: 9px; height: 9px; }
    .ambient.three { top: 18%; right: calc(50% - 270px); width: 6px; height: 6px; }

    .completion-products { position: relative; display: flex; align-items: center; justify-content: center; gap: 42px; min-height: 330px; }
    .completion-item { position: relative; display: flex; align-items: center; justify-content: center; width: 210px; height: 280px; border: 1px solid rgba(200,224,237,.75); border-radius: 30px; background: rgba(255,255,255,.65); box-shadow: 0 18px 45px rgba(40,106,143,.08); animation: complete-in .45s ease both; }
    .completion-item:nth-child(2) { animation-delay: .08s; }
    .completion-item:nth-child(3) { animation-delay: .16s; }
    .completion-item img { display: block; width: 165px; height: 225px; object-fit: contain; filter: drop-shadow(0 14px 14px rgba(24,65,89,.13)); }
    .complete-check { position: absolute; top: -12px; right: -12px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 5px solid #f4fafc; border-radius: 50%; color: #fff; background: var(--green); }
    .complete-check svg { width: 22px; height: 22px; }
    .completion-products.count-1 .completion-item { width: 280px; height: 320px; }
    .completion-products.count-1 .completion-item img { width: 220px; height: 270px; }

    .return-bar { display: flex; flex: 0 0 70px; align-items: center; justify-content: center; gap: 14px; width: 100%; margin: -5px auto 18px; }
    .return-countdown { display: flex; flex: 0 1 auto; align-items: center; justify-content: center; gap: 12px; min-width: 390px; height: 100%; padding: 0 26px; border: 1px solid #d5e8f2; border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.8); box-shadow: 0 8px 24px rgba(33,92,124,.05); font-size: 15px; }
    .return-countdown svg { width: 23px; height: 23px; color: var(--blue); }
    .return-countdown strong { min-width: 68px; color: var(--blue); font-size: 25px; font-variant-numeric: tabular-nums; text-align: center; }
    .return-home-button { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 10px; height: 100%; padding: 0 30px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(135deg, #2b8fd6, #1470b5); box-shadow: 0 12px 26px rgba(20,112,181,.26); font-size: 17px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    .return-home-button:hover { transform: translateY(-1px); box-shadow: 0 16px 32px rgba(20,112,181,.32); }
    .return-home-button:active { transform: translateY(0); }
    .return-home-button svg { width: 20px; height: 20px; }

    .order-progress-card {
      flex: 0 0 196px;
      width: min(1260px, 100%);
      min-height: 0;
      padding: 18px 24px 20px;
      border: 1px solid rgba(210,226,235,.9);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 14px 45px rgba(36,91,122,.08);
      backdrop-filter: blur(10px);
    }
    .order-progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .order-progress-label { display: flex; align-items: center; gap: 8px; color: #557080; font-size: 13px; font-weight: 700; letter-spacing: .05em; }
    .order-progress-label::before { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); content: ""; }
    .order-cup-count { color: #8296a2; font-size: 12px; }
    .order-track { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
    .order-track.count-1 { grid-template-columns: minmax(0,1fr); }
    .order-track.count-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cup-card { position: relative; display: grid; grid-template-columns: 82px minmax(0,1fr) auto; grid-template-rows: auto auto; column-gap: 15px; align-items: center; min-width: 0; height: 116px; padding: 12px 15px; border: 1px solid #e1ebf0; border-radius: 16px; background: #f8fbfd; transition: border .25s, background .25s, box-shadow .25s; }
    .cup-card.making { border-color: #9fcfe9; background: #f2f9fd; box-shadow: inset 0 0 0 1px rgba(8,119,201,.05); }
    .cup-card.done { border-color: #d4e9e1; background: #f6fbf9; }
    .cup-card.waiting { opacity: .58; }
    .cup-image { grid-row: 1 / 3; display: block; width: 82px; height: 90px; border-radius: 11px; object-fit: contain; background: #edf3f6; }
    .cup-info { align-self: end; min-width: 0; }
    .cup-name { overflow: hidden; margin: 0 0 4px; font-size: 16px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .cup-variant { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .cup-status { display: inline-flex; align-items: center; align-self: start; justify-content: flex-end; gap: 5px; color: #8094a0; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .cup-status svg { width: 15px; height: 15px; }
    .making .cup-status, .making .cup-percent { color: var(--blue); }
    .done .cup-status { color: var(--green); }
    .cup-progress { grid-column: 2 / 4; align-self: end; }
    .progress-line { display: flex; align-items: center; gap: 10px; }
    .progress-rail { position: relative; flex: 1; height: 7px; overflow: hidden; border-radius: 999px; background: #dfe9ee; }
    .progress-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2a9bd7, #0877c9); transition: width .35s ease; }
    .cup-percent { min-width: 36px; color: #718895; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
    .next-cup-note { margin: 5px 0 0; color: #66818f; font-size: 11px; }
    .bottom-glow { position: absolute; z-index: 0; right: 0; bottom: 0; left: 0; height: 90px; background: linear-gradient(180deg, transparent, rgba(116,194,229,.12)); pointer-events: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes product-float { 0%,100% { transform: translateY(4px); } 50% { transform: translateY(-7px); } }
    @keyframes steam { 0% { opacity: 0; stroke-dashoffset: 80; transform: translateY(8px); } 40% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: 0; transform: translateY(-8px); } }
    @keyframes complete-in { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (max-height: 900px) {
      .demo-bar { flex-basis: 62px; }
      .brand-header { flex-basis: 76px; }
      .main-content { padding-top: 20px; padding-bottom: 20px; }
      .page-title { font-size: 32px; }
      .page-subtitle { margin-top: 6px; font-size: 16px; }
      .hero { min-height: 250px; }
      .hero-stage { height: 280px; transform: scale(.84); }
      .completion-products { min-height: 250px; transform: scale(.88); }
      .order-progress-card { flex-basis: 180px; padding-top: 14px; padding-bottom: 15px; }
      .order-progress-top { margin-bottom: 10px; }
      .cup-card { height: 108px; }
      .return-bar { flex-basis: 58px; margin-bottom: 12px; }
      .return-countdown { font-size: 14px; }
      .return-home-button { padding: 0 22px; font-size: 15px; }
    }
    @media (max-width: 1250px) {
      .demo-bar { gap: 14px; padding: 0 20px; }
      .demo-title { font-size: 11px; }
      .demo-button { min-width: 130px; padding: 0 13px; font-size: 12px; }
      .brand-header { width: calc(100% - 60px); }
      .main-content { padding-right: 30px; padding-left: 30px; }
      .cup-card { grid-template-columns: 64px minmax(0,1fr) auto; column-gap: 10px; padding: 10px; }
      .cup-image { width: 64px; height: 78px; }
      .cup-name { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="preparation-page" id="preparationPage">
    <section class="demo-bar" id="demoBar" aria-label="制作过程 Demo">
      <div class="demo-title"><span class="demo-badge">DEMO</span><span data-i18n="demoTitle">制作过程页面</span></div>
      <div class="demo-buttons" role="group" aria-label="选择制作状态">
        <button class="demo-button active" type="button" data-demo-state="first" aria-pressed="true" data-i18n="demoFirst">制作第一杯</button>
        <button class="demo-button" type="button" data-demo-state="second" aria-pressed="false" data-i18n="demoSecond">制作第二杯</button>
        <button class="demo-button" type="button" data-demo-state="complete" aria-pressed="false" data-i18n="demoComplete">制作完成（请取杯）</button>
      </div>
    </section>

    <header class="brand-header">
      <div class="brand"><span class="brand-name">Fuji Electric</span><span class="brand-sub">DRINK PREPARATION</span></div>
      <span class="order-reference" id="orderReference">ORDER · FUJI</span>
    </header>

    <section class="main-content">
      <div class="title-block">
        <p class="eyebrow" id="eyebrow">FRESHLY MADE FOR YOU</p>
        <h1 class="page-title" id="pageTitle">饮品正在制作中</h1>
        <p class="page-subtitle" id="pageSubtitle">正在为您制作第 1 / 2 杯</p>
      </div>

      <section class="hero" id="makingHero" aria-label="当前制作商品">
        <span class="ambient one"></span><span class="ambient two"></span><span class="ambient three"></span>
        <div class="hero-stage">
          <span class="halo outer"></span><span class="halo middle"></span>
          <span class="halo inner"><span class="orbit-dot"></span></span>
          <svg class="steam" viewBox="0 0 90 75" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M24 65c-14-16 15-22 0-42"/><path d="M45 65c-14-16 15-22 0-42"/><path d="M66 65c-14-16 15-22 0-42"/></svg>
          <img class="hero-image" id="heroImage" src="assets/caramel-macchiato.png" alt="当前商品">
          <span class="making-indicator" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><g class="gear"><path d="m24 5 3 5 6-1 1 6 6 2-2 6 4 5-5 4 1 6-6 1-3 5-6-3-6 3-3-5-6-1 1-6-5-4 4-5-2-6 6-2 1-6 6 1 3-5Z"/><circle cx="24" cy="24" r="7"/></g></svg></span>
        </div>
      </section>

      <section class="hero" id="completeHero" aria-label="已完成的订单商品" hidden>
        <div class="completion-products" id="completionProducts"></div>
      </section>

      <div class="return-bar" id="returnCountdown" hidden>
        <div class="return-countdown" role="timer" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <strong id="countdownValue">60 秒</strong><span data-i18n="returnHint">后自动返回首页</span>
        </div>
        <button class="return-home-button" id="returnHomeNow" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.6 12 3.6l8.5 7"/><path d="M5.6 9.9V20h12.8V9.9"/></svg>
          <span data-i18n="homeNow">立即回到首页</span>
        </button>
      </div>

      <section class="order-progress-card" aria-label="订单制作进度">
        <div class="order-progress-top"><span class="order-progress-label" data-i18n="orderProgress">订单制作进度</span><span class="order-cup-count" id="orderCupCount"></span></div>
        <div class="order-track" id="orderTrack"></div>
      </section>
    </section>
    <div class="bottom-glow"></div>
  </main>

  <script>
    const COMPLETE_RETURN_SECONDS = 60;
    const MAX_CUPS = 3;
    const params = new URLSearchParams(window.location.search);
    const I18N = {

        making: "饮品正在制作中", makingFor: "正在为您制作第 {current} / {total} 杯", pickup: "请拿走您的饮品", complete: "您的饮品已全部制作完成，感谢光临！",

        sweetness: { none: "No sugar", light: "Light", half: "Half", less: "Less", standard: "Standard" }, milk: { milk: "Milk", lowfat: "Low-fat", oat: "Oat milk", soy: "Soy milk" }
      },
      ko: {
        htmlLang: "ko", title: "음료 제조", demoTitle: "제조 과정 DEMO", demoFirst: "첫 번째 잔 제조", demoSecond: "두 번째 잔 제조", demoComplete: "제조 완료（수령）",
        making: "음료를 제조하고 있습니다", makingFor: "총 {total}잔 중 {current}번째 잔을 제조 중입니다", pickup: "음료를 가져가 주세요", complete: "모든 음료가 완성되었습니다. 감사합니다!",
        orderProgress: "주문 제조 현황", cups: "총 {n}잔", done: "완료", working: "제조 중", waiting: "대기 중", next: "다음: {name}", seconds: "{n}초", returnHint: "후 홈으로 자동 이동", homeNow: "홈으로 바로가기",
        size: { small: "S", regular: "M", medium: "M", large: "L" }, temperature: { hot: "핫", iced: "아이스" },
        sweetness: { none: "무설탕", light: "약간", half: "반", less: "적게", standard: "표준" }, milk: { milk: "우유", lowfat: "저지방", oat: "오트밀크", soy: "두유" }
      }
    };
    const PRODUCT_NAMES = {
      1: { zh: "焦糖玛奇朵", ja: "キャラメルマキアート", en: "Caramel Macchiato", ko: "카라멜 마키아토" },
      2: { zh: "椰子摩卡", ja: "ココナッツモカ", en: "Coconut Mocha", ko: "코코넛 모카" },
      3: { zh: "浓缩咖啡", ja: "エスプレッソ", en: "Espresso", ko: "에스프레소" },
      4: { zh: "美式咖啡", ja: "アメリカーノ", en: "Americano", ko: "아메리카노" },
      5: { zh: "越南西班牙拿铁", ja: "ベトナム風スパニッシュラテ", en: "Vietnamese Spanish Latte", ko: "베트남 스패니시 라테" }
    };
    const defaultOrder = {
      language: "zh",
      items: [
        { productId: 1, name: "焦糖玛奇朵", price: 360, quantity: 1, image: "assets/caramel-macchiato.png", variantData: { temperature: "iced", size: "regular" } },
        { productId: 4, name: "美式咖啡", price: 320, quantity: 1, image: "assets/americano.png", variantData: { temperature: "iced", size: "regular" } }
      ]
    };
    let language = "zh";
    let cups = [];
    let viewState = "first";
    let displayCup = 0;
    let progressValues = [];
    let countdownDeadline = 0;
    let countdownTimer = null;
    let productionTimer = null;
    let autoProduction = false;

    function loadOrder() {
      try {
        const saved = JSON.parse(localStorage.getItem("fujiOrder"));
        if (saved && Array.isArray(saved.items) && saved.items.length) return saved;
      } catch (error) { console.warn("使用默认演示订单。", error); }
      return defaultOrder;
    }
    const order = loadOrder();
    function resolveLanguage() {
      const requested = params.get("lang");
      if (I18N[requested]) return requested;
      if (I18N[order.language]) return order.language;
      try { const saved = localStorage.getItem("fujiLanguage"); if (I18N[saved]) return saved; } catch (error) { console.warn(error); }
      return "zh";
    }
    function t(key, vars) {
      const value = key.split(".").reduce((node, part) => node && node[part], I18N[language]);
      const text = typeof value === "string" ? value : key;
      return text.replace(/\{(\w+)\}/g, (_, name) => vars && vars[name] !== undefined ? vars[name] : `{${name}}`);
    }
    function productName(item) {
      const names = PRODUCT_NAMES[Number(item.productId)];
      return names && names[language] ? names[language] : (item.name || "Drink");
    }
    function variantLabel(item) {
      const data = item.variantData;
      if (data && typeof data === "object") {
        return ["size", "temperature"].filter(key => data[key]).map(key => t(`${key}.${data[key]}`)).join(" · ");
      }
      return item.variant || "";
    }
    function expandCups(items) {
      const result = [];
      items.forEach(item => {
        if (!item || !item.image) return;
        const quantity = Math.max(1, Math.floor(Number(item.quantity) || 1));
        for (let index = 0; index < quantity && result.length < MAX_CUPS; index += 1) result.push(item);
      });
      return result.length ? result : expandCups(defaultOrder.items);
    }
    function checkIcon() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
    }
    function stateForCup(index) {
      if (viewState === "complete") return "done";
      if (index < displayCup) return "done";
      if (index === displayCup) return "making";
      return "waiting";
    }
    function renderCompletionProducts() {
      const container = document.getElementById("completionProducts");
      container.className = `completion-products count-${cups.length}`;
      container.innerHTML = cups.map(item => `
        <div class="completion-item">
          <img src="${item.image}" alt="${productName(item)}">
          <span class="complete-check">${checkIcon()}</span>
        </div>`).join("");
    }
    function renderOrderTrack() {
      const track = document.getElementById("orderTrack");
      track.className = `order-track count-${cups.length}`;
      track.innerHTML = cups.map((item, index) => {
        const status = stateForCup(index);
        const percent = status === "done" ? 100 : status === "making" ? Math.round(progressValues[index]) : 0;
        const nextNote = status === "making" && cups[index + 1] ? `<p class="next-cup-note">${t("next", { name: productName(cups[index + 1]) })}</p>` : "";
        return `
          <article class="cup-card ${status}" data-cup="${index + 1}">
            <img class="cup-image" src="${item.image}" alt="${productName(item)}">
            <div class="cup-info"><h2 class="cup-name">${productName(item)}</h2><p class="cup-variant">${variantLabel(item)}</p>${nextNote}</div>
            <span class="cup-status">${status === "done" ? checkIcon() : ""}${t(status === "making" ? "working" : status)}</span>
            <div class="cup-progress"><div class="progress-line"><span class="progress-rail"><span class="progress-fill" style="width:${percent}%"></span></span><span class="cup-percent">${percent}%</span></div></div>
          </article>`;
      }).join("");
    }
    function render() {
      const complete = viewState === "complete";
      document.getElementById("makingHero").hidden = complete;
      document.getElementById("completeHero").hidden = !complete;
      document.getElementById("returnCountdown").hidden = !complete;
      document.getElementById("pageTitle").textContent = complete ? t("pickup") : t("making");
      document.getElementById("pageSubtitle").textContent = complete ? t("complete") : t("makingFor", { current: displayCup + 1, total: cups.length });
      document.getElementById("eyebrow").textContent = complete ? "READY FOR PICKUP" : "FRESHLY MADE FOR YOU";
      if (!complete) {
        const item = cups[displayCup];
        const image = document.getElementById("heroImage");
        image.src = item.image;
        image.alt = productName(item);
      }
      document.querySelectorAll("[data-demo-state]").forEach(button => {
        const active = button.dataset.demoState === viewState;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      renderOrderTrack();
      if (complete) renderCompletionProducts();
      document.title = `${complete ? t("pickup") : t("title")} - Fuji Electric`;
    }
    function stopCountdown() {
      if (countdownTimer !== null) window.clearInterval(countdownTimer);
      countdownTimer = null;
    }
    function goHome() {
      stopCountdown();
      try {
        localStorage.removeItem("fujiOrder");
        sessionStorage.removeItem("fujiPaymentStatus");
        sessionStorage.removeItem("fujiPreparationState");
      } catch (error) { console.warn(error); }
      window.location.href = `welcome.html?lang=${language}`;
    }
    function tickCountdown() {
      const remaining = Math.max(0, Math.ceil((countdownDeadline - Date.now()) / 1000));
      document.getElementById("countdownValue").textContent = t("seconds", { n: remaining });
      if (remaining <= 0) goHome();
    }
    function startReturnCountdown(reset) {
      if (reset || !countdownDeadline) countdownDeadline = Date.now() + COMPLETE_RETURN_SECONDS * 1000;
      stopCountdown();
      tickCountdown();
      countdownTimer = window.setInterval(tickCountdown, 250);
    }
    function setPreparationState(nextState, options) {
      if (!["first", "second", "complete"].includes(nextState)) return false;
      if (nextState === "second" && cups.length < 2) return false;
      const settings = options || {};
      viewState = nextState;
      if (nextState === "first") {
        displayCup = 0;
        progressValues[0] = settings.progress !== undefined ? settings.progress : 68;
      } else if (nextState === "second") {
        displayCup = 1;
        progressValues[0] = 100;
        progressValues[1] = settings.progress !== undefined ? settings.progress : 72;
      } else {
        displayCup = Math.max(0, cups.length - 1);
        progressValues = progressValues.map(() => 100);
        stopProduction();
        startReturnCountdown(settings.resetCountdown !== false);
      }
      if (nextState !== "complete") stopCountdown();
      render();
      try { sessionStorage.setItem("fujiPreparationState", nextState); } catch (error) { console.warn(error); }
      return true;
    }
    function stopProduction() {
      autoProduction = false;
      if (productionTimer !== null) window.clearInterval(productionTimer);
      productionTimer = null;
    }
    function tickProduction() {
      if (!autoProduction || viewState === "complete") return;
      progressValues[displayCup] = Math.min(100, progressValues[displayCup] + 1);
      if (progressValues[displayCup] >= 100) {
        if (displayCup + 1 < cups.length) {
          displayCup += 1;
          viewState = displayCup === 0 ? "first" : "second";
          progressValues[displayCup] = Math.max(0, progressValues[displayCup]);
        } else {
          setPreparationState("complete", { resetCountdown: true });
          return;
        }
      }
      render();
    }
    function startProduction() {
      stopProduction();
      stopCountdown();
      autoProduction = true;
      displayCup = 0;
      viewState = "first";
      progressValues = cups.map(() => 0);
      render();
      productionTimer = window.setInterval(tickProduction, 120);
    }
    function setCupProgress(cupNumber, percent) {
      const index = Number(cupNumber) - 1;
      if (index < 0 || index >= cups.length || !Number.isFinite(Number(percent))) return false;
      progressValues[index] = Math.max(0, Math.min(100, Number(percent)));
      if (index === displayCup && viewState !== "complete") renderOrderTrack();
      return true;
    }
    function configurePreparation(config) {
      if (!config || typeof config !== "object") return;
      if (config.state) setPreparationState(config.state, { progress: config.progress, resetCountdown: config.resetCountdown });
      if (Number.isFinite(Number(config.cup)) && config.progress !== undefined) setCupProgress(config.cup, config.progress);
    }

    language = resolveLanguage();
    document.documentElement.lang = I18N[language].htmlLang;
    document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
    cups = expandCups(order.items);
    progressValues = cups.map(() => 0);
    document.getElementById("orderReference").textContent = `ORDER · ${order.orderId || "FUJI"}`;
    document.getElementById("orderCupCount").textContent = t("cups", { n: cups.length });
    document.querySelector('[data-demo-state="second"]').disabled = cups.length < 2;
    document.getElementById("demoBar").hidden = params.get("demo") === "off";
    document.querySelectorAll("[data-demo-state]").forEach(button => {
      button.addEventListener("click", () => {
        stopProduction();
        setPreparationState(button.dataset.demoState);
      });
    });
    document.getElementById("returnHomeNow").addEventListener("click", goHome);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (productionTimer !== null) window.clearInterval(productionTimer);
        productionTimer = null;
      } else if (autoProduction && productionTimer === null) productionTimer = window.setInterval(tickProduction, 120);
    });

    window.setPreparationState = setPreparationState;
    window.setCupProgress = setCupProgress;
    window.startProduction = startProduction;
    window.configurePreparation = configurePreparation;

    const requestedState = params.get("state");
    if (["first", "second", "complete"].includes(requestedState)) setPreparationState(requestedState);
    else if (params.get("auto") === "1") startProduction();
    else setPreparationState("first");
  </script>
</body>
</html>
