<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饮品制作 - Fuji Electric</title>
  <style>
    :root {
      --blue: #0877c9;
      --blue-dark: #075b9e;
      --blue-soft: #e9f5fc;
      --ink: #102d43;
      --muted: #708593;
      --line: #dfeaf0;
      --green: #168565;
      --surface: rgba(255,255,255,.92);
      --amber: #b8791a;
      --amber-soft: #fffaf0;
      --amber-line: #e7c086;
    }
    /* ===== 视口等比缩放基准（与 index.html 一致）=====
       设计稿 1920×1080，1rem = 16 设计像素。 */
    html { font-size: min(100vw / 120, 100vh / 67.5); }
    html { font-size: min(100vw / 120, 100dvh / 67.5); }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限，小屏（10 吋平板）上不会缩到看不清 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 53.75rem; }
    body {
      color: var(--ink);
      background: #f4f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 0.1875rem solid rgba(8,119,201,.3); outline-offset: 0.1875rem; }
    [hidden] { display: none !important; }

    .preparation-page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 13% 43%, rgba(168,220,245,.2), transparent 28%),
        radial-gradient(circle at 87% 37%, rgba(191,226,245,.22), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, #f3f9fc 67%, #e7f4fb 100%);
    }
    .preparation-page::before, .preparation-page::after {
      position: absolute;
      z-index: 0;
      border: 0.0625rem solid rgba(91,172,216,.12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .preparation-page::before { top: 15.625rem; left: -11.25rem; width: 30rem; height: 30rem; }
    .preparation-page::after { right: -7.5rem; bottom: 5rem; width: 23.75rem; height: 23.75rem; }

    .demo-bar {
      position: relative;
      z-index: 20;
      display: flex;
      flex: 0 0 4.375rem;
      align-items: center;
      justify-content: center;
      gap: 1.625rem;
      padding: 0 2rem;
      color: #fff;
      background: var(--blue-dark);
      box-shadow: 0 0.25rem 1.125rem rgba(7,91,158,.12);
    }
    .demo-title { display: flex; align-items: center; gap: 0.625rem; font-size: 0.8125rem; font-weight: 700; letter-spacing: .04em; }
    .demo-badge { padding: 0.25rem 0.5rem; border: 0.0625rem solid rgba(255,255,255,.4); border-radius: 0.3125rem; font-size: 0.625rem; letter-spacing: .12em; }
    .demo-buttons { display: flex; gap: 0.375rem; padding: 0.25rem; border: 0.0625rem solid rgba(255,255,255,.2); border-radius: 62.4375rem; background: rgba(0,0,0,.09); }
    .demo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-width: 9.875rem;
      height: 2.375rem;
      padding: 0 1.25rem;
      border: 0;
      border-radius: 62.4375rem;
      color: #dceefa;
      background: transparent;
      font-size: 0.875rem;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s, background .2s;
    }
    .demo-button::before { width: 0.5rem; height: 0.5rem; border: 0.125rem solid currentColor; border-radius: 50%; content: ""; }
    .demo-button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
    .demo-button.active { color: var(--blue-dark); background: #fff; }
    .demo-button.active::before { background: var(--blue); border-color: var(--blue); box-shadow: inset 0 0 0 0.125rem #fff; }
    .demo-button:disabled { opacity: .38; cursor: not-allowed; }

    .demo-home {
      position: absolute;
      top: 50%;
      right: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 2.25rem;
      padding: 0 1.125rem 0 0.8125rem;
      border: 0.0625rem solid rgba(255,255,255,.34);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(255,255,255,.12);
      font-size: 0.8125rem;
      font-weight: 650;
      letter-spacing: .02em;
      white-space: nowrap;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background .18s ease, border-color .18s ease;
    }
    .demo-home:hover { background: rgba(255,255,255,.24); border-color: rgba(255,255,255,.62); }
    .demo-home:active { background: rgba(255,255,255,.3); }
    .demo-home svg { width: 1rem; height: 1rem; }
    .brand-header {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 0 0 5.75rem;
      align-items: center;
      justify-content: space-between;
      width: min(97.5rem, calc(100% - 6rem));
      margin: 0 auto;
      border-bottom: 0.0625rem solid rgba(196,216,227,.72);
    }
    .brand { display: flex; align-items: baseline; gap: 0.875rem; }
    .brand-name { color: #142c3d; font-size: 1.5rem; font-weight: 750; letter-spacing: .01em; }
    .brand-sub { color: #77909f; font-size: 0.6875rem; font-weight: 650; letter-spacing: .18em; }
    .order-reference { color: #78909f; font-size: 0.8125rem; letter-spacing: .05em; }

    .main-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 1.875rem 3rem 1.75rem;
    }
    .title-block { flex: 0 0 auto; text-align: center; }
    .eyebrow { margin: 0 0 0.5625rem; color: var(--blue); font-size: 0.75rem; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
    .page-title { margin: 0; font-size: 2.375rem; font-weight: 730; line-height: 1.3; letter-spacing: .015em; }
    .page-subtitle { margin: 0.625rem 0 0; color: var(--muted); font-size: 1.125rem; line-height: 1.5; }

    .hero {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }
    /* 舞台与商品图按视口高度收缩：10 吋平板上不会把进度卡顶出屏幕 */
    .hero-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(26.25rem, 100%);
      height: min(21.875rem, 33vh);
    }
    .halo { position: absolute; border-radius: 50%; }
    .halo.outer { width: min(21rem, 31vh); height: min(21rem, 31vh); border: 0.0625rem solid rgba(62,157,210,.18); animation: breathe 4s ease-in-out infinite; }
    .halo.middle { width: min(18.25rem, 27vh); height: min(18.25rem, 27vh); background: rgba(219,240,251,.55); box-shadow: 0 1.25rem 4.375rem rgba(47,132,181,.08); }
    .halo.inner { width: min(15.125rem, 22.5vh); height: min(15.125rem, 22.5vh); border: 0.0625rem dashed rgba(8,119,201,.22); animation: spin 28s linear infinite; }
    .orbit-dot { position: absolute; top: 1.5rem; left: 50%; width: 0.75rem; height: 0.75rem; margin-left: -0.375rem; border: 0.1875rem solid #f5fbff; border-radius: 50%; background: #55b2e3; box-shadow: 0 0.125rem 0.5625rem rgba(8,119,201,.2); }
    /* 商品图为方形实拍照片：做成圆角相片卡，避免白底方块直接贴在浅蓝背景上 */
    .hero-image {
      position: relative;
      z-index: 2;
      display: block;
      width: min(15.625rem, 23vh);
      height: min(15.625rem, 23vh);
      border-radius: 0;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 1.125rem 1.375rem rgba(24,65,89,.22));
      animation: product-float 4s ease-in-out infinite;
      transition: transform .45s ease;
    }
    .steam { position: absolute; z-index: 3; top: 1.75rem; left: 50%; width: 5.625rem; height: 4.6875rem; color: rgba(8,119,201,.42); transform: translateX(-50%); }
    .steam path { stroke-dasharray: 80; animation: steam 2.8s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: .7s; }
    .steam path:nth-child(3) { animation-delay: 1.4s; }
    .making-indicator { position: absolute; z-index: 4; right: 2.9375rem; bottom: 3rem; display: flex; align-items: center; justify-content: center; width: 4rem; height: 4rem; border: 0.375rem solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 0.5rem 1.5rem rgba(8,119,201,.24); }
    .making-indicator svg { width: 2.125rem; height: 2.125rem; color: #fff; }
    .making-indicator .gear { transform-origin: 1.5rem 1.5rem; animation: spin 7s linear infinite; }
    .ambient { position: absolute; border-radius: 50%; background: rgba(101,183,224,.25); filter: blur(0.0125rem); }
    .ambient.one { top: 27%; left: calc(50% - 21.25rem); width: 0.875rem; height: 0.875rem; }
    .ambient.two { right: calc(50% - 20.3125rem); bottom: 29%; width: 0.5625rem; height: 0.5625rem; }
    .ambient.three { top: 18%; right: calc(50% - 16.875rem); width: 0.375rem; height: 0.375rem; }

    .completion-products { position: relative; display: flex; flex: 1 1 auto; align-items: center; justify-content: center; gap: 2.625rem; min-height: 0; }
    .completion-item { position: relative; display: flex; align-items: center; justify-content: center; width: min(13.125rem, 31vh); height: min(17.5rem, 40vh); border: 0.0625rem solid rgba(200,224,237,.75); border-radius: 1.875rem; background: rgba(255,255,255,.65); box-shadow: 0 1.125rem 2.8125rem rgba(40,106,143,.08); animation: complete-in .45s ease both; }
    .completion-item:nth-child(2) { animation-delay: .08s; }
    .completion-item:nth-child(3) { animation-delay: .16s; }
    .completion-item img { display: block; width: min(10.3125rem, 24vh); height: min(14.0625rem, 32vh); object-fit: contain; filter: drop-shadow(0 0.875rem 0.875rem rgba(24,65,89,.13)); }
    .complete-check { position: absolute; top: -0.75rem; right: -0.75rem; display: flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; border: 0.3125rem solid #f4fafc; border-radius: 50%; color: #fff; background: var(--green); }
    .complete-check svg { width: 1.375rem; height: 1.375rem; }
    .completion-products.count-1 .completion-item { width: min(17.5rem, 36vh); height: min(20rem, 42vh); }
    .completion-products.count-1 .completion-item img { width: min(13.75rem, 28vh); height: min(16.875rem, 35vh); }

    .return-bar { display: flex; flex: 0 0 4.375rem; align-items: center; justify-content: center; gap: 0.875rem; width: 100%; margin: -0.3125rem auto 1.125rem; }
    .return-countdown { display: flex; flex: 0 1 auto; align-items: center; justify-content: center; gap: 0.75rem; min-width: 24.375rem; height: 100%; padding: 0 1.625rem; border: 0.0625rem solid #d5e8f2; border-radius: 62.4375rem; color: var(--muted); background: rgba(255,255,255,.8); box-shadow: 0 0.5rem 1.5rem rgba(33,92,124,.05); font-size: 0.9375rem; }
    .return-countdown svg { width: 1.4375rem; height: 1.4375rem; color: var(--blue); }
    .return-countdown strong { min-width: 4.25rem; color: var(--blue); font-size: 1.5625rem; font-variant-numeric: tabular-nums; text-align: center; }
    .return-home-button { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 0.625rem; height: 100%; padding: 0 1.875rem; border: 0; border-radius: 62.4375rem; color: #fff; background: linear-gradient(135deg, #2b8fd6, #1470b5); box-shadow: 0 0.75rem 1.625rem rgba(20,112,181,.26); font-size: 1.0625rem; font-weight: 700; white-space: nowrap; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    .return-home-button:hover { transform: translateY(-0.0625rem); box-shadow: 0 1rem 2rem rgba(20,112,181,.32); }
    .return-home-button:active { transform: translateY(0); }
    .return-home-button svg { width: 1.25rem; height: 1.25rem; }

    .order-progress-card {
      flex: 0 0 auto;
      width: min(78.75rem, 100%);
      min-height: 0;
      padding: 1.125rem 1.5rem 1.25rem;
      border: 0.0625rem solid rgba(210,226,235,.9);
      border-radius: 1.5rem;
      background: var(--surface);
      box-shadow: 0 0.875rem 2.8125rem rgba(36,91,122,.08);
      backdrop-filter: blur(0.625rem);
    }
    .order-progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.875rem; }
    .order-progress-label { display: flex; align-items: center; gap: 0.5rem; color: #557080; font-size: 0.8125rem; font-weight: 700; letter-spacing: .05em; }
    .order-progress-label::before { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--blue); content: ""; }
    .order-cup-count { color: #8296a2; font-size: 0.75rem; }
    .order-track { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; width: 100%; }
    .order-track.count-1 { grid-template-columns: minmax(0,1fr); }
    .order-track.count-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cup-card { position: relative; display: grid; grid-template-columns: min(5.125rem, 9vh) minmax(0,1fr) auto; grid-template-rows: auto auto; column-gap: 0.9375rem; align-items: center; min-width: 0; height: min(7.25rem, 12.5vh); padding: 0.75rem 0.9375rem; border: 0.0625rem solid #e1ebf0; border-radius: 1rem; background: #f8fbfd; transition: border .25s, background .25s, box-shadow .25s; }
    .cup-card.making { border-color: #9fcfe9; background: #f2f9fd; box-shadow: inset 0 0 0 0.0625rem rgba(8,119,201,.05); }
    .cup-card.done { border-color: #d4e9e1; background: #f6fbf9; }
    .cup-card.waiting { opacity: .58; }
    .cup-image { grid-row: 1 / 3; display: block; width: min(5.125rem, 9vh); height: min(5.625rem, 9.8vh); border-radius: 0.6875rem; object-fit: contain; background: #edf3f6; }
    .cup-info { align-self: end; min-width: 0; }
    .cup-name { overflow: hidden; margin: 0 0 0.25rem; font-size: 1rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .cup-variant { overflow: hidden; margin: 0; color: var(--muted); font-size: 0.6875rem; text-overflow: ellipsis; white-space: nowrap; }
    .cup-status { display: inline-flex; align-items: center; align-self: start; justify-content: flex-end; gap: 0.3125rem; color: #8094a0; font-size: 0.75rem; font-weight: 650; white-space: nowrap; }
    .cup-status svg { width: 0.9375rem; height: 0.9375rem; }
    .making .cup-status, .making .cup-percent { color: var(--blue); }
    .done .cup-status { color: var(--green); }
    .cup-progress { grid-column: 2 / 4; align-self: end; }
    .progress-line { display: flex; align-items: center; gap: 0.625rem; }
    .progress-rail { position: relative; flex: 1; height: 0.4375rem; overflow: hidden; border-radius: 62.4375rem; background: #dfe9ee; }
    .progress-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2a9bd7, #0877c9); transition: width .35s ease; }
    .cup-percent { min-width: 2.25rem; color: #718895; font-size: 0.75rem; font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
    .next-cup-note { margin: 0.3125rem 0 0; color: #66818f; font-size: 0.6875rem; }
    .bottom-glow { position: absolute; z-index: 0; right: 0; bottom: 0; left: 0; height: 5.625rem; background: linear-gradient(180deg, transparent, rgba(116,194,229,.12)); pointer-events: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes product-float { 0%,100% { transform: translateY(0.25rem); } 50% { transform: translateY(-0.4375rem); } }
    @keyframes steam { 0% { opacity: 0; stroke-dashoffset: 80; transform: translateY(0.5rem); } 40% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: 0; transform: translateY(-0.5rem); } }
    @keyframes complete-in { from { opacity: 0; transform: translateY(1rem) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ===== 待取走：机器暂停，等取货口传感器确认 ===== */
    .page-title.is-pickup { color: var(--amber); animation: title-blink 1.15s ease-in-out infinite; }
    .page-subtitle.is-pickup { color: #a97b32; }
    @keyframes title-blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .hero-stage.is-pickup .hero-image { transform: scale(.82) translateY(-2.25rem); animation: none; }
    .hero-stage.is-pickup .steam { display: none; }
    .hero-stage.is-pickup .halo.inner { animation-play-state: paused; opacity: .45; }
    /* 暂停时收起「制作中」齿轮，避免与取货提示条抢位；注意力交给提示条 */
    .hero-stage.is-pickup .making-indicator { opacity: 0; visibility: hidden; transform: scale(.7); }
    .making-indicator { transition: opacity .3s ease, transform .3s ease, background .3s ease; }

    .pickup-cue {
      position: absolute;
      z-index: 6;
      bottom: -0.5rem;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.75rem;
      border: 0.125rem solid var(--amber-line);
      border-radius: 62.4375rem;
      color: #9a6208;
      background: #fffdf7;
      font-size: 1.375rem;
      font-weight: 780;
      letter-spacing: .01em;
      white-space: nowrap;
      transform: translateX(-50%);
      animation: cue-pulse 1.35s ease-in-out infinite;
    }
    .pickup-cue svg { width: 1.5rem; height: 1.5rem; }
    @keyframes cue-pulse {
      0%, 100% { box-shadow: 0 0.75rem 2rem rgba(184,118,15,.16), 0 0 0 0 rgba(196,127,18,.34); }
      50% { box-shadow: 0 1rem 2.5rem rgba(184,118,15,.26), 0 0 0 1rem rgba(196,127,18,0); }
    }

    .cup-card.ready { border-color: var(--amber-line); background: #fffcf4; animation: card-glow 1.35s ease-in-out infinite; }
    .cup-card.ready .cup-status, .cup-card.ready .cup-percent { color: #9a6208; }
    .cup-card.ready .progress-fill { background: linear-gradient(90deg, #e8b453, #c07d12); }
    @keyframes card-glow {
      0%, 100% { box-shadow: inset 0 0 0 0.0625rem rgba(184,118,15,.06); }
      50% { box-shadow: inset 0 0 0 0.0625rem rgba(184,118,15,.22), 0 0.5rem 1.25rem rgba(184,118,15,.12); }
    }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c07d12; animation: title-blink 1.15s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* 10 吋平板（视口高度不足）：收紧留白与标题，进度卡与取走提示仍完整可见 */
    @media (max-height: 660px) {
      .main-content { padding: 0.875rem 2rem 0.75rem; }
      .eyebrow { margin-bottom: 0.375rem; }
      .page-title { font-size: 1.875rem; }
      .page-subtitle { margin-top: 0.375rem; font-size: 1rem; }
      .demo-bar { flex-basis: 3.5rem; }
      .brand-header { flex-basis: 4.25rem; }
      .order-progress-card { padding: 0.75rem 1rem 0.875rem; border-radius: 1.125rem; }
      .order-progress-top { margin-bottom: 0.5rem; }
      .return-bar { flex-basis: 3.25rem; margin-bottom: 0.5rem; }
      .pickup-cue { bottom: 0.25rem; }
    }
  </style>
</head>
<body>
  <main class="preparation-page" id="preparationPage">
    <section class="demo-bar" id="demoBar" aria-label="制作过程 Demo">
      <div class="demo-title"><span class="demo-badge">DEMO</span><span data-i18n="demoTitle">制作过程页面</span></div>
      <div class="demo-buttons" role="group" aria-label="选择制作状态">
        <button class="demo-button active" type="button" data-demo-action="start" aria-pressed="true" data-i18n="demoStart">开始制作</button>
        <button class="demo-button" type="button" data-demo-action="taken" id="demoTakenButton" aria-pressed="false" data-i18n="demoTaken">模拟取走</button>
        <button class="demo-button" type="button" data-demo-action="complete" aria-pressed="false" data-i18n="demoComplete">跳到完成</button>
      </div>
      <button class="demo-home" id="demoHomeButton" type="button" aria-label="返回首页（Demo）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.6 12 3.6l8.5 7"/><path d="M5.6 9.9V20h12.8V9.9"/></svg>
        <span data-i18n="home">首页</span>
      </button>
    </section>

    <header class="brand-header">
      <div class="brand"><span class="brand-name">Fuji Electric</span><span class="brand-sub">DRINK PREPARATION</span></div>
      <span class="order-reference" id="orderReference">ORDER · FUJI</span>
    </header>

    <section class="main-content">
      <div class="title-block">
        <p class="eyebrow" id="eyebrow">FRESHLY MADE FOR YOU</p>
        <h1 class="page-title" id="pageTitle">饮品正在制作中</h1>
        <p class="page-subtitle" id="pageSubtitle">正在为您制作第 1 / 2 杯</p>
      </div>

      <section class="hero" id="makingHero" aria-label="当前制作商品">

  <script>
    const COMPLETE_RETURN_SECONDS = 60;
    const MAX_CUPS = 3;

    const params = new URLSearchParams(window.location.search);
    const I18N = {

        making: "음료를 제조하고 있습니다", makingFor: "총 {total}잔 중 {current}번째 잔을 제조 중입니다",
        readyTitle: "{cup}번째 잔을 가져가 주세요", readyHint: "가져가시면 바로 다음 잔을 제조합니다", readyHintLast: "가져가시면 주문이 완료됩니다",
        pickup: "음료를 가져가 주세요", complete: "모든 음료가 완성되었습니다. 감사합니다!",
        orderProgress: "주문 제조 현황", cups: "총 {n}잔", done: "수령 완료", working: "제조 중", readyTag: "수령 대기",
        waiting: "대기 중", waitingPrev: "이전 잔을 먼저 가져가 주세요", next: "다음: {name}",
        seconds: "{n}초", returnHint: "후 홈으로 자동 이동", homeNow: "홈으로 바로가기", home: "홈", homeAria: "홈으로 이동 (Demo)",
        size: { small: "S", regular: "M", medium: "M", large: "L" }, temperature: { hot: "핫", iced: "아이스" },
        sweetness: { none: "무설탕", light: "약간", half: "반", less: "적게", standard: "표준" }, milk: { milk: "우유", lowfat: "저지방", oat: "오트밀크", soy: "두유" }

    const PRODUCT_NAMES = {
      1: { zh: "冰美式", ja: "アイスアメリカーノ", en: "Iced Americano", ko: "아이스 아메리카노" },
      2: { zh: "焦糖玛奇朵", ja: "キャラメルマキアート", en: "Caramel Macchiato", ko: "카라멜 마키아토" },
      3: { zh: "冰拿铁", ja: "アイスラテ", en: "Iced Latte", ko: "아이스 라테" },
      4: { zh: "冰摩卡", ja: "アイスモカ", en: "Iced Mocha", ko: "아이스 모카" },
      5: { zh: "意式浓缩", ja: "エスプレッソ", en: "Espresso", ko: "에스프레소" },
      6: { zh: "冰澳白", ja: "アイス フラットホワイト", en: "Iced Flat White", ko: "아이스 플랫 화이트" },
      7: { zh: "摩卡星冰乐", ja: "モカ フラペチーノ", en: "Mocha Frappuccino", ko: "모카 프라페노" },
      8: { zh: "经典拿铁", ja: "カフェラテ", en: "Café Latte", ko: "카페 라테" },
      9: { zh: "馥芮白", ja: "フラットホワイト", en: "Flat White", ko: "플랫 화이트" },
      10: { zh: "冷萃美式", ja: "コールドブリュー アメリカーノ", en: "Cold Brew Americano", ko: "콜드브루 아메리카노" },
      11: { zh: "雪顶摩卡", ja: "スノーキャップ モカ", en: "Snowcap Mocha", ko: "스노우캡 모카" },
      12: { zh: "热拿铁", ja: "ホットラテ", en: "Hot Latte", ko: "핫 라테" },
      13: { zh: "焦糖拿铁", ja: "キャラメルラテ", en: "Caramel Latte", ko: "카라멜 라테" },
      14: { zh: "双份冰美式", ja: "ダブル アイスアメリカーノ", en: "Double Iced Americano", ko: "더블 아이스 아메리카노" },
      15: { zh: "海盐焦糖拿铁", ja: "シーソルト キャラメルラテ", en: "Sea Salt Caramel Latte", ko: "씨솔트 캐러멜 라테" },
      16: { zh: "香草冰拿铁", ja: "バニラ アイスラテ", en: "Vanilla Iced Latte", ko: "바닐라 아이스 라테" },
      17: { zh: "柠檬冷萃", ja: "レモン コールドブリュー", en: "Lemon Cold Brew", ko: "레몬 콜드브루" },
      18: { zh: "节日雪顶摩卡", ja: "ホリデー スノーキャップ モカ", en: "Holiday Snowcap Mocha", ko: "홀리데이 스노우캡 모카" },
      19: { zh: "焦糖布蕾拿铁", ja: "キャラメル ブリュレラテ", en: "Caramel Brûlée Latte", ko: "카라멜 브륄레 라테" },
      20: { zh: "抹茶椰香冰沙", ja: "抹茶ココナッツ フラッペ", en: "Matcha Coconut Frappe", ko: "말차 코코넛 프라페" },
      21: { zh: "椰香冰咖啡", ja: "ココナッツ アイスコーヒー", en: "Coconut Iced Coffee", ko: "코코넛 아이스 커피" },
      22: { zh: "香草拿铁", ja: "バニララテ", en: "Vanilla Latte", ko: "바닐라 라테" },
      23: { zh: "洛神花冷萃", ja: "ハイビスカス コールドブリュー", en: "Hibiscus Cold Brew", ko: "히비스커스 콜드브루" },
      24: { zh: "香橙抹茶", ja: "オレンジ抹茶", en: "Orange Matcha", ko: "오렌지 말차" },
      25: { zh: "双层焦糖玛奇朵", ja: "ダブルレイヤー キャラメルマキアート", en: "Double Layer Caramel Macchiato", ko: "더블 레이어 카라멜 마키아토" },
      26: { zh: "芒果冰沙", ja: "マンゴーフラッペ", en: "Mango Frappe", ko: "망고 프라페" },
      27: { zh: "奶盖冰摩卡", ja: "クリームトップ アイスモカ", en: "Cream Top Iced Mocha", ko: "크림 토핑 아이스 모카" }
    };
    const defaultOrder = {
      language: "zh",
      items: [
        { productId: 2, name: "焦糖玛奇朵", price: 380, quantity: 1, image: "product-cutout-27/331-02.webp", variantData: { temperature: "iced", size: "regular" } },
        { productId: 3, name: "冰拿铁", price: 350, quantity: 1, image: "product-cutout-27/331-03.webp", variantData: { temperature: "iced", size: "regular" } }
      ]
    };

    let language = "zh";
    let cups = [];
    let cupStates = [];
    let progressValues = [];
    let isDrinkOrder = true;
    let pagePhase = "making";
    let countdownDeadline = 0;
    let countdownTimer = null;
    let productionTimer = null;
    let autoProduction = false;

    function loadOrder() {
      try {
        const saved = JSON.parse(localStorage.getItem("fujiOrder"));
        if (saved && Array.isArray(saved.items) && saved.items.length) return saved;
      } catch (error) { console.warn("使用默认演示订单。", error); }
      return defaultOrder;
    }
    const order = loadOrder();
    function resolveLanguage() {
      const requested = params.get("lang");
      if (I18N[requested]) return requested;
      if (I18N[order.language]) return order.language;
      try { const saved = localStorage.getItem("fujiLanguage"); if (I18N[saved]) return saved; } catch (error) { console.warn(error); }
      return "zh";
    }
    function t(key, vars) {
      const value = key.split(".").reduce((node, part) => node && node[part], I18N[language]);
      const text = typeof value === "string" ? value : key;
      return text.replace(/\{(\w+)\}/g, (_, name) => vars && vars[name] !== undefined ? vars[name] : `{${name}}`);
    }
    function productName(item) {
      const names = PRODUCT_NAMES[Number(item.productId)];
      if (!item.variantData && item.name) return item.name;
      return names && names[language] ? names[language] : (item.name || "Drink");
    }
    function variantLabel(item) {
      const data = item.variantData;
      if (data && typeof data === "object") {
        return ["size", "temperature"].filter(key => data[key]).map(key => t(`${key}.${data[key]}`)).join(" · ");
      }
      return item.variant || "";
    }
    function expandCups(items) {
      const result = [];
      items.forEach(item => {
        if (!item || !item.image) return;
        const quantity = Math.max(1, Math.floor(Number(item.quantity) || 1));
        for (let index = 0; index < quantity && result.length < MAX_CUPS; index += 1) result.push(item);
      });
      return result.length ? result : expandCups(defaultOrder.items);
    }
    function checkIcon() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
    }
    function activeIndex() { return cupStates.indexOf(CUP.MAKING); }
    function readyIndex() { return cupStates.indexOf(CUP.READY); }
    function allCupsDone() { return cupStates.length > 0 && cupStates.every(state => state === CUP.DONE); }
    // 是否正处于「等待取走」：饮品按单杯判定，预包装（无定制参数）整单一次取走
    function awaitingPickup() {
      if (pagePhase === "complete") return false;
      return isDrinkOrder ? readyIndex() >= 0 : allCupsDone();
    }
    function renderCompletionProducts() {
      const container = document.getElementById("completionProducts");
      container.className = `completion-products count-${cups.length}`;
      container.innerHTML = cups.map(item => `
        <div class="completion-item">
          <img src="${item.image}" alt="${productName(item)}">
          <span class="complete-check">${checkIcon()}</span>
        </div>`).join("");
    }
    function renderOrderTrack() {
      const track = document.getElementById("orderTrack");
      const pickup = awaitingPickup();
      track.className = `order-track count-${cups.length}`;
      track.innerHTML = cups.map((item, index) => {
        let state = cupStates[index] || CUP.WAITING;
        // 预包装整单取走：全部做好但还没取走时，卡片以「待取走」呈现
        if (!isDrinkOrder && pickup && state === CUP.DONE) state = CUP.READY;
        const percent = state === CUP.MAKING ? Math.round(progressValues[index] || 0)
                      : state === CUP.WAITING ? 0 : 100;
        const prevBlocked = index > 0 && cupStates[index - 1] !== CUP.DONE;
        const label = state === CUP.MAKING ? t("working")
                    : state === CUP.READY ? t("readyTag")
                    : state === CUP.DONE ? t("done")
                    : (prevBlocked && pickup ? t("waitingPrev") : t("waiting"));
        const icon = state === CUP.DONE ? checkIcon()
                   : state === CUP.READY ? '<span class="status-dot" aria-hidden="true"></span>'
                   : "";
        const nextNote = state === CUP.MAKING && cups[index + 1] ? `<p class="next-cup-note">${t("next", { name: productName(cups[index + 1]) })}</p>` : "";
        return `
          <article class="cup-card ${state}" data-cup="${index + 1}">
            <img class="cup-image" src="${item.image}" alt="${productName(item)}">
            <div class="cup-info"><h2 class="cup-name">${productName(item)}</h2><p class="cup-variant">${variantLabel(item)}</p>${nextNote}</div>
            <span class="cup-status">${icon}${label}</span>
            <div class="cup-progress"><div class="progress-line"><span class="progress-rail"><span class="progress-fill" style="width:${percent}%"></span></span><span class="cup-percent">${percent}%</span></div></div>
          </article>`;
      }).join("");
    }
    function render() {
      const complete = pagePhase === "complete";
      const ready = readyIndex();
      const making = activeIndex();
      const pickup = awaitingPickup();
      const titleEl = document.getElementById("pageTitle");
      const subtitleEl = document.getElementById("pageSubtitle");

      document.getElementById("makingHero").hidden = complete;
      document.getElementById("completeHero").hidden = !complete;
      document.getElementById("returnCountdown").hidden = !complete;

      if (complete) {
        titleEl.textContent = t("pickup");
        subtitleEl.textContent = t("complete");
      } else if (pickup) {
        titleEl.textContent = isDrinkOrder ? t("readyTitle", { cup: ready + 1 }) : t("pickup");
        subtitleEl.textContent = isDrinkOrder && ready + 1 < cups.length ? t("readyHint") : t("readyHintLast");
      } else {
        titleEl.textContent = t("making");
        subtitleEl.textContent = t("makingFor", { current: Math.max(0, making) + 1, total: cups.length });
      }
      titleEl.classList.toggle("is-pickup", pickup);
      subtitleEl.classList.toggle("is-pickup", pickup);
      document.getElementById("eyebrow").textContent = complete ? "READY FOR PICKUP" : pickup ? "PICK UP NOW" : "FRESHLY MADE FOR YOU";

      // 取货提示：齿轮停转、蒸汽收起、商品上浮让位，下方悬浮闪动提示条
      const stage = document.getElementById("heroStage");
      const cue = document.getElementById("pickupCue");
      stage.classList.toggle("is-pickup", pickup);
      cue.hidden = !pickup;
      if (pickup) {
        document.getElementById("pickupCueText").textContent =
          isDrinkOrder ? t("readyTitle", { cup: ready + 1 }) : t("pickup");
      }
      if (!complete) {
        const focus = pickup && ready >= 0 ? ready : Math.max(0, making);
        const item = cups[Math.min(focus, cups.length - 1)];
        const image = document.getElementById("heroImage");
        image.src = item.image;
        image.alt = productName(item);
      }

      const takenButton = document.getElementById("demoTakenButton");
      if (takenButton) takenButton.disabled = !pickup;
      document.querySelectorAll("[data-demo-action]").forEach(button => {
        const action = button.dataset.demoAction;
        const active = (action === "taken" && pickup) || (action === "complete" && complete);
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      renderOrderTrack();
      if (complete) renderCompletionProducts();
      document.title = `${complete || pickup ? t("pickup") : t("title")} - Fuji Electric`;
    }
    function stopCountdown() {
      if (countdownTimer !== null) window.clearInterval(countdownTimer);
      countdownTimer = null;
    }
    function goHome() {
      stopCountdown();
      stopProduction();
      try {
        localStorage.removeItem("fujiOrder");
        sessionStorage.removeItem("fujiPaymentStatus");
        sessionStorage.removeItem("fujiPreparationState");
      } catch (error) { console.warn(error); }
      window.location.href = `welcome.html?lang=${language}`;
    }
    function tickCountdown() {
      const remaining = Math.max(0, Math.ceil((countdownDeadline - Date.now()) / 1000));
      document.getElementById("countdownValue").textContent = t("seconds", { n: remaining });
      if (remaining <= 0) goHome();
    }
    function startReturnCountdown(reset) {
      if (reset || !countdownDeadline) countdownDeadline = Date.now() + COMPLETE_RETURN_SECONDS * 1000;
      stopCountdown();
      tickCountdown();
      countdownTimer = window.setInterval(tickCountdown, 250);
    }
    function stopProduction() {
      autoProduction = false;
      if (productionTimer !== null) window.clearInterval(productionTimer);
      productionTimer = null;
    }
    function startProductionTimer() {
      if (productionTimer !== null) window.clearInterval(productionTimer);
      autoProduction = true;
      productionTimer = window.setInterval(tickProduction, 120);
    }
    function tickProduction() {
      if (!autoProduction || pagePhase === "complete") return;
      const index = activeIndex();
      if (index < 0) { stopProduction(); return; }
      progressValues[index] = Math.min(100, progressValues[index] + 1);
      if (progressValues[index] >= 100) {
        if (isDrinkOrder) {
          // 关键：这一杯做好就停机，等取走信号，绝不自动进入下一杯
          cupStates[index] = CUP.READY;
          stopProduction();
        } else {
          // 预包装：连续出完，最后整单一次取走
          cupStates[index] = CUP.DONE;
          const next = cupStates.indexOf(CUP.WAITING);
          if (next >= 0) {
            cupStates[next] = CUP.MAKING;
            progressValues[next] = 0;
          } else {
            stopProduction();
          }
        }
      }
      render();
    }
    function finishOrder() {
      stopProduction();
      setPreparationState("complete", { resetCountdown: true });
    }
    // 取货口传感器回调：index 为杯序号（0 基），省略则取当前待取走的那一杯
    function notifyCupTaken(index) {
      if (pagePhase === "complete") return false;
      if (isDrinkOrder) {
        const target = Number.isInteger(index) ? index : readyIndex();
        if (target < 0 || target >= cups.length || cupStates[target] !== CUP.READY) return false;
        cupStates[target] = CUP.DONE;
        const next = cupStates.indexOf(CUP.WAITING);
        if (next >= 0) {
          // 检测到拿走后立即开始下一杯，不做额外等待
          cupStates[next] = CUP.MAKING;
          progressValues[next] = 0;
          startProductionTimer();
        } else {
          finishOrder();
        }
      } else if (allCupsDone()) {
        finishOrder();
      } else {
        return false;
      }
      render();
      return true;
    }
    function startProduction() {
      stopProduction();
      stopCountdown();
      pagePhase = "making";
      cupStates = cups.map((_, index) => index === 0 ? CUP.MAKING : CUP.WAITING);
      progressValues = cups.map(() => 0);
      render();
      startProductionTimer();
    }
    function setPreparationState(nextState, options) {
      const settings = options || {};
      if (nextState === "complete") {
        pagePhase = "complete";
        cupStates = cups.map(() => CUP.DONE);
        progressValues = cups.map(() => 100);
        stopProduction();
        startReturnCountdown(settings.resetCountdown !== false);
      } else if (["first", "second", "ready"].includes(nextState)) {
        if (nextState === "second" && cups.length < 2) return false;
        pagePhase = "making";
        stopProduction();
        stopCountdown();
        cupStates = cups.map(() => CUP.WAITING);
        progressValues = cups.map(() => 0);
        if (nextState === "first") {
          cupStates[0] = CUP.MAKING;
          progressValues[0] = settings.progress !== undefined ? settings.progress : 68;
        } else if (nextState === "second") {
          cupStates[0] = CUP.DONE;
          progressValues[0] = 100;
          cupStates[1] = CUP.MAKING;
          progressValues[1] = settings.progress !== undefined ? settings.progress : 72;
        } else {
          cupStates[0] = CUP.READY;
          progressValues[0] = 100;
        }
      } else {
        return false;
      }
      render();
      try { sessionStorage.setItem("fujiPreparationState", nextState); } catch (error) { console.warn(error); }
      return true;
    }
    function setCupProgress(cupNumber, percent) {
      const index = Number(cupNumber) - 1;
      if (index < 0 || index >= cups.length || !Number.isFinite(Number(percent))) return false;
      progressValues[index] = Math.max(0, Math.min(100, Number(percent)));
      if (pagePhase !== "complete") renderOrderTrack();
      return true;
    }
    function configurePreparation(config) {
      if (!config || typeof config !== "object") return;
      if (config.state) setPreparationState(config.state, { progress: config.progress, resetCountdown: config.resetCountdown });
      if (Number.isFinite(Number(config.cup)) && config.progress !== undefined) setCupProgress(config.cup, config.progress);
    }

    language = resolveLanguage();
    document.documentElement.lang = I18N[language].htmlLang;
    document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
    cups = expandCups(order.items);
    isDrinkOrder = cups.every(item => !!item.variantData);
    cupStates = cups.map(() => CUP.WAITING);
    progressValues = cups.map(() => 0);
    document.getElementById("orderReference").textContent = `ORDER · ${order.orderId || "FUJI"}`;
    document.getElementById("orderCupCount").textContent = t("cups", { n: cups.length });
    document.getElementById("demoBar").hidden = params.get("demo") === "off";
    document.querySelectorAll("[data-demo-action]").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.demoAction;
        if (action === "start") startProduction();
        else if (action === "taken") notifyCupTaken();
        else if (action === "complete") { stopProduction(); setPreparationState("complete"); }
      });
    });
    document.getElementById("returnHomeNow").addEventListener("click", goHome);
    document.getElementById("demoHomeButton").setAttribute("aria-label", t("homeAria"));
    document.getElementById("demoHomeButton").addEventListener("click", () => {
      stopProduction();
      goHome();
    });
    // 切到后台只暂停计时器，不关闭自动制作标记，回到前台继续跑
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (productionTimer !== null) window.clearInterval(productionTimer);
        productionTimer = null;
      } else if (autoProduction && productionTimer === null && activeIndex() >= 0) {
        startProductionTimer();
      }
    });

    window.setPreparationState = setPreparationState;
    window.setCupProgress = setCupProgress;
    window.startProduction = startProduction;
    window.configurePreparation = configurePreparation;
    window.notifyCupTaken = notifyCupTaken;

    const requestedState = params.get("state");
    if (["first", "second", "ready", "complete"].includes(requestedState)) setPreparationState(requestedState);
    else startProduction();

  </script>
</body>
</html>
