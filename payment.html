<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 设备配置引导：读取 setup.html 保存的档位，决定排版标记与根字号基准 -->
  <script>
    (function () {
      var KEY = "fujiDevice";
      var root = document.documentElement;
      var device = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) device = JSON.parse(raw);
      } catch (error) {
        console.warn("设备配置读取失败。", error);
      }

      // 与 setup.html 中的推断逻辑保持一致
      function layoutForWidth(width) {
        if (width >= 2200) return "l27";
        if (width >= 1280) return "m21";
        return "s10";
      }

      var mode = device && device.mode ? device.mode : "auto";
      var layout = null;
      var base = null;

      if (mode === "preset" && device.layout) {
        layout = device.layout;
      } else if (mode === "custom" && device.w > 0 && device.h > 0) {
        layout = layoutForWidth(device.w);
        base = Math.min(device.w / 120, device.h / 67.5);
      } else {
        mode = "auto";
        layout = layoutForWidth(window.innerWidth);
      }

      root.dataset.deviceMode = mode;
      root.dataset.deviceLayout = layout;
      window.FUJI_DEVICE = { mode: mode, layout: layout };

      // 自定义分辨率：把根字号钳到该基准对应的设计字号，且不超过真实视口允许的尺寸
      if (base && base > 0) {
        var style = document.createElement("style");
        style.textContent =
          'html[data-device-mode="custom"]{font-size:max(12px,min(' +
          base.toFixed(3) + 'px,100vw / 120,100vh / 67.5));}';
        document.head.appendChild(style);
      }
    })();
  </script>
  <title>请选择支付方式 - Fuji Electric</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      --border: #e3ebf0;
      --text: #102d43;
      --text-2: #6c7e8c;
      --accent: #0877c9;
      --accent-dark: #075b9e;
      --accent-weak: #e8f4fd;
      --status-h: 3.5rem;
      --header-h: 6.5rem;
    }

    /* ===== 视口等比缩放基准（与 index.html 一致）=====
       设计稿 1920×1080，1rem = 16 设计像素。 */
    html { font-size: min(100vw / 120, 100vh / 67.5); }
    html { font-size: min(100vw / 120, 100dvh / 67.5); }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限，小屏（10 吋平板）上不会缩到看不清 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 47.5rem; }
    body {
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 0.1875rem solid rgba(8,119,201,.28); outline-offset: 0.1875rem; }

    .payment-page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 40rem;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      flex: 0 0 var(--status-h);
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0 2rem;
      color: #fff;
      background: var(--accent-dark);
      font-size: 0.8125rem;
    }
    .status-left, .status-right, .machine-id, .demo-methods {
      display: flex;
      align-items: center;
    }
    .status-left, .status-right { gap: 1.75rem; }
    .machine-id { gap: 0.5625rem; white-space: nowrap; }
    .machine-id svg { width: 1.0625rem; height: 1.0625rem; }
    .machine-id span { color: #cfe8f8; }
    .machine-id strong { color: #fff; font-weight: 600; }

    .demo-methods {
      gap: 0.3125rem;
      padding: 0.25rem;
      border: 0.0625rem solid rgba(255,255,255,.25);
      border-radius: 62.4375rem;
      background: rgba(0,0,0,.1);
    }
    .demo-label {
      padding: 0 0.5rem;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: .09em;
    }
    .demo-title { margin-right: 0.1875rem; color: #d8edf9; font-size: 0.6875rem; }
    .demo-count {
      width: 1.6875rem;
      height: 1.5625rem;
      padding: 0;
      border: 0;
      border-radius: 62.4375rem;
      color: #fff;
      background: transparent;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-count.active { color: var(--accent-dark); background: #fff; }

    .main-header {
      display: flex;
      flex: 0 0 var(--header-h);
      align-items: center;
      padding: 0 3rem;
      border-bottom: 0.0625rem solid var(--border);
      background: var(--surface);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6875rem;
      color: #101c26;
      font-size: 1.375rem;
      font-weight: 750;
    }
    .brand-mark {
      color: var(--accent);
      font-size: 2.0625rem;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -.12em;
      transform: skew(-8deg);
    }
    .header-actions { display: flex; align-items: center; gap: 1.125rem; margin-left: auto; }
    .header-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      min-width: 8.25rem;
      min-height: 3.375rem;
      padding: 0 1.4375rem;
      border: 0.0625rem solid var(--border);
      border-radius: 62.4375rem;
      color: var(--text);
      background: #fff;
      cursor: pointer;
    }
    .header-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }
    .header-button svg { width: 1.25rem; height: 1.25rem; }

    .payment-main {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      max-width: 114rem;
      min-height: 0;
      margin: 0 auto;
      padding: 2.25rem 3rem 2.625rem;
    }
    .page-title {
      flex: 0 0 auto;
      margin: 0 0 1.5rem;
      font-size: 2rem;
      font-weight: 750;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .order-summary {
      display: flex;
      flex: 0 0 8.25rem;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.5rem 2.125rem;
      border: 0.0625rem solid var(--border);
      border-radius: 1.125rem;
      background: var(--surface);
    }
    .order-total { display: flex; align-items: baseline; gap: 1.875rem; }
    .order-total-label { color: var(--text-2); font-size: 1.0625rem; }
    .order-total-value { font-size: 2.625rem; font-weight: 800; letter-spacing: -.025em; }
    .order-products { display: flex; align-items: center; gap: 1.5625rem; }
    .order-count { color: var(--text-2); font-size: 1rem; white-space: nowrap; }
    .order-thumbnails { display: flex; align-items: center; gap: 0.75rem; }
    .order-thumbnail {
      display: block;
      width: 5.125rem;
      height: 5.125rem;
      aspect-ratio: 1 / 1;
      border: 0.0625rem solid #e5ecef;
      border-radius: 0.75rem;
      object-fit: cover;
      background: #edf2f4;
    }

    .payment-grid {
      display: grid;
      flex: 1 1 auto;
      gap: 1.75rem;
      width: 100%;
      min-height: 0;
      margin: 1.75rem auto 0;
    }
    .payment-grid.count-1 {
      grid-template-columns: minmax(0, 42.5rem);
      justify-content: center;
      max-width: 87.5rem;
    }
    .payment-grid.count-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 87.5rem;
    }
    .payment-grid.count-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      max-width: 108rem;
    }

    .payment-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 1.75rem 2.25rem 2rem;
      overflow: hidden;
      border: 0.0625rem solid var(--border);
      border-radius: 1.25rem;
      background: var(--surface);
      box-shadow: 0 0.4375rem 1.375rem rgba(33,73,101,.055);
      animation: card-in .22s ease both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(0.375rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    .payment-name {
      flex: 0 0 auto;
      margin: 0;
      text-align: center;
      font-size: 1.625rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .payment-illustration {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 1.125rem 0;
    }
    .payment-illustration svg {
      display: block;
      width: min(100%, 20rem);
      height: min(100%, 16.875rem);
    }
    .pay-button {
      display: flex;
      flex: 0 0 4rem;
      align-items: center;
      justify-content: center;
      gap: 1.125rem;
      width: 100%;
      border: 0;
      border-radius: 62.4375rem;
      color: #fff;
      background: var(--accent);
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease;
    }
    .pay-button:hover { background: var(--accent-dark); }
    .pay-button svg { width: 1.3125rem; height: 1.3125rem; }

    .toast {
      position: fixed;
      z-index: 50;
      bottom: 1.5rem;
      left: 50%;
      max-width: min(32.5rem, 80vw);
      padding: 0.75rem 1.25rem;
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(16,45,67,.95);
      font-size: 0.8125rem;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.625rem);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── 只有一种「扫码支付」时：左侧支付图 + 右侧二维码，无需再选择 ── */
    .payment-grid.qr-mode {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.875rem;
      max-width: 87.5rem;
    }
    .qr-media {
      flex: 0 0 auto;
      height: min(100%, 39.5rem);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 0.0625rem solid var(--border);
      border-radius: 1.375rem;
      background: var(--surface);
      box-shadow: 0 0.4375rem 1.375rem rgba(33,73,101,.055);
    }
    .qr-media img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .qr-panel {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-width: 45rem;
      padding: 1.625rem 2.375rem 1.5rem;
      overflow: hidden;
      border: 0.0625rem solid var(--border);
      border-radius: 1.375rem;
      background: var(--surface);
      box-shadow: 0 0.4375rem 1.375rem rgba(33,73,101,.055);
      text-align: center;
    }
    .qr-title { margin: 0; font-size: 1.875rem; font-weight: 750; line-height: 1.25; }
    .qr-code-caption {
      margin: 0.5625rem 0 0;
      color: #91a6b4;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: .34em;
      text-indent: .34em;
    }
    .qr-frame {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: 100%;
      max-height: 18.25rem;
      min-height: 0;
      aspect-ratio: 1 / 1;
      margin: 0.875rem 0 0.9375rem;
      padding: 0.75rem;
      border: 0.0625rem solid #dfe8ed;
      border-radius: 1rem;
      background: #fff;
    }
    .qr-code { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .qr-code img, .qr-code canvas { display: block; width: 100% !important; height: 100% !important; }
    .qr-hint { margin: 0; color: var(--text-2); font-size: 1.0625rem; }
    .qr-timer { margin: 1.375rem 0 0; color: var(--text-2); font-size: 0.9375rem; }
    .qr-timer strong {
      color: var(--accent);
      font-size: 2rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .qr-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.875rem;
      padding: 1.875rem;
      background: #fff;
    }
    .qr-overlay[hidden] { display: none; }
    .qr-result-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 8.25rem;
      height: 8.25rem;
      border-radius: 50%;
    }
    .qr-result-icon svg { width: 5rem; height: 5rem; }
    .qr-result-icon.success { color: #168565; background: #eaf7f2; }
    .qr-result-icon.failed { color: #c64747; background: #fff0f0; }
    .qr-result-title { margin: 0.375rem 0 0; font-size: 2rem; font-weight: 750; }
    .qr-result-hint { margin: 0; color: var(--text-2); font-size: 1.0625rem; }
    .qr-retry {
      min-width: 13.125rem;
      min-height: 3.5rem;
      margin-top: 0.75rem;
      border: 0.0625rem solid var(--accent);
      border-radius: 62.4375rem;
      color: #fff;
      background: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .qr-retry:hover { background: var(--accent-dark); }
    .making-dots { display: flex; gap: 0.5rem; margin-top: 1.125rem; }
    .making-dots span { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #168565; animation: making-dot 1.2s ease-in-out infinite; }
    .making-dots span:nth-child(2) { animation-delay: .15s; }
    .making-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes making-dot { 0%,70%,100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-0.3125rem); } }

    .demo-states {
      display: none;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 0.0625rem solid rgba(255,255,255,.25);
      border-radius: 62.4375rem;
      background: rgba(0,0,0,.1);
    }
    .demo-states.visible { display: flex; }
    .demo-states .demo-label { padding: 0 0.375rem; }
    .demo-state-opt {
      min-width: 4.75rem;
      height: 1.5625rem;
      padding: 0 0.6875rem;
      border: 0;
      border-radius: 62.4375rem;
      color: #fff;
      background: transparent;
      font-size: 0.75rem;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }
    .demo-state-opt:hover { background: rgba(255,255,255,.13); }
    .demo-state-opt.active { color: var(--accent-dark); background: #fff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    /* ===== 调试浮窗：点左侧 LOGO 唤出，默认不显示（上线前整块移除） ===== */
    .debug-trigger { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .debug-trigger:focus-visible { outline: 0.125rem solid rgba(7,91,158,.5); outline-offset: 0.25rem; border-radius: 0.5rem; }

    .debug-dock { position: fixed; inset: 0; z-index: 200; display: none; }
    .debug-dock.is-open { display: block; }
    .debug-scrim { position: absolute; inset: 0; background: rgba(6,28,45,.24); }
    .debug-panel {
      position: absolute;
      width: min(30rem, calc(100vw - 2rem));
      max-height: calc(100vh - 6rem);
      overflow: auto;
      padding: 0.875rem 1rem 1rem;
      border: 0.0625rem solid rgba(255,255,255,.18);
      border-radius: 1.125rem;
      color: #fff;
      background: linear-gradient(158deg, #0b4f80 0%, #08395c 100%);
      box-shadow: 0 1.5rem 3.5rem rgba(4,26,42,.42);
      animation: debug-dock-in .16s ease-out;
    }
    @keyframes debug-dock-in { from { opacity: 0; transform: translateY(-0.375rem); } }

    .debug-head { display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.6875rem; border-bottom: 0.0625rem solid rgba(255,255,255,.16); }
    .debug-badge { padding: 0.125rem 0.4375rem; border-radius: 0.25rem; color: #08395c; background: #fff; font-size: 0.625rem; font-weight: 800; letter-spacing: .1em; }
    .debug-head-title { font-size: 0.8125rem; font-weight: 700; letter-spacing: .02em; }
    .debug-head-hint { margin-left: auto; color: rgba(255,255,255,.56); font-size: 0.6875rem; }
    .debug-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      margin-left: 0.375rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.14);
      font: inherit;
      font-size: 0.8125rem;
      line-height: 1;
      cursor: pointer;
    }
    .debug-close:hover { background: rgba(255,255,255,.28); }

    .debug-group { padding-top: 0.6875rem; }
    .debug-group + .debug-group { margin-top: 0.6875rem; border-top: 0.0625rem solid rgba(255,255,255,.12); }
    .debug-label { margin: 0 0 0.4375rem; color: rgba(255,255,255,.62); font-size: 0.6875rem; font-weight: 700; letter-spacing: .08em; }
    .debug-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .debug-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3125rem;
      padding: 0.375rem 0.75rem;
      border: 0.0625rem solid rgba(255,255,255,.26);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: .01em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .debug-chip:hover { background: rgba(255,255,255,.2); }
    .debug-chip[aria-current="page"], .debug-chip[aria-pressed="true"] { border-color: #fff; color: #08395c; background: #fff; }
    .debug-chip i { font-size: 0.625rem; font-style: normal; opacity: .66; }
    .debug-note { margin: 0.4375rem 0 0; color: rgba(255,255,255,.48); font-size: 0.625rem; line-height: 1.5; }
    /* 搬进浮窗的旧控件：原本为深色状态栏设计，这里保持原样即可；带 visible 门控的组在浮窗内始终显示 */
    .debug-panel .demo-controls, .debug-panel .demo-states { display: flex; }

  </style>
</head>
<body>
  <main class="payment-page">
    <section class="status-bar" aria-label="机器状态">
      <div class="status-left">
        <div class="machine-id">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 6h6M9 18h6"/></svg>
          <span>机器 ID：<strong>fuji12345678</strong></span>
        </div>
        <div>联系方式：800-1234-5678</div>
      </div>
      <div class="status-right">
        <time datetime="2026-11-04T23:42">11月4日 23:42</time>
        <svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor" aria-label="网络状态"><rect x="1" y="11" width="3" height="4" rx="1"/><rect x="6" y="7" width="3" height="8" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg>
      </div>
    </section>

    <header class="main-header">
      <div class="brand debug-trigger" id="debugTrigger" role="button" tabindex="0" aria-expanded="false" aria-haspopup="dialog" aria-label="Fuji Electric">
        <span class="brand-mark">FE</span>
        <span>Fuji Electric</span>
      </div>
      <div class="header-actions">
        <button class="header-button" type="button" data-toast="帮助：请拨打服务热线 800-1234-5678。">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.3 2.1c-.8.4-1.1.9-1.1 1.9M12 16.8h.01"/></svg>
          帮助
        </button>
        <button class="header-button" type="button" data-toast="当前语言：中文">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          中文
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
        </button>
      </div>
    </header>

    <section class="payment-main" aria-labelledby="pageTitle">
      <h1 class="page-title" id="pageTitle">请选择支付方式</h1>

      <section class="order-summary" aria-label="订单摘要">
        <div class="order-total">
          <span class="order-total-label">合计金额</span>
          <strong class="order-total-value" id="orderTotal">¥1,000</strong>
        </div>
        <div class="order-products">
          <span class="order-count" id="orderCount">购买商品（3件）</span>

  <!-- 调试浮窗：点左侧 LOGO 唤出；默认隐藏，上线前整块移除 -->

          <button class="debug-chip" type="button" data-debug-nav="index.html">饮品</button>
          <button class="debug-chip" type="button" data-debug-nav="packaged.html">包装商品</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/qrcode.min.js"></script>
  <script>
    const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg>';

    const paymentMethods = {
      qr: {
        id: "qr",
        name: "扫码支付",
        action: "显示付款码",
        illustration: `
          <svg viewBox="0 0 320 250" fill="none" role="img" aria-label="扫码支付示意图">
            <rect x="82" y="14" width="156" height="222" rx="24" fill="#e8f4fd" stroke="#0877c9" stroke-width="4"/>
            <rect x="99" y="36" width="122" height="154" rx="10" fill="#ffffff" stroke="#bfd9ea" stroke-width="2"/>
            <path d="M112 72V51h21M187 51h21v21M208 154v21h-21M133 175h-21v-21" stroke="#0877c9" stroke-width="6" stroke-linecap="round"/>
            <g fill="#102d43">
              <rect x="116" y="58" width="25" height="25" rx="2"/><rect x="179" y="58" width="25" height="25" rx="2"/><rect x="116" y="143" width="25" height="25" rx="2"/>
              <rect x="149" y="58" width="9" height="9"/><rect x="162" y="71" width="9" height="9"/><rect x="149" y="86" width="9" height="9"/>
              <rect x="116" y="94" width="9" height="9"/><rect x="129" y="105" width="9" height="9"/><rect x="116" y="119" width="9" height="9"/>
              <rect x="151" y="105" width="12" height="12"/><rect x="169" y="94" width="9" height="9"/><rect x="185" y="105" width="19" height="9"/>
              <rect x="149" y="128" width="9" height="9"/><rect x="163" y="139" width="12" height="12"/><rect x="185" y="128" width="9" height="9"/>
              <rect x="187" y="151" width="17" height="17"/><rect x="149" y="158" width="9" height="9"/>
            </g>
            <rect x="137" y="207" width="46" height="5" rx="2.5" fill="#0877c9"/>
            <path d="M59 72h-20v106h20M261 72h20v106h-20" stroke="#75b9e5" stroke-width="4" stroke-linecap="round"/>
            <path d="m51 60-12 12 12 12M269 60l12 12-12 12" stroke="#75b9e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`
      },
      pos: {
        id: "pos",
        name: "POS 机支付",
        action: "使用 POS 机支付",
        illustration: `
          <svg viewBox="0 0 320 250" fill="none" role="img" aria-label="POS 机支付示意图">
            <path d="M96 52h128a18 18 0 0 1 18 18v143a18 18 0 0 1-18 18H96a18 18 0 0 1-18-18V70a18 18 0 0 1 18-18Z" fill="#e8f4fd" stroke="#0877c9" stroke-width="4"/>
            <rect x="96" y="72" width="128" height="69" rx="9" fill="#ffffff" stroke="#bfd9ea" stroke-width="2"/>
            <path d="M117 111h57M117 123h83" stroke="#75b9e5" stroke-width="6" stroke-linecap="round"/>
            <circle cx="198" cy="91" r="8" fill="#0877c9"/>
            <g fill="#ffffff" stroke="#75b9e5" stroke-width="2">
              <rect x="98" y="158" width="25" height="19" rx="4"/><rect x="132" y="158" width="25" height="19" rx="4"/><rect x="166" y="158" width="25" height="19" rx="4"/><rect x="200" y="158" width="25" height="19" rx="4"/>
              <rect x="98" y="185" width="25" height="19" rx="4"/><rect x="132" y="185" width="25" height="19" rx="4"/><rect x="166" y="185" width="25" height="19" rx="4"/><rect x="200" y="185" width="25" height="19" rx="4"/>
            </g>
            <path d="M111 39V19h98v20" stroke="#0877c9" stroke-width="4" stroke-linejoin="round"/>
            <path d="M121 29h78" stroke="#75b9e5" stroke-width="4" stroke-linecap="round"/>
            <rect x="41" y="79" width="27" height="111" rx="13.5" fill="#ffffff" stroke="#0877c9" stroke-width="4" transform="rotate(-12 41 79)"/>
            <path d="m42 111 28-6M46 133l18-4" stroke="#75b9e5" stroke-width="4" stroke-linecap="round"/>
            <path d="M259 93c11 9 11 23 0 32M272 82c18 15 18 41 0 55" stroke="#0877c9" stroke-width="4" stroke-linecap="round"/>
          </svg>`
      },
      mobile: {
        id: "mobile",
        name: "手机支付",
        action: "开始支付",
        illustration: `
          <svg viewBox="0 0 320 250" fill="none" role="img" aria-label="手机支付示意图">
            <rect x="94" y="13" width="132" height="224" rx="27" fill="#e8f4fd" stroke="#0877c9" stroke-width="4"/>
            <rect x="108" y="43" width="104" height="155" rx="12" fill="#ffffff"/>
            <rect x="137" y="26" width="46" height="5" rx="2.5" fill="#75b9e5"/>
            <circle cx="160" cy="119" r="43" fill="#e8f4fd" stroke="#0877c9" stroke-width="3"/>
            <path d="M171 91h-17a12 12 0 0 0 0 24h13a12 12 0 0 1 0 24h-19M160 82v66" stroke="#0877c9" stroke-width="5" stroke-linecap="round"/>
            <path d="M143 215h34" stroke="#0877c9" stroke-width="5" stroke-linecap="round"/>
            <path d="M239 80c14 12 14 32 0 44M253 65c24 21 24 55 0 76M81 80c-14 12-14 32 0 44M67 65c-24 21-24 55 0 76" stroke="#75b9e5" stroke-width="4" stroke-linecap="round"/>
            <path d="m246 172 16 16 29-33" stroke="#0877c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`
      }
    };

    const methodOrder = ["qr", "pos", "mobile"];
    const paymentGrid = document.getElementById("paymentGrid");
    const pageTitleElement = document.getElementById("pageTitle");
    const qrDemoGroup = document.getElementById("qrDemo");
    const toast = document.getElementById("toast");
    let activeMethods = [];
    let toastTimer;

    // 单一扫码支付模式：不展示选择卡片，直接在原位置展示「左侧支付图 + 右侧二维码」
    const QR_TIMEOUT_SECONDS = 90;
    const paymentDisplay = { image: "assets/payment-methods-square.jpg" };
    let inlineQrActive = false;
    let qrState = "waiting";
    let qrDeadline = 0;
    let qrTimer = null;
    let qrRedirectTimer = null;

    const defaultOrder = {
      items: [
        { name: "カフェラテ", price: 340, quantity: 1, image: "product-cutout-27/331-08.webp" },
        { name: "タピオカミルクティー", price: 360, quantity: 1, image: "assets/tapioca.jpg" },
        { name: "抹茶ラテ", price: 340, quantity: 1, image: "assets/matcha.jpg" }
      ]
    };

    function loadOrder() {
      try {
        const saved = JSON.parse(localStorage.getItem("fujiOrder"));
        if (saved && Array.isArray(saved.items) && saved.items.length) return saved;
      } catch (error) {
        console.warn("使用默认演示订单。", error);
      }
      return defaultOrder;
    }

    function renderOrder() {
      const order = loadOrder();
      const items = order.items.filter(item => item && item.image);
      const quantity = items.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
      const total = items.reduce((sum, item) => sum + Number(item.price || 0) * (Number(item.quantity) || 1), 0);
      document.getElementById("orderTotal").textContent = `¥${total.toLocaleString("zh-CN")}`;
      document.getElementById("orderCount").textContent = `购买商品（${quantity}件）`;
      document.getElementById("orderThumbnails").innerHTML = items.slice(0, 3).map(item => `
        <img class="order-thumbnail" src="${item.image}" alt="${item.name}" title="${item.name}" width="164" height="164">
      `).join("");
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function stopQrTimer() {
      if (qrTimer !== null) window.clearInterval(qrTimer);
      qrTimer = null;
    }

    function stopQrRedirect() {
      if (qrRedirectTimer !== null) window.clearTimeout(qrRedirectTimer);
      qrRedirectTimer = null;
    }

    function currentLanguage() {
      try {
        return loadOrder().language || localStorage.getItem("fujiLanguage") || "zh";
      } catch (error) {
        return "zh";
      }
    }

    function buildInlineQrCode() {
      const host = document.getElementById("inlineQrCode");
      if (!host) return;
      host.replaceChildren();
      if (typeof window.QRCode !== "function") {
        host.textContent = "二维码加载失败";
        return;
      }
      const orderId = `FUJI-${Date.now()}`;
      const payload = `https://pay.example.com/fuji/checkout?order=${encodeURIComponent(orderId)}`;
      new window.QRCode(host, {
        text: payload,
        width: 262,
        height: 262,
        colorDark: "#102d43",
        colorLight: "#ffffff",
        correctLevel: window.QRCode.CorrectLevel.M
      });
    }

    function tickInlineQr() {
      if (qrState !== "waiting") return;
      const remaining = Math.max(0, Math.ceil((qrDeadline - Date.now()) / 1000));
      const node = document.getElementById("inlineCountdown");
      if (node) node.textContent = String(remaining);
      if (remaining === 0) setInlineQrState("failed", "expired");
    }

    function setInlineQrState(state, reason) {
      if (!inlineQrActive) return;
      qrState = state;
      stopQrTimer();
      stopQrRedirect();

      const overlay = document.getElementById("qrOverlay");
      if (!overlay) return;

      if (state === "waiting") {
        overlay.hidden = true;
        overlay.innerHTML = "";
        buildInlineQrCode();
        qrDeadline = Date.now() + QR_TIMEOUT_SECONDS * 1000;
        const node = document.getElementById("inlineCountdown");
        if (node) node.textContent = String(QR_TIMEOUT_SECONDS);
        qrTimer = window.setInterval(tickInlineQr, 250);
        document.title = "请扫码支付 - Fuji Electric";
      } else if (state === "paid") {
        overlay.hidden = false;
        overlay.innerHTML = `
          <div class="qr-result-icon success" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="41" stroke="currentColor" stroke-width="5"/><path d="m29 49 13 13 26-29" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h2 class="qr-result-title">支付成功</h2>
          <p class="qr-result-hint">正在为您制作饮品</p>
          <div class="making-dots" aria-label="制作中"><span></span><span></span><span></span></div>
        `;
        document.title = "支付成功 - Fuji Electric";
        try { sessionStorage.setItem("fujiPaymentStatus", "paid"); } catch (error) { console.warn(error); }
        const language = currentLanguage();
        qrRedirectTimer = window.setTimeout(() => {
          window.location.href = `preparation.html?auto=1&lang=${encodeURIComponent(language)}`;
        }, 1400);
      } else {
        const expired = reason === "expired";
        overlay.hidden = false;
        overlay.innerHTML = `
          <div class="qr-result-icon failed" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="41" stroke="currentColor" stroke-width="5"/><path d="m34 34 28 28M62 34 34 62" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>
          </div>
          <h2 class="qr-result-title">${expired ? "二维码已过期" : "支付失败"}</h2>
          <p class="qr-result-hint">${expired ? "支付超时，请重新获取二维码" : "支付未成功，请重试"}</p>
          <button class="qr-retry" id="qrRetry" type="button">重新支付</button>
        `;
        document.title = `${expired ? "二维码已过期" : "支付失败"} - Fuji Electric`;
        try { sessionStorage.setItem("fujiPaymentStatus", "failed"); } catch (error) { console.warn(error); }
        const retry = overlay.querySelector("#qrRetry");
        if (retry) retry.addEventListener("click", () => setInlineQrState("waiting"));
      }

      document.querySelectorAll("[data-qr-demo]").forEach(button => {
        const active = button.dataset.qrDemo === state;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function renderInlineQR() {
      inlineQrActive = true;
      paymentGrid.className = "payment-grid qr-mode";
      paymentGrid.innerHTML = `
        <section class="qr-media" aria-label="支付方式图片">
          <img src="${paymentDisplay.image}" alt="支持的支付方式：微信支付、支付宝、银联支付、云闪付">
        </section>
        <section class="qr-panel" id="qrPanel" aria-label="扫码支付">
          <h2 class="qr-title">请扫码支付</h2>
          <p class="qr-code-caption">QR CODE</p>
          <div class="qr-frame">
            <div class="qr-code" id="inlineQrCode" role="img" aria-label="订单支付二维码"></div>
          </div>
          <p class="qr-hint">请使用手机扫描二维码</p>
          <p class="qr-timer">剩余时间 <strong id="inlineCountdown">${QR_TIMEOUT_SECONDS}</strong> 秒</p>
          <div class="qr-overlay" id="qrOverlay" hidden></div>
        </section>
      `;
      qrDemoGroup.classList.add("visible");
      setInlineQrState("waiting");
    }

    function releaseInlineQR() {
      if (inlineQrActive) {
        stopQrTimer();
        stopQrRedirect();
        inlineQrActive = false;
        qrState = "waiting";
      }
      qrDemoGroup.classList.remove("visible");
    }

    function renderPaymentMethods() {
      const count = activeMethods.length;
      const singleQr = count === 1 && activeMethods[0].id === "qr";

      releaseInlineQR();
      pageTitleElement.textContent = singleQr ? "扫码支付" : "请选择支付方式";

      if (singleQr) {
        renderInlineQR();
      } else {
        document.title = "请选择支付方式 - Fuji Electric";
        paymentGrid.className = `payment-grid count-${count}`;
        paymentGrid.innerHTML = activeMethods.map((method, index) => `
          <article class="payment-card" data-method="${method.id}" style="animation-delay:${index * 35}ms">
            <h2 class="payment-name">${method.name}</h2>
            <div class="payment-illustration">${method.illustration}</div>
            <button class="pay-button" type="button" data-pay="${method.id}">${method.action}${arrowIcon}</button>
          </article>
        `).join("");
      }

      document.querySelectorAll("[data-method-count]").forEach(button => {
        const active = Number(button.dataset.methodCount) === count;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    // 后台配置入口：传入实际启用的支付方式 ID，组件自动切换 1/2/3 列。
    function configurePaymentMethods(methodIds) {
      const uniqueIds = [...new Set(methodIds)].filter(id => paymentMethods[id]).slice(0, 3);
      const validIds = uniqueIds.length ? uniqueIds : ["qr"];
      activeMethods = validIds.map(id => paymentMethods[id]);
      renderPaymentMethods();
    }

    window.configurePaymentMethods = configurePaymentMethods;

    // 后台可替换左侧支付图（1:1 展示，图片原样不裁剪）
    window.configurePaymentImage = src => {
      if (typeof src !== "string" || !src) return;
      paymentDisplay.image = src;
      if (inlineQrActive) renderInlineQR();
    };

    document.querySelectorAll("[data-qr-demo]").forEach(button => {
      button.addEventListener("click", () => setInlineQrState(button.dataset.qrDemo));
    });

    document.querySelectorAll("[data-method-count]").forEach(button => {
      button.addEventListener("click", () => {
        const count = Number(button.dataset.methodCount);
        configurePaymentMethods(methodOrder.slice(0, count));
        const url = new URL(window.location.href);
        url.searchParams.set("methods", String(count));
        window.history.replaceState(null, "", url);
      });
    });

    paymentGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-pay]");
      if (!button) return;
      const method = paymentMethods[button.dataset.pay];
      if (method.id === "qr") {
        window.location.href = "qr-payment.html";
        return;
      }
      showToast(`${method.name}：${method.action}（Demo）`);
    });

    document.querySelectorAll("[data-toast]").forEach(button => {
      button.addEventListener("click", () => showToast(button.dataset.toast));
    });

    const requestedCount = Math.min(3, Math.max(1, Number(new URLSearchParams(window.location.search).get("methods")) || 1));
    renderOrder();
    configurePaymentMethods(methodOrder.slice(0, requestedCount));
  </script>
  <script>
    // ===== 调试浮窗：点左侧 LOGO 唤出（默认不显示，上线前整块移除）=====
    (function initDebugDock() {
      const trigger = document.getElementById("debugTrigger");
      const dock = document.getElementById("debugDock");
      const panel = document.getElementById("debugPanel");
      if (!trigger || !dock || !panel) return;

      function place() {
        const rect = trigger.getBoundingClientRect();
        const left = Math.max(16, Math.min(rect.left, window.innerWidth - panel.offsetWidth - 16));
        const top = Math.max(16, Math.min(rect.bottom + 12, window.innerHeight - 220));
        panel.style.left = `${left}px`;
        panel.style.top = `${top}px`;
        panel.style.maxHeight = `${Math.max(240, window.innerHeight - top - 20)}px`;
      }
      function open() {
        dock.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        place();
      }
      function close() {
        dock.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      }

      trigger.addEventListener("click", event => {
        event.stopPropagation();
        if (dock.classList.contains("is-open")) close(); else open();
      });
      trigger.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
      });
      dock.addEventListener("click", event => {
        if (event.target.closest("[data-debug-close]")) close();
      });
      document.addEventListener("keydown", event => { if (event.key === "Escape") close(); });
      window.addEventListener("resize", () => { if (dock.classList.contains("is-open")) place(); });

      // 屏幕尺寸：直接写入本机配置再重载，不用离开当前页
      const device = window.FUJI_DEVICE || { mode: "auto", layout: "" };
      const REF = { s10: [1024, 768], m21: [1920, 1080], l27: [2560, 1440] };
      dock.querySelectorAll("[data-size-preset]").forEach(button => {
        const preset = button.dataset.sizePreset;
        const active = preset === "auto"
          ? device.mode === "auto"
          : device.mode === "preset" && device.layout === preset;
        button.setAttribute("aria-pressed", String(active));
        button.addEventListener("click", () => {
          const payload = preset === "auto"
            ? { mode: "auto", preset: null, layout: null, w: 0, h: 0 }
            : { mode: "preset", preset, layout: preset, w: REF[preset][0], h: REF[preset][1] };
          try { localStorage.setItem("fujiDevice", JSON.stringify(payload)); } catch (error) { console.warn(error); }
          window.location.reload();
        });
      });

      dock.querySelectorAll("[data-debug-nav]").forEach(button => {
        button.addEventListener("click", () => { window.location.href = button.dataset.debugNav; });
      });
    })();
  </script>
