<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuji Beverage Vending UI</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      /* 商品卡单层背景：上浅下白，无分界线，透明底饮品直接落在上面 */
      --card-surface: linear-gradient(180deg, #f4f8fb 0%, #ffffff 68%);
      --surface-2: #eef5fa;
      --border: #e4ebf0;
      --text: #102d43;
      --text-2: #6c7e8c;
      --accent: #0877c9;
      --accent-dark: #075b9e;
      --accent-deep: #064b83;
      --accent-weak: #e8f4fd;
      --danger: #8a9aa6;
      --radius: 0.875rem;
      --radius-sm: 0.5rem;
      --status-h: 3.5rem;
      --header-h: 6.5rem;
      --pager-h: 4rem;
      --grid-gap: 0.75rem;
      /* 左右区域比例（初始值 35:65）：只改这一个数字，广告区 / 商品区会按比例重排 */
      --ad-ratio: 35%;
    }

    /* ===== 视口等比缩放基准 =====
       设计稿 1920×1080，1rem = 16 设计像素。
       根字号随视口按 min(宽比, 高比) 缩放，所有尺寸（rem）随之等比变化，
       因此在 10 吋平板、27 吋大屏上看起来完全一致，只是整体放大/缩小。 */
    html {
      font-size: min(100vw / 120, 100vh / 67.5);
      font-size: min(100vw / 120, 100dvh / 67.5);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限：小屏（10 吋平板）上文字不会等比缩到看不清，改为版面更紧凑 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 47.5rem; }

    body {
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button, [role="switch"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 0.1875rem solid rgba(8, 119, 201, .28); outline-offset: 0.1875rem; }
    .hidden { display: none !important; }

    .vending-app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 40rem;
      overflow: hidden;
    }

    .status-bar {
      z-index: 30;
      display: flex;
      flex: 0 0 var(--status-h);
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0 1.75rem;
      color: #fff;
      background: var(--accent-dark);
      font-size: 0.8125rem;
      letter-spacing: .01em;
    }

    .status-left, .status-right, .status-item, .demo-control {
      display: flex;
      align-items: center;
    }

    .status-left, .status-right { gap: 1.75rem; }
    .status-item { gap: 0.5rem; white-space: nowrap; }
    .status-item svg { width: 1rem; height: 1rem; }
    .machine-id { color: #cfe8f8; }
    .machine-id strong { color: #fff; font-weight: 600; }

    .demo-control {
      gap: 0.5625rem;
      padding: 0.25rem 0.5rem 0.25rem 0.3125rem;
      border: 0.0625rem solid rgba(255,255,255,.28);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(0,0,0,.12);
      cursor: pointer;
    }

    .demo-badge {
      padding: 0.1875rem 0.4375rem;
      border-radius: 62.4375rem;
      color: var(--accent-deep);
      background: #fff;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .demo-label { font-size: 0.75rem; }
    .switch-track {
      position: relative;
      width: 2.125rem;
      height: 1.1875rem;
      border-radius: 62.4375rem;
      background: rgba(255,255,255,.32);
      transition: background .2s ease;
    }
    .switch-thumb {
      position: absolute;
      top: 0.1875rem;
      left: 0.1875rem;
      width: 0.8125rem;
      height: 0.8125rem;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s ease;
    }
    .demo-control[aria-checked="true"] .switch-track { background: #64d7ff; }
    .demo-control[aria-checked="true"] .switch-thumb { transform: translateX(0.9375rem); }

    .home-button, .fault-button, .mode-button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3125rem 0.875rem 0.3125rem 0.6875rem;
      border: 0.0625rem solid rgba(255,255,255,.34);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(255,255,255,.1);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .home-button svg, .fault-button svg, .mode-button svg { width: 0.9375rem; height: 0.9375rem; }
    .home-button:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.62); }
    .home-button:active { background: rgba(255,255,255,.3); }
    /* 预包装 / 饮品模式切换入口（Demo） */
    .mode-button:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.62); }
    .mode-button:active { background: rgba(255,255,255,.3); }
    /* 临时 Demo：进入「暂停服务」画面 */
    .fault-button {
      border-color: rgba(255,196,120,.46);
      color: #ffdda8;
      background: rgba(224,145,47,.16);
    }
    .fault-button:hover { background: rgba(224,145,47,.3); border-color: rgba(255,196,120,.78); }
    .fault-button:active { background: rgba(224,145,47,.4); }

    .main-header {
      z-index: 25;
      display: flex;
      flex: 0 0 var(--header-h);
      align-items: center;
      gap: 1.5rem;
      padding: 0 2.125rem;
      border-bottom: 0.0625rem solid var(--border);
      background: var(--surface);
    }

    .brand {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.625rem;
      color: #101c26;
      font-size: 1.25rem;
      font-weight: 750;
      white-space: nowrap;
    }
    .brand-mark {
      color: var(--accent);
      font-size: 1.9375rem;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -.12em;
      transform: skew(-8deg);
    }

    .pill-button, .category-button, .language-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5625rem;
      min-height: 3.25rem;
      border: 0.0625rem solid var(--border);
      border-radius: 62.4375rem;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .pill-button { padding: 0 1.4375rem; }
    .pill-button svg, .language-button svg { width: 1.25rem; height: 1.25rem; }
    .pill-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }

    .category-nav {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .category-button {
      min-width: 8.25rem;
      padding: 0 1.5rem;
      /* 触摸屏无悬浮态：默认就带浅蓝底与描边，让用户一眼看出这是可点的按钮 */
      border-color: #b9d9ed;
      background: var(--accent-weak);
      font-size: 1.0625rem;
      font-weight: 650;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .14s ease;
    }
    .category-button svg { width: 1.125rem; height: 1.125rem; }
    .category-button:hover { border-color: #9ecbe8; background: #ddedfa; }
    .category-button:active { transform: translateY(0.0625rem); border-color: #8dc3e5; background: #d2e8f8; }
    .category-button.active,
    .category-button.active:hover { color: #fff; border-color: var(--accent); background: var(--accent); }
    .category-button.active:active { transform: translateY(0.0625rem); background: var(--accent-dark); }
    .category-button .chevron { width: 0.875rem; height: 0.875rem; margin-left: 0.3125rem; }
    .language-button { flex: 0 0 auto; padding: 0 1.3125rem; }
    .language-picker { position: relative; display: flex; flex: 0 0 auto; }
    .language-picker .caret { transition: transform .18s ease; }
    .language-picker.open .caret { transform: rotate(180deg); }
    .language-menu {
      position: absolute;
      z-index: 70;
      top: calc(100% + 0.75rem);
      right: 0;
      display: none;
      min-width: 14.125rem;
      padding: 0.625rem;
      border: 0.0625rem solid var(--border);
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.125rem 2.5rem rgba(16,45,67,.16);
    }
    .language-picker.open .language-menu { display: block; }
    .language-option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 3.5rem;
      padding: 0 1rem;
      border: 0;
      border-radius: 0.8125rem;
      color: var(--text);
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .language-option:hover { background: var(--accent-weak); }
    .language-option.active { color: #fff; background: var(--accent); }
    .language-option .lang-flag { font-size: 1.3125rem; line-height: 1; }

    .workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .ad-sidebar {
      position: relative;
      /* 左右比例 35 : 65 —— 广告区吃 35%，商品区用剩余空间自适应 */
      flex: 0 0 var(--ad-ratio);
      min-width: 0;
      overflow: hidden;
      /* 图片按 contain 显示后会留出左右（或上下）留白，用中性底衬住海报 */
      background: linear-gradient(180deg, #f1f4f7 0%, #e7edf2 55%, #dfe6ec 100%);
    }
    .ad-slides {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ad-slide {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      /* 只做等比缩放：不拉伸、不裁切，整张海报始终完整可见 */
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transition: opacity .7s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
    .ad-slide.active { opacity: 1; }
    .ad-dots {
      position: absolute;
      right: 0;
      bottom: 1.125rem;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      pointer-events: none;
    }
    .ad-dots span {
      width: 0.4375rem;
      height: 0.4375rem;
      border-radius: 62.4375rem;
      background: rgba(255,255,255,.58);
      box-shadow: 0 0.0625rem 0.3125rem rgba(12,45,70,.35);
      transition: width .3s ease, background .3s ease;
    }
    .ad-dots span.active { width: 1.375rem; background: #fff; }

    .product-stage {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 1.75rem 2rem 0;
      overflow: hidden;
    }

    .product-viewport {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .product-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .42s cubic-bezier(.22,.8,.28,1);
      will-change: transform;
    }

    .product-page {
      --cols: 3;
      --rows: 2;
      display: grid;
      flex: 0 0 100%;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      align-content: stretch;
      justify-content: stretch;
      justify-items: stretch;
      gap: var(--grid-gap);
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    .workspace.ad-off .ad-sidebar { display: none; }
    .workspace.ad-off .product-stage { padding: 1.25rem 1.625rem 0; }
    .workspace.ad-off .product-card { grid-template-rows: 72% 28%; }
    /* 多页时左右留出箭头通道，避免箭头压住最后一列商品的「＋」 */
    .product-stage.has-pages { padding-right: 4.625rem; padding-left: 4.625rem; }
    .workspace.ad-off .product-stage.has-pages { padding: 1.25rem 4.625rem 0; }

    .slide-arrow {
      position: absolute;
      z-index: 6;
      top: calc((100% - var(--pager-h)) / 2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(2.75rem, 3vw, 3.5rem);
      aspect-ratio: 1;
      padding: 0;
      border: 0.0625rem solid rgba(255,255,255,.72);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, #2b8fd6, #0f6cb0);
      box-shadow: 0 0.625rem 1.625rem rgba(11,84,140,.3);
      cursor: pointer;
      transform: translateY(-50%);
      transition: opacity .22s ease, transform .22s ease, box-shadow .22s ease;
    }
    .slide-arrow.next { right: 0.625rem; }
    .slide-arrow.prev { left: 0.625rem; }
    .slide-arrow svg { width: 46%; height: 46%; }
    .slide-arrow:hover { transform: translateY(-50%) scale(1.07); box-shadow: 0 0.875rem 2rem rgba(11,84,140,.38); }
    .slide-arrow:disabled { opacity: 0; pointer-events: none; }
    .product-stage.single-page .slide-arrow { display: none; }

    /* 商品卡：单层背景。饮品是透明底素材，直接呈现在卡片底色上，
       不再有「图片自带背景 + 卡片背景」双层的方形底板。 */
    .product-card {
      position: relative;
      display: grid;
      grid-template-rows: 68% 32%;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 0.0625rem solid rgba(214,225,233,.9);
      border-radius: var(--radius);
      background: var(--card-surface);
      box-shadow: 0 0.3125rem 1.125rem rgba(33,73,101,.06);
      animation: card-in .24s ease both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(0.375rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 商品图区：透明，只负责给主体留出呼吸空间（无独立底色、无圆角、无投影框） */
    .product-media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .product-media img {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      height: 100%;
      padding: 2% 5% 0;
      object-fit: contain;
      object-position: center bottom;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      filter: drop-shadow(0 0.75rem 1.125rem rgba(24,58,84,.13));
      transition: transform .25s ease;
    }
    .product-card:hover .product-media img { transform: translateY(-2%) scale(1.02); }
    /* Hot / Iced：左上角固定位置、统一尺寸，颜色 + 图标双通道辨识 */
    .temperature-tag {
      position: absolute;
      z-index: 2;
      top: 0.75rem;
      left: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3125rem;
      box-sizing: border-box;
      min-width: 5.125rem;
      height: 1.875rem;
      padding: 0 0.625rem;
      border-radius: 62.4375rem;
      color: #fff;
      font-size: clamp(0.625rem, .68vw, 0.8125rem);
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 0.25rem 0.625rem rgba(0,0,0,.14), inset 0 0.0625rem 0 rgba(255,255,255,.28);
    }
    .temperature-tag svg { width: 0.875rem; height: 0.875rem; flex: 0 0 0.875rem; }
    .temperature-tag.is-hot { background: linear-gradient(135deg, #ffa154, #ea6a18); }
    .temperature-tag.is-iced { background: linear-gradient(135deg, #57b7ef, #147cc7); }

    /* 信息区：左「名称 / 价格」两行，右圆形加购按钮 */
    .product-info {
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.5rem, .8vw, 1rem);
      min-height: 0;
      padding: clamp(0.5rem, .78vw, 0.9375rem) clamp(0.6875rem, 1vw, 1.1875rem);
      background: transparent;
    }
    .product-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.4375rem;
      min-width: 0;
    }
    /* 阅读层级：名称（加粗加大） > 价格（品牌蓝独立一行） > 加购按钮 */
    .product-name {
      overflow: hidden;
      margin: 0;
      color: #102d43;
      font-size: clamp(1rem, 1.3vw, 1.5rem);
      font-weight: 800;
      letter-spacing: -.012em;
      line-height: 1.14;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .product-price {
      display: flex;
      align-items: baseline;
      gap: 0.125rem;
      margin: 0;
      color: var(--accent);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }
    .product-price .price-currency {
      font-size: clamp(0.6875rem, .8vw, 0.9375rem);
      font-weight: 750;
      opacity: .92;
    }
    .product-price .price-amount {
      font-size: clamp(1rem, 1.14vw, 1.3125rem);
      letter-spacing: .004em;
    }
    /* 加购按钮：统一圆形 + 品牌蓝描边，视觉更突出 */
    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(2.125rem, 2.5vw, 2.875rem);
      aspect-ratio: 1;
      padding: 0;
      border: 0.125rem solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      background: #fff;
      box-shadow: 0 0.25rem 0.75rem rgba(8,119,201,.16);
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .14s ease;
    }
    .add-button:hover {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0.5rem 1.125rem rgba(8,119,201,.32);
      transform: translateY(-0.0625rem);
    }
    .add-button:active { transform: scale(.94); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.24); }
    .add-button svg { width: 50%; height: 50%; stroke-width: 2.4; }

    .pagination {
      display: flex;
      flex: 0 0 var(--pager-h);
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      color: var(--text-2);
      font-size: 0.8125rem;
    }
    .page-numbers { display: inline-flex; align-items: center; gap: 0.625rem; }
    .page-nav,
    .page-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.75rem;
      height: 2.625rem;
      padding: 0 0.875rem;
      border: 0.0625rem solid #c6dbe8;
      border-radius: 0.75rem;
      color: var(--accent-dark);
      background: linear-gradient(180deg, #ffffff, #f2f8fc);
      box-shadow: 0 0.1875rem 0.5rem rgba(24,66,96,.09), inset 0 0.0625rem 0 #fff;
      font-size: 0.9375rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .page-nav:hover:not(:disabled),
    .page-number:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-0.125rem);
      box-shadow: 0 0.5625rem 1.125rem rgba(8,119,201,.2);
    }
    .page-nav:active:not(:disabled),
    .page-number:active:not(.active) { transform: translateY(0); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.14); }
    .page-number.active {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, #2f95da, #0e6bad);
      box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.32), inset 0 0.0625rem 0 rgba(255,255,255,.28);
    }
    .page-nav:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; background: #f5f9fc; }
    .page-nav svg { width: 1.125rem; height: 1.125rem; }
    .page-summary { margin-left: 0.875rem; color: var(--text-2); font-size: 0.875rem; white-space: nowrap; }
    /* 小屏（10 吋平板）上翻页行右侧会让出悬浮购物车按钮的位置，避免摘要被按钮压住 */
    @media (max-width: 1100px) {
      .pagination { padding-right: 4rem; }
    }

    .cart-panel {
      position: absolute;

    const SUPPORTED_LANGUAGES = ["ja", "zh", "en", "ko"];

    function resolveLanguage() {
      const requested = new URLSearchParams(window.location.search).get("lang");
      if (SUPPORTED_LANGUAGES.includes(requested)) return requested;
      try {
        const saved = localStorage.getItem("fujiLanguage");
        if (SUPPORTED_LANGUAGES.includes(saved)) return saved;
      } catch (error) {
        console.warn("语言偏好读取失败。", error);
      }
      return "ja";
    }

    let currentLanguage = resolveLanguage();

    function t(key, vars) {
      const dictionary = I18N[currentLanguage] || I18N.ja;
      const value = key.split(".").reduce((node, part) => (node ? node[part] : undefined), dictionary);
      const template = typeof value === "string" ? value : key;
      return vars
        ? template.replace(/\{(\w+)\}/g, (match, name) => (vars[name] !== undefined ? vars[name] : match))
        : template;
    }

      productStage.classList.toggle("has-pages", pages > 1);
      slidePrev.disabled = current <= 0;
      slideNext.disabled = current >= pages - 1;
      pagePrevButton.disabled = current <= 0;
      pageNextButton.disabled = current >= pages - 1;
      pageSummary.textContent = t("pageOf", { current: current + 1, total: pages });
      visibleCount.textContent = t("items", { n: shown });

      pageNumbers.querySelectorAll("[data-page]").forEach(button => {
        const active = Number(button.dataset.page) === current;
        button.classList.toggle("active", active);
        if (active) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function goToPage(next) {
      const target = Math.max(0, Math.min(pageCount() - 1, next));
      if (target === state.page) return;
      state.page = target;
      updatePager();
    }

    function renderProducts() {
      workspace.classList.toggle("ad-off", !state.adEnabled);
      const perPage = pageSize();
      const pages = pageCount();
      state.page = Math.max(0, Math.min(state.page, pages - 1));

      adToggle.setAttribute("aria-checked", String(state.adEnabled));
      adState.textContent = state.adEnabled ? "ON" : "OFF";

      productTrack.innerHTML = Array.from({ length: pages }, (_, pageIndex) => {
        const slice = products.slice(pageIndex * perPage, pageIndex * perPage + perPage);
        // 列数按每页容量决定（而非本页实际件数），保证末页卡片与前面页同尺寸
        const cols = perPage >= 7 ? 4 : 3;
        // 至少保留两行高度，避免末页只有 1 件时卡片被拉成整屏
        const rows = Math.max(2, Math.ceil(slice.length / cols));
        return `
        <div class="product-page" style="--cols:${cols};--rows:${rows}">
          ${slice.map((product, index) => productCardMarkup(product, index)).join("")}
        </div>`;
      }).join("");

      pageNumbers.innerHTML = Array.from({ length: pages }, (_, index) => `
        <button class="page-number${index === state.page ? " active" : ""}" type="button" data-page="${index}" aria-label="${t("pageNumber", { n: index + 1 })}">${index + 1}</button>
      `).join("");

      updatePager();
    }

    function renderCart(highlightId) {
      const entries = [...state.cart.entries()]
        .map(([id, quantity]) => ({ product: getProduct(id), quantity }))
        .filter(entry => entry.product && entry.quantity > 0);
      const itemCount = entries.reduce((sum, entry) => sum + entry.quantity, 0);
      const total = entries.reduce((sum, entry) => sum + entry.product.price * entry.quantity, 0);

      document.querySelectorAll("[data-cart-count]").forEach(element => {
        element.textContent = itemCount;
      });
      document.getElementById("cartTotalLabel").textContent = t("cartTotal", { n: itemCount });
      cartTotal.textContent = yen(total);
      cartItems.classList.toggle("scrollable", entries.length > 3);

      if (!entries.length) {
        cartItems.innerHTML = `<div class="empty-cart">${t("emptyCart")}</div>`;
        return;
      }

      cartItems.innerHTML = entries.map(({ product, quantity }) => {
        const name = productName(product);
        const variant = state.cartVariants.get(product.id) || { temperature: product.temperature, size: "regular" };
        const highlight = highlightId === product.id ? " is-new" : "";
        return `
        <article class="cart-item${highlight}">
          <img class="cart-thumb" src="${product.image}" alt="${name}" width="210" height="210">
          <div class="cart-item-main">
            <h3 class="cart-item-name"><span class="cart-item-title" title="${name}">${name}</span><span class="cart-item-qty">× ${quantity}</span></h3>
            <p class="cart-item-variant">${variantLabel(variant)}</p>
          </div>
          <div class="cart-item-tail">
            <span class="cart-item-price">${yen(product.price * quantity)}</span>
            <button class="remove-item" type="button" data-remove="${product.id}" aria-label="${t("removeAria", { name })}">${icons.trash}</button>
          </div>
        </article>
      `;
      }).join("");
    }

    function setCartOpen(open) {
      state.cartOpen = open;
      cartPanel.classList.toggle("closed", !open);
      openCartButton.classList.toggle("hidden", open);
      cartPanel.setAttribute("aria-hidden", String(!open));
    }

    function cartItemCount() {
      return [...state.cart.values()].reduce((sum, quantity) => sum + (Number(quantity) || 0), 0);
    }

    const ORDER_LIMIT_NOTICE_MS = 3000;
    const orderLimitLayer = document.getElementById("orderLimitLayer");
    const orderLimitText = document.getElementById("orderLimitText");
    let orderLimitTimer;
    let orderLimitCloseTimer;

    function hideOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      orderLimitLayer.classList.remove("show");
      orderLimitCloseTimer = window.setTimeout(() => {
        orderLimitLayer.hidden = true;
      }, 220);
    }

    function showOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      orderLimitText.textContent = t("limitReached", { max: MAX_ORDER_ITEMS });
      orderLimitLayer.hidden = false;
      requestAnimationFrame(() => orderLimitLayer.classList.add("show"));
      orderLimitTimer = window.setTimeout(hideOrderLimit, ORDER_LIMIT_NOTICE_MS);
    }

    function addToCart(id) {
      if (cartItemCount() >= MAX_ORDER_ITEMS) {
        showOrderLimit();
        return;
      }
      state.cart.set(id, (state.cart.get(id) || 0) + 1);
      renderCart();
      showToast(t("added", { name: productName(getProduct(id)) }));
    }

    const customizationLayer = document.getElementById("customizationLayer");
    const customDraft = {
      productId: null,
      temperature: "hot",
      size: "medium",
      sweetness: "standard",
      milk: "milk",
      quantity: 1
    };
    let preserveCustomDraft = false;

    function resetCustomization(productId) {
      const product = getProduct(productId);
      Object.assign(customDraft, {
        productId,
        temperature: product ? product.temperature : "hot",
        size: "medium",
        sweetness: "standard",
        milk: "milk",
        quantity: 1
      });
    }

    function renderCustomization() {
      const product = getProduct(customDraft.productId);
      if (!product) return;
      const name = productName(product);
      const image = document.getElementById("customProductImage");
      image.src = product.image;
      image.alt = name;
      document.getElementById("customProductName").textContent = name;
      document.getElementById("customProductPrice").textContent = yen(product.price);
      document.getElementById("customProductDescription").textContent = productDescription(product);
      document.getElementById("customQuantity").textContent = customDraft.quantity;
      document.getElementById("customTotal").textContent = yen(product.price * customDraft.quantity);
      document.querySelectorAll("[data-option-group]").forEach(group => {
        const groupName = group.dataset.optionGroup;
        group.querySelectorAll("[data-value]").forEach(button => {
          const active = customDraft[groupName] === button.dataset.value;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      });
    }

    function openCustomization(productId) {
      if (customDraft.productId !== productId || !preserveCustomDraft) resetCustomization(productId);
      preserveCustomDraft = false;
      renderCustomization();
      customizationLayer.classList.add("open");
      customizationLayer.setAttribute("aria-hidden", "false");
    }

    function hideCustomization(cancelChanges) {
      customizationLayer.classList.remove("open");
      customizationLayer.setAttribute("aria-hidden", "true");
      preserveCustomDraft = !cancelChanges;
      if (cancelChanges) customDraft.productId = null;
    }

    document.getElementById("collapseCustomization").addEventListener("click", () => hideCustomization(false));
    document.getElementById("closeCustomization").addEventListener("click", () => hideCustomization(true));
    document.getElementById("customizationBackdrop").addEventListener("click", () => hideCustomization(false));

    document.querySelector(".custom-options").addEventListener("click", event => {
      const button = event.target.closest("[data-value]");
      const group = event.target.closest("[data-option-group]");
      if (!button || !group) return;
      customDraft[group.dataset.optionGroup] = button.dataset.value;
      renderCustomization();
    });

    document.querySelector(".custom-quantity").addEventListener("click", event => {
      const button = event.target.closest("[data-custom-quantity]");
      if (!button) return;
      const change = button.dataset.customQuantity === "increase" ? 1 : -1;
      const nextQuantity = Math.max(1, customDraft.quantity + change);
      if (change > 0 && nextQuantity > MAX_ORDER_ITEMS - cartItemCount()) {
        showOrderLimit();
        return;
      }
      customDraft.quantity = Math.min(MAX_ORDER_ITEMS, nextQuantity);
      renderCustomization();
    });

    let cartRevealTimer;
    document.getElementById("addCustomizedOrder").addEventListener("click", () => {
      const product = getProduct(customDraft.productId);
      if (!product) return;
      if (customDraft.quantity > MAX_ORDER_ITEMS - cartItemCount()) {
        showOrderLimit();
        return;
      }
      state.cart.set(product.id, (state.cart.get(product.id) || 0) + customDraft.quantity);
      state.cartVariants.set(product.id, {
        temperature: `temperature.${customDraft.temperature}`,
        size: `size.${customDraft.size}`,
        sweetness: `sweetness.${customDraft.sweetness}`,
        milk: `milk.${customDraft.milk}`
      });
      const quantity = customDraft.quantity;
      renderCart();
      hideCustomization(true);
      showToast(t("addedCustom", { name: productName(product), qty: quantity }));
      // 配置层收起后，在右侧展开购物车，并高亮刚加入的饮品
      window.clearTimeout(cartRevealTimer);
      cartRevealTimer = window.setTimeout(() => {
        setCartOpen(true);
        renderCart(product.id);
        if (cartItems.classList.contains("scrollable")) cartItems.scrollTop = cartItems.scrollHeight;
      }, 200);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && customizationLayer.classList.contains("open")) hideCustomization(true);
    });

    adToggle.addEventListener("click", () => {
      state.adEnabled = !state.adEnabled;
      state.page = 0;
      renderProducts();
      const count = Math.min(products.length, pageSize());
      showToast(state.adEnabled ? t("adOn", { n: count }) : t("adOff", { n: count }));
    });

    slideNext.addEventListener("click", () => goToPage(state.page + 1));
    slidePrev.addEventListener("click", () => goToPage(state.page - 1));
    pageNextButton.addEventListener("click", () => goToPage(state.page + 1));
    pagePrevButton.addEventListener("click", () => goToPage(state.page - 1));
    pageNumbers.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (button) goToPage(Number(button.dataset.page));
    });

    document.getElementById("demoHomeButton").addEventListener("click", () => {
      window.location.href = "welcome.html";
    });

    document.getElementById("modePackagedButton").addEventListener("click", () => {
      window.location.href = `packaged.html?lang=${currentLanguage}`;
    });

    document.getElementById("demoFaultButton").addEventListener("click", () => {
      window.location.href = `out-of-service.html?lang=${currentLanguage}`;
    });

    const adSlides = Array.from(document.querySelectorAll(".ad-slide"));
    const adDots = Array.from(document.querySelectorAll(".ad-dots span"));
    let adSlideIndex = 0;
    let adSlideTimer = null;

    function showAdSlide(nextIndex) {
      adSlideIndex = (nextIndex + adSlides.length) % adSlides.length;
      adSlides.forEach((slide, index) => slide.classList.toggle("active", index === adSlideIndex));
      adDots.forEach((dot, index) => dot.classList.toggle("active", index === adSlideIndex));
    }

    function startAdRotation() {
      if (adSlideTimer !== null || adSlides.length < 2) return;
      adSlideTimer = window.setInterval(() => showAdSlide(adSlideIndex + 1), 6000);
    }

    function stopAdRotation() {
      if (adSlideTimer === null) return;
      window.clearInterval(adSlideTimer);
      adSlideTimer = null;
    }

    startAdRotation();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopAdRotation();
      else startAdRotation();
    });

    productTrack.addEventListener("click", event => {
      const addButton = event.target.closest("[data-add]");
      if (addButton) {
        addToCart(Number(addButton.dataset.add));
        return;
      }
      const customizeButton = event.target.closest("[data-customize]");
      if (customizeButton) openCustomization(Number(customizeButton.dataset.customize));
    });

    cartItems.addEventListener("click", event => {
      const remove = event.target.closest("[data-remove]");
      if (!remove) return;
      const id = Number(remove.dataset.remove);
      state.cart.delete(id);
      state.cartVariants.delete(id);
      renderCart();
    });

    document.getElementById("closeCart").addEventListener("click", () => setCartOpen(false));
    openCartButton.addEventListener("click", () => setCartOpen(true));
    document.getElementById("checkoutButton").addEventListener("click", () => {
      if (!state.cart.size) {
        showToast(t("selectProduct"));
        return;
      }
      const order = {
        items: [...state.cart.entries()].map(([id, quantity]) => {
          const product = getProduct(id);
          const variant = state.cartVariants.get(id) || { temperature: product.temperature, size: "regular" };
          return { productId: product.id, name: productName(product), price: product.price, quantity, image: product.image, variant: variantLabel(variant), variantData: variant };
        }),
        language: currentLanguage
      };
      try {
        localStorage.setItem("fujiOrder", JSON.stringify(order));
      } catch (error) {
        console.warn("订单暂存不可用，将使用默认演示订单。", error);
      }
      window.location.href = "payment.html";
    });

    document.querySelectorAll("[data-toast]").forEach(button => {
      button.addEventListener("click", () => showToast(button.dataset.toast));
    });

    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-category]").forEach(item => {
          item.classList.toggle("active", item === button);
          item.removeAttribute("aria-current");
        });
        button.setAttribute("aria-current", "page");
        showToast(t("categoryToast", { name: t(button.dataset.labelKey) }));
      });
    });

    const languagePicker = document.getElementById("languagePicker");
    const languageButton = document.getElementById("languageButton");
    const languageMenu = document.getElementById("languageMenu");

    function setLanguageMenuOpen(open) {
      languagePicker.classList.toggle("open", open);
      languageButton.setAttribute("aria-expanded", String(open));
    }

    function applyLanguage(language, options = {}) {
      currentLanguage = I18N[language] ? language : "ja";
      document.documentElement.lang = I18N[currentLanguage].htmlLang || currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-aria]").forEach(element => {
        element.setAttribute("aria-label", t(element.dataset.i18nAria));
      });
      document.querySelectorAll("[data-i18n-title]").forEach(element => {
        element.setAttribute("title", t(element.dataset.i18nTitle));
      });
      document.querySelectorAll("[data-i18n-toast]").forEach(element => {
        element.dataset.toast = t(element.dataset.i18nToast);
      });

      document.getElementById("languageLabel").textContent = t("langName");
      languageMenu.setAttribute("aria-label", t("languageMenu"));
      languageButton.setAttribute("aria-label", t("languageMenu"));
      languageMenu.querySelectorAll("[data-set-language]").forEach(option => {
        const active = option.dataset.setLanguage === currentLanguage;
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", String(active));
      });

      renderProducts();
      renderCart();
      if (customizationLayer.classList.contains("open")) renderCustomization();

      if (options.persist !== false) {
        try {
          localStorage.setItem("fujiLanguage", currentLanguage);
        } catch (error) {
          console.warn("语言偏好无法保存。", error);
        }
      }
    }

    languageButton.addEventListener("click", event => {
      event.stopPropagation();
      setLanguageMenuOpen(!languagePicker.classList.contains("open"));
    });

    languageMenu.addEventListener("click", event => {
      const option = event.target.closest("[data-set-language]");
      if (!option) return;
      event.stopPropagation();
      setLanguageMenuOpen(false);
      applyLanguage(option.dataset.setLanguage);
    });

    document.addEventListener("click", event => {
      if (!languagePicker.contains(event.target)) setLanguageMenuOpen(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setLanguageMenuOpen(false);
    });

    applyLanguage(currentLanguage, { persist: false });
    setCartOpen(state.cartOpen);
    if (previewParams.get("customize") === "1") {
      openCustomization(Number(previewParams.get("product")) || 1);
    }
  </script>
</body>
</html>
