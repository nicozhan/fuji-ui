<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuji Beverage Vending UI</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      --surface-2: #eef5fa;
      --border: #e4ebf0;
      --text: #102d43;
      --text-2: #6c7e8c;
      --accent: #0877c9;
      --accent-dark: #075b9e;
      --accent-deep: #064b83;
      --accent-weak: #e8f4fd;
      --danger: #8a9aa6;
      --radius: 14px;
      --radius-sm: 8px;
      --status-h: 56px;
      --header-h: 104px;
      --pager-h: 64px;
      --grid-gap: 12px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 760px; }

    body {
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button, [role="switch"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid rgba(8, 119, 201, .28); outline-offset: 3px; }
    .hidden { display: none !important; }

    .vending-app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
    }

    .status-bar {
      z-index: 30;
      display: flex;
      flex: 0 0 var(--status-h);
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 28px;
      color: #fff;
      background: var(--accent-dark);
      font-size: 13px;
      letter-spacing: .01em;
    }

    .status-left, .status-right, .status-item, .demo-control {
      display: flex;
      align-items: center;
    }

    .status-left, .status-right { gap: 28px; }
    .status-item { gap: 8px; white-space: nowrap; }
    .status-item svg { width: 16px; height: 16px; }
    .machine-id { color: #cfe8f8; }
    .machine-id strong { color: #fff; font-weight: 600; }

    .demo-control {
      gap: 9px;
      padding: 4px 8px 4px 5px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.12);
      cursor: pointer;
    }

    .demo-badge {
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--accent-deep);
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .demo-label { font-size: 12px; }
    .switch-track {
      position: relative;
      width: 34px;
      height: 19px;
      border-radius: 999px;
      background: rgba(255,255,255,.32);
      transition: background .2s ease;
    }
    .switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s ease;
    }
    .demo-control[aria-checked="true"] .switch-track { background: #64d7ff; }
    .demo-control[aria-checked="true"] .switch-thumb { transform: translateX(15px); }

    .home-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 11px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,.1);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .home-button svg { width: 15px; height: 15px; }
    .home-button:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.62); }
    .home-button:active { background: rgba(255,255,255,.3); }

    .main-header {
      z-index: 25;
      display: flex;
      flex: 0 0 var(--header-h);
      align-items: center;
      gap: 24px;
      padding: 0 34px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .brand {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      color: #101c26;
      font-size: 20px;
      font-weight: 750;
      white-space: nowrap;
    }
    .brand-mark {
      color: var(--accent);
      font-size: 31px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -.12em;
      transform: skew(-8deg);
    }

    .pill-button, .category-button, .language-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .pill-button { padding: 0 23px; }
    .pill-button svg, .language-button svg { width: 20px; height: 20px; }
    .pill-button:hover, .category-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }

    .category-nav {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }
    .category-button {
      min-width: 132px;
      padding: 0 24px;
      border-color: transparent;
      font-size: 15px;
      font-weight: 650;
    }
    .category-button svg { width: 18px; height: 18px; }
    .category-button.active { color: #fff; background: var(--accent); }
    .category-button .chevron { width: 14px; height: 14px; margin-left: 5px; }
    .language-button { flex: 0 0 auto; padding: 0 21px; }
    .language-picker { position: relative; display: flex; flex: 0 0 auto; }
    .language-picker .caret { transition: transform .18s ease; }
    .language-picker.open .caret { transform: rotate(180deg); }
    .language-menu {
      position: absolute;
      z-index: 70;
      top: calc(100% + 12px);
      right: 0;
      display: none;
      min-width: 226px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(16,45,67,.16);
    }
    .language-picker.open .language-menu { display: block; }
    .language-option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 0;
      border-radius: 13px;
      color: var(--text);
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .language-option:hover { background: var(--accent-weak); }
    .language-option.active { color: #fff; background: var(--accent); }
    .language-option .lang-flag { font-size: 21px; line-height: 1; }

    .workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .ad-sidebar {
      position: relative;
      flex: 0 0 420px;
      min-width: 0;
      overflow: hidden;
      background: #e8f5fd;
    }
    .ad-slides { position: absolute; inset: 0; }
    .ad-slide {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transition: opacity .7s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
    .ad-slide.active { opacity: 1; }
    .ad-dots {
      position: absolute;
      right: 0;
      bottom: 18px;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }
    .ad-dots span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 1px 5px rgba(12,45,70,.35);
      transition: width .3s ease, background .3s ease;
    }
    .ad-dots span.active { width: 22px; background: #fff; }

    .product-stage {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 28px 32px 0;
      overflow: hidden;
    }

    .product-grid {
      --cols: 3;
      --rows: 2;
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      align-content: stretch;
      justify-content: stretch;
      justify-items: stretch;
      gap: var(--grid-gap);
      width: 100%;
      min-height: 0;
    }
    .workspace.ad-off .ad-sidebar { display: none; }
    .workspace.ad-off .product-stage { padding: 20px 26px 0; }
    .workspace.ad-off .product-grid { --cols: 4; --rows: 2; }
    .workspace.ad-off .product-card { grid-template-rows: 74% 26%; }

    .product-card {
      position: relative;
      display: grid;
      grid-template-rows: 70% 30%;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(218,229,236,.8);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(33,73,101,.06);
      animation: card-in .24s ease both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-media {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #e8edf0;
    }
    .product-media img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 2% 6% 1%;
      object-fit: contain;
      transition: transform .25s ease;
    }
    .product-card:hover .product-media img { transform: scale(1.025); }
    .temperature-tag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: clamp(10px, .68vw, 13px);
      font-weight: 700;
      line-height: 1;
    }

    .product-info {
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 0;
      padding: clamp(8px, .85vw, 16px) clamp(11px, 1vw, 19px);
      background: rgba(255,255,255,.88);
    }
    .product-copy { min-width: 0; }
    .product-name {
      overflow: hidden;
      margin: 0 0 4px;
      font-size: clamp(12px, .9vw, 17px);
      font-weight: 700;
      line-height: 1.18;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .product-price {
      margin: 0;
      color: #172d3c;
      font-size: clamp(13px, .95vw, 19px);
      font-weight: 750;
      line-height: 1.15;
    }
    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(31px, 2.25vw, 43px);
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid #c9e2f1;
      border-radius: 50%;
      color: var(--accent);
      background: rgba(255,255,255,.88);
      cursor: pointer;
      transition: color .18s ease, background .18s ease;
    }
    .add-button:hover { color: #fff; background: var(--accent); }
    .add-button svg { width: 45%; height: 45%; }

    .pagination {
      display: flex;
      flex: 0 0 var(--pager-h);
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--text-2);
      font-size: 13px;
    }
    .page-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 31px;
      height: 31px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
    }
    .page-button.active { color: #fff; background: var(--accent); }
    .page-button.next { color: #fff; background: var(--accent); border-radius: 999px; }
    .page-button svg { width: 15px; height: 15px; }
    .page-summary { margin-left: 8px; white-space: nowrap; }

    .cart-panel {
      position: absolute;
      z-index: 20;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      width: clamp(390px, 34.8vw, 668px);
      overflow: hidden;
      border-left: 1px solid rgba(7,91,158,.1);
      border-radius: 22px 0 0 22px;
      background: var(--surface);
      box-shadow: -14px 0 38px rgba(21,54,77,.15);
      transform: translateX(0);
      transition: transform .28s ease;
    }
    .cart-panel.closed { pointer-events: none; transform: translateX(calc(100% + 30px)); }
    .cart-header {
      display: flex;
      flex: 0 0 100px;
      align-items: center;
      justify-content: space-between;
      padding: 0 38px;
      color: #fff;
      background: var(--accent-dark);
    }
    .cart-title { display: flex; align-items: center; gap: 13px; margin: 0; font-size: 26px; font-weight: 720; }
    .cart-title > svg { width: 27px; height: 27px; }
    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 29px;
      height: 29px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .close-cart, .remove-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .close-cart { width: 40px; height: 40px; color: #fff; }
    .close-cart svg { width: 26px; height: 26px; }

    .cart-items { flex: 1 1 auto; min-height: 0; overflow-y: hidden; }
    .cart-items.scrollable { overflow-y: auto; }
    .cart-item {
      display: grid;
      grid-template-columns: clamp(84px, 5.9vw, 114px) minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px 22px;
      padding: 24px 38px;
      border-bottom: 1px solid #edf1f4;
    }
    .cart-thumb {
      width: 100%;
      height: clamp(84px, 5.9vw, 114px);
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 14px;
      background: #edf2f4;
    }
    .cart-item-main { min-width: 0; }
    .cart-item-name {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 9px;
      font-size: 19px;
      font-weight: 750;
      line-height: 1.25;
    }
    .cart-item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cart-item-qty {
      flex: none;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: #eaf2fa;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .cart-item-variant { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.45; }
    .cart-item-tail { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .cart-item-price { font-size: 18px; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
    .remove-item {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      color: #5e7180;
    }
    .remove-item:hover { color: var(--accent); background: #f0f6fa; }
    .remove-item svg { width: 18px; height: 18px; }
    .empty-cart { padding: 70px 30px; color: var(--text-2); text-align: center; }

    .cart-footer {
      flex: 0 0 auto;
      padding: 25px 38px 34px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    .cart-total-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 23px; }
    .cart-total-label { font-size: 19px; font-weight: 650; }
    .cart-total { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
    .checkout-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      min-height: 64px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .checkout-button:hover { background: var(--accent-dark); }
    .checkout-button svg { width: 21px; height: 21px; }

    .open-cart-button {
      position: absolute;
      z-index: 15;
      right: 28px;
      bottom: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(8,119,201,.22);
      cursor: pointer;
    }
    .open-cart-button svg { width: 21px; height: 21px; }
    .open-cart-button .cart-count { min-width: 25px; height: 25px; color: var(--accent); }

    .product-media {
      padding: 0;
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .customization-layer {
      position: fixed;
      z-index: 100;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      transition: visibility 0s linear .34s;
    }
    .customization-layer.open {
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }
    .customization-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(9, 28, 42, .44);
      opacity: 0;
      transition: opacity .3s ease;
    }
    .customization-layer.open .customization-backdrop { opacity: 1; }
    .customization-sheet {
      position: absolute;
      bottom: 0;
      left: 50%;
      display: flex;
      flex-direction: column;
      width: min(1240px, 86vw);
      height: min(820px, 88vh);
      overflow: hidden;
      border-radius: 32px 32px 0 0;
      background: #fff;
      box-shadow: 0 -20px 60px rgba(13,43,62,.24);
      transform: translate(-50%, 105%);
      transition: transform .34s cubic-bezier(.22,.8,.28,1);
    }
    .customization-layer.open .customization-sheet { transform: translate(-50%, 0); }
    .customization-header {
      position: relative;
      display: flex;
      flex: 0 0 92px;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .customization-title { margin: 0; font-size: 28px; font-weight: 750; letter-spacing: .5px; }
    .sheet-control {
      position: absolute;
      top: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      padding: 0;
      border: 1px solid #d9e6ed;
      border-radius: 50%;
      color: var(--accent-dark);
      background: #fff;
      cursor: pointer;
    }
    .sheet-control:hover { background: var(--accent-weak); }
    .sheet-control.collapse { left: 44px; }
    .sheet-control.close { right: 44px; }
    .sheet-control svg { width: 30px; height: 30px; }
    .customization-body {
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 56px;
      min-height: 0;
      padding: 26px 64px 28px;
      overflow: hidden;
    }
    .custom-product { min-width: 0; }
    .custom-product-image {
      display: block;
      width: 380px;
      height: 380px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      object-fit: contain;
      padding: 4%;
      background: #edf2f4;
    }
    .custom-product-name { margin: 20px 0 6px; font-size: 28px; font-weight: 750; }
    .custom-product-price { margin: 0; color: var(--accent-dark); font-size: 26px; font-weight: 800; }
    .custom-product-description { margin: 15px 0 0; color: var(--text-2); font-size: 16px; line-height: 1.75; }
    .custom-options {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
    }
    .option-row { padding: 8px 0 22px; border-bottom: 1px solid var(--border); }
    .option-row:last-child { padding-bottom: 8px; border-bottom: 0; }
    .option-label { display: block; margin-bottom: 16px; font-size: 18px; font-weight: 700; }
    .option-buttons { display: flex; flex-wrap: wrap; gap: 12px; }
    .option-button {
      min-width: 108px;
      min-height: 52px;
      padding: 0 23px;
      border: 1px solid #cedfe8;
      border-radius: 999px;
      color: var(--text);
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .option-button:hover { border-color: var(--accent); }
    .option-button.active { border-color: var(--accent); color: #fff; background: var(--accent); }
    .customization-footer {
      display: flex;
      flex: 0 0 116px;
      align-items: center;
      gap: 28px;
      padding: 18px 64px;
      border-top: 1px solid var(--border);
      background: #fff;
      box-shadow: 0 -8px 22px rgba(33,73,101,.045);
    }
    .custom-quantity { display: flex; align-items: center; gap: 20px; }
    .custom-quantity-label { margin-right: 5px; font-size: 19px; font-weight: 700; }
    .custom-quantity-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid #c9dfe9;
      border-radius: 50%;
      color: var(--accent);
      background: #fff;
      cursor: pointer;
    }
    .custom-quantity-button svg { width: 22px; height: 22px; }
    .custom-quantity-value { min-width: 32px; text-align: center; font-size: 24px; font-weight: 700; }
    .custom-total { display: flex; align-items: baseline; gap: 18px; margin-left: auto; }
    .custom-total-label { color: var(--text-2); font-size: 18px; }
    .custom-total-value { font-size: 36px; font-weight: 800; }
    .add-order-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 350px;
      min-height: 72px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-order-button:hover { background: var(--accent-dark); }
    .add-order-button svg { width: 24px; height: 24px; }

    .order-limit-layer {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .order-limit-layer.show { opacity: 1; pointer-events: auto; }
    .order-limit-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10,36,54,.42);
      backdrop-filter: blur(3px);
    }
    .order-limit-dialog {
      position: relative;
      width: min(560px, 74vw);
      padding: 44px 50px 52px;
      overflow: hidden;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 28px 72px rgba(9,38,58,.3);
      text-align: center;
      transform: translateY(16px) scale(.97);
      transition: transform .26s cubic-bezier(.22,.8,.28,1);
    }
    .order-limit-layer.show .order-limit-dialog { transform: translateY(0) scale(1); }
    .order-limit-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      margin-bottom: 26px;
      border-radius: 50%;
      color: #d98510;
      background: #fff4e5;
    }
    .order-limit-icon svg { width: 42px; height: 42px; }
    .order-limit-title { margin: 0 0 12px; font-size: 27px; font-weight: 780; letter-spacing: -.01em; }
    .order-limit-text { margin: 0; color: var(--text-2); font-size: 17px; line-height: 1.65; }
    .order-limit-hint { display: block; margin-top: 18px; color: #93a6b3; font-size: 13px; }
    .order-limit-progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 4px;
      background: #eef3f7;
    }
    .order-limit-progress i {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f0a72e, #f8cb70);
      transform-origin: left center;
      animation: order-limit-drain 5s linear forwards;
    }
    @keyframes order-limit-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .toast {
      position: fixed;
      z-index: 60;
      bottom: 24px;
      left: 50%;
      max-width: min(520px, 80vw);
      padding: 12px 20px;
      border-radius: 999px;
      color: #fff;
      background: rgba(16,45,67,.94);
      box-shadow: 0 8px 24px rgba(16,45,67,.18);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    const MAX_ORDER_ITEMS = 3;
    const products = [
      { id: 1, price: 360, image: "assets/caramel-macchiato.png", temperature: "iced" },
      { id: 2, price: 380, image: "assets/coconut-mocha.png", temperature: "iced" },
      { id: 3, price: 300, image: "assets/espresso.png", temperature: "hot" },
      { id: 4, price: 320, image: "assets/americano.png", temperature: "iced" },
      { id: 5, price: 400, image: "assets/vietnamese-spanish-latte.png", temperature: "iced" }
    ];

    const SUPPORTED_LANGUAGES = ["ja", "zh", "en", "ko"];

    function resolveLanguage() {
      const requested = new URLSearchParams(window.location.search).get("lang");
      if (SUPPORTED_LANGUAGES.includes(requested)) return requested;
      try {
        const saved = localStorage.getItem("fujiLanguage");
        if (SUPPORTED_LANGUAGES.includes(saved)) return saved;
      } catch (error) {
        console.warn("语言偏好读取失败。", error);
      }
      return "ja";
    }

    let currentLanguage = resolveLanguage();

    function t(key, vars) {
      const dictionary = I18N[currentLanguage] || I18N.ja;
      const value = key.split(".").reduce((node, part) => (node ? node[part] : undefined), dictionary);
      const template = typeof value === "string" ? value : key;
      return vars
        ? template.replace(/\{(\w+)\}/g, (match, name) => (vars[name] !== undefined ? vars[name] : match))
        : template;
    }

    const productName = product => t(`products.${product.id}.name`);
    const productDescription = product => t(`products.${product.id}.desc`);
    const variantLabel = variant => ["temperature", "size", "sweetness", "milk"]
      .filter(group => variant[group])
      .map(group => {
        const value = variant[group];
        return t(value.includes(".") ? value : `${group}.${value}`);
      })
      .join(" / ");

    const previewParams = new URLSearchParams(window.location.search);
    const state = {
      adEnabled: previewParams.get("ad") !== "off",
      cartOpen: previewParams.get("cart") === "open",
      cart: new Map([[1, 1], [3, 1], [4, 1]]),
      cartVariants: new Map()
    };

    const icons = {
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>'
    };

    const workspace = document.getElementById("workspace");
    const productGrid = document.getElementById("productGrid");
    const adToggle = document.getElementById("adToggle");
    const adState = document.getElementById("adState");
    const visibleCount = document.getElementById("visibleCount");
    const cartPanel = document.getElementById("cartPanel");
    const openCartButton = document.getElementById("openCart");
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const toast = document.getElementById("toast");
    let toastTimer;

    const yen = value => `¥${value.toLocaleString("ja-JP")}`;
    const getProduct = id => products.find(product => product.id === Number(id));

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function visibleProducts() {
      return products.slice(0, state.adEnabled ? 6 : 8);
    }

    function renderProducts() {
      const list = visibleProducts();
      workspace.classList.toggle("ad-off", !state.adEnabled);
      const cols = list.length >= 7 ? 4 : 3;
      productGrid.style.setProperty("--cols", String(cols));
      productGrid.style.setProperty("--rows", String(Math.max(1, Math.ceil(list.length / cols))));
      adToggle.setAttribute("aria-checked", String(state.adEnabled));
      adState.textContent = state.adEnabled ? "ON" : "OFF";
      visibleCount.textContent = t("items", { n: list.length });
      productGrid.innerHTML = list.map((product, index) => {
        const name = productName(product);
        return `
        <article class="product-card" data-product-id="${product.id}" style="animation-delay:${index * 25}ms">
          <button class="product-media" type="button" data-customize="${product.id}" aria-label="${t("customizeAria", { name })}">
            <img src="${product.image}" alt="${name}" width="700" height="700">
            <span class="temperature-tag">${t(`temperature.${product.temperature}`)}</span>
          </button>
          <div class="product-info">
            <div class="product-copy">
              <h2 class="product-name" title="${name}">${name}</h2>
              <p class="product-price">${yen(product.price)}</p>
            </div>
            <button class="add-button" type="button" data-add="${product.id}" aria-label="${t("addAria", { name })}">${icons.plus}</button>
          </div>
        </article>
      `;
      }).join("");
    }

    function renderCart() {
      const entries = [...state.cart.entries()]
        .map(([id, quantity]) => ({ product: getProduct(id), quantity }))
        .filter(entry => entry.product && entry.quantity > 0);
      const itemCount = entries.reduce((sum, entry) => sum + entry.quantity, 0);
      const total = entries.reduce((sum, entry) => sum + entry.product.price * entry.quantity, 0);

      document.querySelectorAll("[data-cart-count]").forEach(element => {
        element.textContent = itemCount;
      });
      document.getElementById("cartTotalLabel").textContent = t("cartTotal", { n: itemCount });
      cartTotal.textContent = yen(total);
      cartItems.classList.toggle("scrollable", entries.length > 3);

      if (!entries.length) {
        cartItems.innerHTML = `<div class="empty-cart">${t("emptyCart")}</div>`;
        return;
      }

      cartItems.innerHTML = entries.map(({ product, quantity }) => {
        const name = productName(product);
        const variant = state.cartVariants.get(product.id) || { temperature: product.temperature, size: "regular" };
        return `
        <article class="cart-item">
          <img class="cart-thumb" src="${product.image}" alt="${name}" width="210" height="210">
          <div class="cart-item-main">
            <h3 class="cart-item-name"><span class="cart-item-title" title="${name}">${name}</span><span class="cart-item-qty">× ${quantity}</span></h3>
            <p class="cart-item-variant">${variantLabel(variant)}</p>
          </div>
          <div class="cart-item-tail">
            <span class="cart-item-price">${yen(product.price * quantity)}</span>
            <button class="remove-item" type="button" data-remove="${product.id}" aria-label="${t("removeAria", { name })}">${icons.trash}</button>
          </div>
        </article>
      `;
      }).join("");
    }

    function setCartOpen(open) {
      state.cartOpen = open;
      cartPanel.classList.toggle("closed", !open);
      openCartButton.classList.toggle("hidden", open);
      cartPanel.setAttribute("aria-hidden", String(!open));
    }

    function cartItemCount() {
      return [...state.cart.values()].reduce((sum, quantity) => sum + (Number(quantity) || 0), 0);
    }

    const orderLimitLayer = document.getElementById("orderLimitLayer");
    const orderLimitBar = orderLimitLayer.querySelector(".order-limit-progress i");
    let orderLimitTimer;
    let orderLimitCloseTimer;

    function hideOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      orderLimitLayer.classList.remove("show");
      orderLimitCloseTimer = window.setTimeout(() => {
        orderLimitLayer.hidden = true;
      }, 240);
    }

    function showOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      document.getElementById("orderLimitTitle").textContent = t("limitTitle", { max: MAX_ORDER_ITEMS });
      document.getElementById("orderLimitText").textContent = t("limitReached", { max: MAX_ORDER_ITEMS });
      document.getElementById("orderLimitHint").textContent = t("limitHint");
      orderLimitLayer.hidden = false;
      orderLimitBar.style.animation = "none";
      void orderLimitBar.offsetWidth;
      orderLimitBar.style.animation = "";
      requestAnimationFrame(() => orderLimitLayer.classList.add("show"));
      orderLimitTimer = window.setTimeout(hideOrderLimit, 5000);
    }

    orderLimitLayer.addEventListener("click", event => {
      if (event.target.closest("[data-limit-close]")) hideOrderLimit();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !orderLimitLayer.hidden) hideOrderLimit();
    });

    function addToCart(id) {
      if (cartItemCount() >= MAX_ORDER_ITEMS) {
        showOrderLimit();
        return;
      }
      state.cart.set(id, (state.cart.get(id) || 0) + 1);
      renderCart();
      showToast(t("added", { name: productName(getProduct(id)) }));
    }

    const customizationLayer = document.getElementById("customizationLayer");
    const customDraft = {
      productId: null,
      temperature: "hot",
      size: "medium",
      sweetness: "standard",
      milk: "milk",
      quantity: 1
    };
    let preserveCustomDraft = false;

    function resetCustomization(productId) {
      const product = getProduct(productId);
      Object.assign(customDraft, {
        productId,
        temperature: product ? product.temperature : "hot",
        size: "medium",
        sweetness: "standard",
        milk: "milk",
        quantity: 1
      });
    }

    function renderCustomization() {
      const product = getProduct(customDraft.productId);
      if (!product) return;
      const name = productName(product);
      const image = document.getElementById("customProductImage");
      image.src = product.image;
      image.alt = name;
      document.getElementById("customProductName").textContent = name;
      document.getElementById("customProductPrice").textContent = yen(product.price);
      document.getElementById("customProductDescription").textContent = productDescription(product);
      document.getElementById("customQuantity").textContent = customDraft.quantity;
      document.getElementById("customTotal").textContent = yen(product.price * customDraft.quantity);
      document.querySelectorAll("[data-option-group]").forEach(group => {
        const groupName = group.dataset.optionGroup;
        group.querySelectorAll("[data-value]").forEach(button => {
          const active = customDraft[groupName] === button.dataset.value;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      });
    }

    function openCustomization(productId) {
      if (customDraft.productId !== productId || !preserveCustomDraft) resetCustomization(productId);
      preserveCustomDraft = false;
      renderCustomization();
      customizationLayer.classList.add("open");
      customizationLayer.setAttribute("aria-hidden", "false");
    }

    function hideCustomization(cancelChanges) {
      customizationLayer.classList.remove("open");
      customizationLayer.setAttribute("aria-hidden", "true");
      preserveCustomDraft = !cancelChanges;
      if (cancelChanges) customDraft.productId = null;
    }

    document.getElementById("collapseCustomization").addEventListener("click", () => hideCustomization(false));
    document.getElementById("closeCustomization").addEventListener("click", () => hideCustomization(true));
    document.getElementById("customizationBackdrop").addEventListener("click", () => hideCustomization(false));

    document.querySelector(".custom-options").addEventListener("click", event => {
      const button = event.target.closest("[data-value]");
      const group = event.target.closest("[data-option-group]");
      if (!button || !group) return;
      customDraft[group.dataset.optionGroup] = button.dataset.value;
      renderCustomization();
    });

    document.querySelector(".custom-quantity").addEventListener("click", event => {
      const button = event.target.closest("[data-custom-quantity]");
      if (!button) return;
      const change = button.dataset.customQuantity === "increase" ? 1 : -1;
      const nextQuantity = Math.max(1, customDraft.quantity + change);
      if (change > 0 && nextQuantity > MAX_ORDER_ITEMS - cartItemCount()) {
        showOrderLimit();
        return;
      }
      customDraft.quantity = Math.min(MAX_ORDER_ITEMS, nextQuantity);
      renderCustomization();
    });

    document.getElementById("addCustomizedOrder").addEventListener("click", () => {
      const product = getProduct(customDraft.productId);
      if (!product) return;
      if (customDraft.quantity > MAX_ORDER_ITEMS - cartItemCount()) {
        showOrderLimit();
        return;
      }
      state.cart.set(product.id, (state.cart.get(product.id) || 0) + customDraft.quantity);
      state.cartVariants.set(product.id, {
        temperature: `temperature.${customDraft.temperature}`,
        size: `size.${customDraft.size}`,
        sweetness: `sweetness.${customDraft.sweetness}`,
        milk: `milk.${customDraft.milk}`
      });
      const quantity = customDraft.quantity;
      renderCart();
      hideCustomization(true);
      showToast(t("addedCustom", { name: productName(product), qty: quantity }));
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && customizationLayer.classList.contains("open")) hideCustomization(true);
    });

    adToggle.addEventListener("click", () => {
      state.adEnabled = !state.adEnabled;
      renderProducts();
      showToast(state.adEnabled ? t("adOn", { n: visibleProducts().length }) : t("adOff", { n: visibleProducts().length }));
    });

    document.getElementById("demoHomeButton").addEventListener("click", () => {
      window.location.href = "welcome.html";
    });

    const adSlides = Array.from(document.querySelectorAll(".ad-slide"));
    const adDots = Array.from(document.querySelectorAll(".ad-dots span"));
    let adSlideIndex = 0;
    let adSlideTimer = null;

    function showAdSlide(nextIndex) {
      adSlideIndex = (nextIndex + adSlides.length) % adSlides.length;
      adSlides.forEach((slide, index) => slide.classList.toggle("active", index === adSlideIndex));
      adDots.forEach((dot, index) => dot.classList.toggle("active", index === adSlideIndex));
    }

    function startAdRotation() {
      if (adSlideTimer !== null || adSlides.length < 2) return;
      adSlideTimer = window.setInterval(() => showAdSlide(adSlideIndex + 1), 6000);
    }

    function stopAdRotation() {
      if (adSlideTimer === null) return;
      window.clearInterval(adSlideTimer);
      adSlideTimer = null;
    }

    startAdRotation();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopAdRotation();
      else startAdRotation();
    });

    productGrid.addEventListener("click", event => {
      const addButton = event.target.closest("[data-add]");
      if (addButton) {
        addToCart(Number(addButton.dataset.add));
        return;
      }
      const customizeButton = event.target.closest("[data-customize]");
      if (customizeButton) openCustomization(Number(customizeButton.dataset.customize));
    });

    cartItems.addEventListener("click", event => {
      const remove = event.target.closest("[data-remove]");
      if (!remove) return;
      const id = Number(remove.dataset.remove);
      state.cart.delete(id);
      state.cartVariants.delete(id);
      renderCart();
    });

    document.getElementById("closeCart").addEventListener("click", () => setCartOpen(false));
    openCartButton.addEventListener("click", () => setCartOpen(true));
    document.getElementById("checkoutButton").addEventListener("click", () => {
      if (!state.cart.size) {
        showToast(t("selectProduct"));
        return;
      }
      const order = {
        items: [...state.cart.entries()].map(([id, quantity]) => {
          const product = getProduct(id);
          const variant = state.cartVariants.get(id) || { temperature: product.temperature, size: "regular" };
          return { productId: product.id, name: productName(product), price: product.price, quantity, image: product.image, variant: variantLabel(variant), variantData: variant };
        }),
        language: currentLanguage
      };
      try {
        localStorage.setItem("fujiOrder", JSON.stringify(order));
      } catch (error) {
        console.warn("订单暂存不可用，将使用默认演示订单。", error);
      }
      window.location.href = "payment.html";
    });

    document.querySelectorAll("[data-toast]").forEach(button => {
      button.addEventListener("click", () => showToast(button.dataset.toast));
    });

    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-category]").forEach(item => {
          item.classList.toggle("active", item === button);
          item.removeAttribute("aria-current");
        });
        button.setAttribute("aria-current", "page");
        showToast(t("categoryToast", { name: t(button.dataset.labelKey) }));
      });
    });

    const languagePicker = document.getElementById("languagePicker");
    const languageButton = document.getElementById("languageButton");
    const languageMenu = document.getElementById("languageMenu");

    function setLanguageMenuOpen(open) {
      languagePicker.classList.toggle("open", open);
      languageButton.setAttribute("aria-expanded", String(open));
    }

    function applyLanguage(language, options = {}) {
      currentLanguage = I18N[language] ? language : "ja";
      document.documentElement.lang = I18N[currentLanguage].htmlLang || currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-aria]").forEach(element => {
        element.setAttribute("aria-label", t(element.dataset.i18nAria));
      });
      document.querySelectorAll("[data-i18n-title]").forEach(element => {
        element.setAttribute("title", t(element.dataset.i18nTitle));
      });
      document.querySelectorAll("[data-i18n-toast]").forEach(element => {
        element.dataset.toast = t(element.dataset.i18nToast);
      });

      document.getElementById("languageLabel").textContent = t("langName");
      languageMenu.setAttribute("aria-label", t("languageMenu"));
      languageButton.setAttribute("aria-label", t("languageMenu"));
      languageMenu.querySelectorAll("[data-set-language]").forEach(option => {
        const active = option.dataset.setLanguage === currentLanguage;
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", String(active));
      });

      renderProducts();
      renderCart();
      if (customizationLayer.classList.contains("open")) renderCustomization();

      if (options.persist !== false) {
        try {
          localStorage.setItem("fujiLanguage", currentLanguage);
        } catch (error) {
          console.warn("语言偏好无法保存。", error);
        }
      }
    }

    languageButton.addEventListener("click", event => {
      event.stopPropagation();
      setLanguageMenuOpen(!languagePicker.classList.contains("open"));
    });

    languageMenu.addEventListener("click", event => {
      const option = event.target.closest("[data-set-language]");
      if (!option) return;
      event.stopPropagation();
      setLanguageMenuOpen(false);
      applyLanguage(option.dataset.setLanguage);
    });

    document.addEventListener("click", event => {
      if (!languagePicker.contains(event.target)) setLanguageMenuOpen(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setLanguageMenuOpen(false);
    });

    applyLanguage(currentLanguage, { persist: false });
    setCartOpen(state.cartOpen);
    if (previewParams.get("customize") === "1") {
      openCustomization(Number(previewParams.get("product")) || 1);
    }
  </script>
</body>
</html>
