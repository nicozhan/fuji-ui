  <script>
    (function(){const trigger=document.getElementById("debugTrigger"),dock=document.getElementById("debugDock"),panel=document.getElementById("debugPanel");function place(){const r=trigger.getBoundingClientRect();panel.style.left=Math.max(16,Math.min(r.left,innerWidth-panel.offsetWidth-16))+"px";panel.style.top=Math.max(16,Math.min(r.bottom+12,innerHeight-220))+"px";}function close(){dock.classList.remove("is-open");trigger.setAttribute("aria-expanded","false");}trigger.addEventListener("click",()=>{dock.classList.toggle("is-open");trigger.setAttribute("aria-expanded",String(dock.classList.contains("is-open")));if(dock.classList.contains("is-open"))place();});dock.addEventListener("click",event=>{if(event.target.closest("[data-debug-close]"))close();});document.addEventListener("keydown",event=>{if(event.key==="Escape")close();});const device=window.FUJI_DEVICE||{mode:"auto"},REF={s10:[1024,768],m21:[1920,1080],l27:[2560,1440]};dock.querySelectorAll("[data-size-preset]").forEach(button=>{const preset=button.dataset.sizePreset;button.setAttribute("aria-pressed",String(preset==="auto"?device.mode==="auto":device.mode==="preset"&&device.layout===preset));button.addEventListener("click",()=>{const payload=preset==="auto"?{mode:"auto",preset:null,layout:null,w:0,h:0}:{mode:"preset",preset,layout:preset,w:REF[preset][0],h:REF[preset][1]};try{localStorage.setItem("fujiDevice",JSON.stringify(payload));}catch(error){console.warn(error);}location.reload();});});dock.querySelectorAll("[data-debug-nav]").forEach(button=>button.addEventListener("click",()=>{location.href=button.dataset.debugNav+"?lang="+language;}));document.getElementById("recoverButton").addEventListener("click",()=>window.fujiDeviceState("ok"));})();
  </script>
</body>
</html>
