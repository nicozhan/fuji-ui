<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var map={ja:"ja",zh:"zh-CN",en:"en",ko:"ko"};try{var q=new URLSearchParams(location.search).get("lang");var lang=map[q]||map[localStorage.getItem("fujiLanguage")];if(lang)document.documentElement.lang=lang;}catch(error){console.warn(error);}})();</script>
  <script>(function(){var root=document.documentElement,device=null;try{device=JSON.parse(localStorage.getItem("fujiDevice")||"null");}catch(error){console.warn(error);}function layoutForWidth(w){return w>=2200?"l27":w>=1280?"m21":"s10";}var mode=device&&device.mode?device.mode:"auto",layout=null,base=null;if(mode==="preset"&&device.layout)layout=device.layout;else if(mode==="custom"&&device.w>0&&device.h>0){layout=layoutForWidth(device.w);base=Math.min(device.w/120,device.h/67.5);}else{mode="auto";layout=layoutForWidth(innerWidth);}root.dataset.deviceMode=mode;root.dataset.deviceLayout=layout;window.FUJI_DEVICE={mode:mode,layout:layout};if(base>0){var style=document.createElement("style");style.textContent='html[data-device-mode="custom"]{font-size:max(12px,min('+base.toFixed(3)+'px,100vw / 120,100vh / 67.5));}';document.head.appendChild(style);}})();</script>
  <title>支付异常 - Fuji Electric</title>
  <style>
    :root{--blue:#0877c9;--ink:#102d43;--muted:#6d8494;--status-h:3.5rem;--font-cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC"}html[lang="ja"]{--font-cjk:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo","PingFang SC"}html[lang="ko"]{--font-cjk:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC"}*{box-sizing:border-box}html,body{margin:0;min-width:47.5rem}html{font-size:min(100vw / 120,100dvh / 67.5);-webkit-text-size-adjust:100%;text-size-adjust:100%}@media(orientation:landscape){html{font-size:max(12px,min(100vw / 120,100dvh / 67.5))}}body{color:var(--ink);background:#f4f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,var(--font-cjk),sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:3px solid rgba(8,119,201,.3);outline-offset:3px}
    .fault-page{display:flex;flex-direction:column;width:100%;height:100dvh;min-height:600px;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(205,231,247,.42),transparent 43%),linear-gradient(180deg,#fbfdff,#f1f7fb)}.status-bar{display:flex;flex:0 0 var(--status-h);align-items:center;justify-content:space-between;gap:1.5rem;padding:0 1.75rem;border-bottom:1px solid #dae5ee;color:#4a6478;background:#e9eff5;font-size:.8125rem}.status-left,.status-right,.status-item{display:flex;align-items:center}.status-left,.status-right{gap:1.75rem}.status-item{gap:.5rem;white-space:nowrap}.status-item svg{width:1rem;height:1rem}.status-right svg{color:#8ea6b6}.machine-id{color:#6d8598}.machine-id strong{color:#35566e;font-weight:500}.status-logo{display:inline-flex;padding:0;border:0;color:#a3b8c6;background:none;font-size:1.375rem;font-style:italic;font-weight:900;letter-spacing:-.12em;line-height:1;cursor:pointer}.status-logo span{transform:skew(-8deg)}
    .fault-body{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:32px 40px;text-align:center}.visual-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:clamp(180px,25vh,270px);height:clamp(180px,25vh,270px);border:1px solid #d7e7f2;border-radius:clamp(26px,4vh,42px);background:rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(30,85,125,.09)}.icon-placeholder{display:flex;align-items:center;justify-content:center;width:clamp(62px,8.5vh,92px);height:clamp(62px,8.5vh,92px);border:2px dashed #91a9ba;border-radius:22px;color:#728b9d;background:#f7fafc;font-size:12px;font-weight:750;letter-spacing:.18em;text-indent:.18em}.visual-caption{font-size:clamp(9.5px,1.15vh,12px);font-weight:750;line-height:1.75;letter-spacing:.28em;text-indent:.28em;color:#718b9e;text-transform:uppercase}.fault-title{margin:clamp(22px,4vh,44px) 0 0;max-width:1200px;font-size:clamp(30px,5.2vh,56px);font-weight:750;line-height:1.3;color:#173f5b}.fault-message{margin:clamp(12px,1.8vh,20px) 0 0;max-width:900px;color:var(--muted);font-size:clamp(16px,2.15vh,23px);line-height:1.75}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:clamp(28px,4.5vh,48px)}.action-button{min-width:220px;min-height:62px;padding:15px 34px;border:1px solid var(--blue);border-radius:18px;font-size:clamp(16px,2vh,21px);font-weight:700;cursor:pointer}.action-primary{color:#fff;background:linear-gradient(180deg,#1489d8,#0877c9);box-shadow:0 10px 24px rgba(8,119,201,.18)}.action-secondary{color:#176bA5;background:#fff;border-color:#b9d5e8}.action-note{margin:20px 0 0;color:#8a9ba8;font-size:14px;line-height:1.6}
    @media(max-width:1200px){.contact-item{display:none}}@media(max-height:720px){.fault-body{padding:16px 32px}.visual-card{width:170px;height:170px;gap:10px}.icon-placeholder{width:58px;height:58px}.fault-title{margin-top:20px}.actions{margin-top:22px}.action-button{min-height:52px;padding:12px 28px}.action-note{margin-top:12px}}
    .debug-dock{position:fixed;inset:0;z-index:200;display:none}.debug-dock.is-open{display:block}.debug-scrim{position:absolute;inset:0;background:rgba(6,28,45,.24)}.debug-panel{position:absolute;width:min(30rem,calc(100vw - 2rem));max-height:calc(100vh - 6rem);overflow:auto;padding:.875rem 1rem 1rem;border:1px solid rgba(255,255,255,.18);border-radius:1.125rem;color:#fff;background:linear-gradient(158deg,#0b4f80,#08395c);box-shadow:0 1.5rem 3.5rem rgba(4,26,42,.42)}.debug-head{display:flex;align-items:center;gap:.5rem;padding-bottom:.6875rem;border-bottom:1px solid rgba(255,255,255,.16)}.debug-badge{padding:.125rem .4375rem;border-radius:.25rem;color:#08395c;background:#fff;font-size:.625rem;font-weight:800}.debug-head-title{font-size:.8125rem;font-weight:700}.debug-head-hint{margin-left:auto;color:rgba(255,255,255,.56);font-size:.6875rem}.debug-close{width:1.75rem;height:1.75rem;margin-left:.375rem;padding:0;border:0;border-radius:50%;color:#fff;background:rgba(255,255,255,.14);cursor:pointer}.debug-group{padding-top:.6875rem}.debug-group+.debug-group{margin-top:.6875rem;border-top:1px solid rgba(255,255,255,.12)}.debug-label{margin:0 0 .4375rem;color:rgba(255,255,255,.62);font-size:.6875rem;font-weight:700}.debug-row{display:flex;flex-wrap:wrap;gap:.375rem}.debug-chip{display:inline-flex;align-items:center;padding:.375rem .75rem;border:1px solid rgba(255,255,255,.26);border-radius:62rem;color:#fff;background:rgba(255,255,255,.08);font-size:.75rem;font-weight:650;text-decoration:none;cursor:pointer}.debug-chip[aria-pressed="true"],.debug-chip[aria-current="page"]{border-color:#fff;color:#08395c;background:#fff}.debug-chip i{margin-left:.3rem;font-size:.625rem;font-style:normal;opacity:.66}
  </style>
</head>
<body>
  <main class="fault-page" aria-label="支付异常"><section class="status-bar" aria-label="设备信息"><div class="status-left"><button class="status-logo" id="debugTrigger" type="button" aria-expanded="false" aria-haspopup="dialog" aria-label="Fuji Electric"><span>FE</span></button><div class="status-item machine-id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 6h6M9 18h6"/></svg><span>Machine ID：<strong>fuji12345678</strong></span></div><div class="status-item contact-item"><span><span data-i18n="contact">联系我们</span>：800-1234-5678</span></div></div><div class="status-right"><time class="status-item" data-i18n="date">11月4日 23:40</time><svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor" aria-label="网络状态"><rect x="1" y="11" width="3" height="4" rx="1"/><rect x="6" y="7" width="3" height="8" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg></div></section>
    <section class="fault-body"><div class="visual-card"><div class="icon-placeholder" aria-hidden="true">ICON</div><div class="visual-caption">Payment<br>Failed</div></div><h1 class="fault-title" id="faultTitle">暂时无法支付</h1><p class="fault-message" id="faultMessage">当前支付服务不可用，请联系工作人员或稍后再试。</p><div class="actions"><button class="action-button action-primary" id="retryButton" type="button" data-i18n="retry">重试</button><button class="action-button action-secondary" id="backButton" type="button" data-i18n="back">返回</button></div><p class="action-note" data-i18n="note">重试将创建新的支付流程，请勿继续使用此前的支付二维码。</p></section>
  </main>
  <div class="debug-dock" id="debugDock"><div class="debug-scrim" data-debug-close></div><div class="debug-panel" id="debugPanel" role="dialog" aria-label="调试面板"><div class="debug-head"><span class="debug-badge">DEBUG</span><span class="debug-head-title">测试入口</span><span class="debug-head-hint">上线前移除</span><button class="debug-close" type="button" data-debug-close aria-label="关闭">✕</button></div><section class="debug-group"><p class="debug-label">屏幕尺寸</p><div class="debug-row"><button class="debug-chip" data-size-preset="s10">10″ <i>5×2</i></button><button class="debug-chip" data-size-preset="m21">21″ <i>5×3</i></button><button class="debug-chip" data-size-preset="l27">27″ <i>6×3</i></button><button class="debug-chip" data-size-preset="auto">自动</button><a class="debug-chip" href="setup.html?return=payment-error.html">自定义…</a></div></section><section class="debug-group"><p class="debug-label">异常类型</p><div class="debug-row"><button class="debug-chip" data-state="unavailable">支付不可用</button><button class="debug-chip" data-state="timeout">支付超时/取消</button></div></section><section class="debug-group"><p class="debug-label">故障页面</p><div class="debug-row"><button class="debug-chip" data-debug-nav="out-of-service.html">整机</button><button class="debug-chip" data-debug-nav="cleaning.html">清洗</button><button class="debug-chip" data-debug-nav="busy.html">初始化/忙碌</button><button class="debug-chip" data-debug-nav="cup-blocking.html">取杯</button><button class="debug-chip" aria-current="page">支付异常</button><button class="debug-chip" data-debug-nav="order-error.html">订单/制作</button></div></section></div></div>
  <script>
    const params=new URLSearchParams(location.search);
    const I18N={
      zh:{htmlLang:"zh-CN",contact:"联系我们",date:"11月4日 23:40",retry:"重试",back:"返回",note:"重试将创建新的支付流程，请勿继续使用此前的支付二维码。",unavailable:{docTitle:"支付不可用",title:"暂时无法支付",message:"当前支付服务不可用，请联系工作人员或稍后再试。"},timeout:{docTitle:"支付超时或订单取消",title:"支付已超时或订单已取消",message:"请重新结账。此前的支付二维码已失效，请勿重复支付。"}},
      ja:{htmlLang:"ja",contact:"お問い合わせ",date:"11月4日 23:40",retry:"もう一度試す",back:"戻る",note:"再試行すると新しい決済手続きを開始します。以前のQRコードは使用しないでください。",unavailable:{docTitle:"決済を利用できません",title:"現在、お支払い手続きをご利用いただけません",message:"係員にお問い合わせいただくか、しばらくしてからもう一度お試しください。"},timeout:{docTitle:"決済タイムアウト",title:"お支払いがタイムアウトしたか、注文がキャンセルされました",message:"もう一度お会計をしてください。以前のQRコードは無効です。重複してお支払いしないでください。"}},
      en:{htmlLang:"en",contact:"Contact",date:"Nov 4, 23:40",retry:"Retry",back:"Back",note:"Retrying starts a new payment flow. Do not reuse the previous payment QR code.",unavailable:{docTitle:"Payment unavailable",title:"Payment is temporarily unavailable",message:"The payment service is currently unavailable. Please contact staff or try again later."},timeout:{docTitle:"Payment timed out",title:"Payment timed out or the order was cancelled",message:"Please check out again. The previous payment QR code is no longer valid. Do not pay twice."}},
      ko:{htmlLang:"ko",contact:"문의",date:"11월 4일 23:40",retry:"다시 시도",back:"돌아가기",note:"다시 시도하면 새로운 결제 절차가 시작됩니다. 이전 결제 QR 코드는 사용하지 마세요.",unavailable:{docTitle:"결제 불가",title:"현재 결제할 수 없습니다",message:"결제 서비스를 현재 이용할 수 없습니다. 직원에게 문의하거나 잠시 후 다시 시도해 주세요."},timeout:{docTitle:"결제 시간 초과",title:"결제 시간이 초과되었거나 주문이 취소되었습니다",message:"다시 결제해 주세요. 이전 QR 코드는 유효하지 않습니다. 중복 결제하지 마세요."}}
    };
    let language=I18N[params.get("lang")]?params.get("lang"):"zh";try{if(!I18N[params.get("lang")]&&I18N[localStorage.getItem("fujiLanguage")])language=localStorage.getItem("fujiLanguage");}catch(error){console.warn(error);}let state=params.get("type")==="timeout"?"timeout":"unavailable";
    function render(){const dictionary=I18N[language],copy=dictionary[state];document.documentElement.lang=dictionary.htmlLang;document.title=copy.docTitle+" - Fuji Electric";document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=dictionary[el.dataset.i18n];});document.getElementById("faultTitle").textContent=copy.title;document.getElementById("faultMessage").textContent=copy.message;document.querySelector(".fault-page").setAttribute("aria-label",copy.title);document.querySelectorAll("[data-state]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.state===state)));}
    function performAction(action){const detail={page:"payment",type:state,action,language};if(typeof window.fujiFaultAction==="function"){const result=window.fujiFaultAction(detail);if(result===false)return;}else{const event=new CustomEvent("fuji:fault-action",{detail,cancelable:true});if(!window.dispatchEvent(event))return;}location.href=(action==="retry"?"payment.html":"index.html")+"?lang="+encodeURIComponent(language);}
    document.getElementById("retryButton").addEventListener("click",()=>performAction("retry"));document.getElementById("backButton").addEventListener("click",()=>performAction("back"));window.fujiPaymentFault={setType(next){if(next!=="unavailable"&&next!=="timeout")return false;state=next;render();return true;},retry:()=>performAction("retry"),back:()=>performAction("back")};render();
  </script>
  <script>(function(){const trigger=document.getElementById("debugTrigger"),dock=document.getElementById("debugDock"),panel=document.getElementById("debugPanel");function place(){const r=trigger.getBoundingClientRect();panel.style.left=Math.max(16,Math.min(r.left,innerWidth-panel.offsetWidth-16))+"px";panel.style.top=Math.max(16,Math.min(r.bottom+12,innerHeight-220))+"px";}function close(){dock.classList.remove("is-open");trigger.setAttribute("aria-expanded","false");}trigger.addEventListener("click",()=>{dock.classList.toggle("is-open");trigger.setAttribute("aria-expanded",String(dock.classList.contains("is-open")));if(dock.classList.contains("is-open"))place();});dock.addEventListener("click",event=>{if(event.target.closest("[data-debug-close]"))close();});document.addEventListener("keydown",event=>{if(event.key==="Escape")close();});const device=window.FUJI_DEVICE||{mode:"auto"},REF={s10:[1024,768],m21:[1920,1080],l27:[2560,1440]};dock.querySelectorAll("[data-size-preset]").forEach(button=>{const preset=button.dataset.sizePreset;button.setAttribute("aria-pressed",String(preset==="auto"?device.mode==="auto":device.mode==="preset"&&device.layout===preset));button.addEventListener("click",()=>{const payload=preset==="auto"?{mode:"auto",preset:null,layout:null,w:0,h:0}:{mode:"preset",preset,layout:preset,w:REF[preset][0],h:REF[preset][1]};try{localStorage.setItem("fujiDevice",JSON.stringify(payload));}catch(error){console.warn(error);}location.reload();});});dock.querySelectorAll("[data-debug-nav]").forEach(button=>button.addEventListener("click",()=>{location.href=button.dataset.debugNav+"?lang="+language;}));dock.querySelectorAll("[data-state]").forEach(button=>button.addEventListener("click",()=>window.fujiPaymentFault.setType(button.dataset.state)));})();</script>
</body>
