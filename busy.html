<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var map = { ja: "ja", zh: "zh-CN", en: "en", ko: "ko" };
      try {
        var requested = new URLSearchParams(window.location.search).get("lang");
        var lang = map[requested] || map[localStorage.getItem("fujiLanguage")];
        if (lang) document.documentElement.lang = lang;
      } catch (error) { console.warn("首帧语言读取失败。", error); }
    })();
  </script>
  <script>
    (function () {
      var root = document.documentElement;
      var device = null;
      try { device = JSON.parse(localStorage.getItem("fujiDevice") || "null"); } catch (error) { console.warn(error); }
      function layoutForWidth(width) { return width >= 2200 ? "l27" : width >= 1280 ? "m21" : "s10"; }
      var mode = device && device.mode ? device.mode : "auto";
      var layout = null;
      var base = null;
      if (mode === "preset" && device.layout) layout = device.layout;
      else if (mode === "custom" && device.w > 0 && device.h > 0) {
        layout = layoutForWidth(device.w);
        base = Math.min(device.w / 120, device.h / 67.5);
      } else { mode = "auto"; layout = layoutForWidth(window.innerWidth); }
      root.dataset.deviceMode = mode;
      root.dataset.deviceLayout = layout;
      window.FUJI_DEVICE = { mode: mode, layout: layout };
      if (base && base > 0) {
        var style = document.createElement("style");
        style.textContent = 'html[data-device-mode="custom"]{font-size:max(12px,min(' + base.toFixed(3) + 'px,100vw / 120,100vh / 67.5));}';
        document.head.appendChild(style);
      }
    })();
  </script>
  <title>初始化中 - Fuji Electric</title>
  <style>
    :root { --blue:#0877c9; --blue-deep:#064b83; --blue-soft:#e9f5fc; --ink:#102d43; --muted:#6d8494; --line:#dbe9f3; --status-h:3.5rem; --font-cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC"; }
    html[lang="ja"] { --font-cjk:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo","PingFang SC"; }
    html[lang="ko"] { --font-cjk:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","PingFang SC"; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-width:47.5rem; }
    html { font-size:min(100vw / 120,100dvh / 67.5); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    @media (orientation:landscape) { html { font-size:max(12px,min(100vw / 120,100dvh / 67.5)); } }
    body { color:var(--ink); background:#f4f8fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,var(--font-cjk),sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; } button:focus-visible { outline:3px solid rgba(8,119,201,.3); outline-offset:3px; }
    .fault-page { position:relative; display:flex; flex-direction:column; width:100%; height:100dvh; min-height:700px; overflow:hidden; background:radial-gradient(circle at 50% 30%,rgba(178,216,243,.34),transparent 42%),radial-gradient(circle at 8% 78%,rgba(200,229,246,.28),transparent 32%),radial-gradient(circle at 92% 72%,rgba(200,229,246,.28),transparent 32%),linear-gradient(180deg,#fbfdff 0%,#f4f9fd 62%,#e9f3fa 100%); }
    .fault-page::before,.fault-page::after { position:absolute; z-index:0; border:1px solid rgba(120,180,220,.14); border-radius:50%; content:""; pointer-events:none; }
    .fault-page::before { top:-180px; left:-140px; width:620px; height:620px; } .fault-page::after { right:-190px; bottom:-220px; width:720px; height:720px; }
    .status-bar { position:relative; z-index:20; display:flex; flex:0 0 var(--status-h); align-items:center; justify-content:space-between; gap:1.5rem; padding:0 1.75rem; border-bottom:.0625rem solid #dae5ee; color:#4a6478; background:#e9eff5; font-size:.8125rem; letter-spacing:.01em; }
    .status-left,.status-right,.status-item { display:flex; align-items:center; } .status-left,.status-right { gap:1.75rem; } .status-item { gap:.5rem; white-space:nowrap; }
    .status-item svg { width:1rem; height:1rem; } .status-right svg { color:#8ea6b6; } .machine-id { color:#6d8598; } .machine-id strong { color:#35566e; font-weight:500; }
    .status-logo { display:inline-flex; padding:0; border:0; color:#a3b8c6; background:none; font-size:1.375rem; font-style:italic; font-weight:900; letter-spacing:-.12em; line-height:1; cursor:pointer; } .status-logo span { transform:skew(-8deg); }
    .fault-body { position:relative; z-index:1; display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; min-height:0; padding:24px 40px 8px; text-align:center; }
    .visual-wrap { position:relative; display:flex; align-items:center; justify-content:center; }
    .visual-halo { position:absolute; width:430px; height:430px; border-radius:50%; background:radial-gradient(circle,rgba(140,196,236,.26),rgba(190,224,246,.14) 58%,transparent 66%); }
    .visual-ring { position:absolute; width:352px; height:352px; border:1px dashed rgba(120,180,220,.34); border-radius:50%; animation:ring-spin 26s linear infinite; }
    @keyframes ring-spin { to { transform:rotate(360deg); } }
    .visual-card { position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; width:clamp(196px,29.4vh,318px); height:clamp(196px,29.4vh,318px); border:1px solid #d4e7f6; border-radius:clamp(28px,4.3vh,46px); background:linear-gradient(158deg,#fff 0%,#eaf5ff 54%,#d8ecfd 100%); box-shadow:0 30px 66px rgba(9,80,140,.14),inset 0 1px 0 #fff; }
    /* 初始化主图形：提供的插画自带圆角玻璃面板，面板外还有一圈发光留白。
       按 cover 铺满卡片后再放大 1.42 倍，把发光留白和自带面板边一起裁到卡外，
       机器与进度环才真正顶到卡边，也不会出现「卡框里再套一层框」。 */
    .visual-card .init-art { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; object-position:center; transform:scale(1.42); transform-origin:center; animation:init-float 4s ease-in-out infinite; }
    @keyframes init-float { 0%,100% { transform:scale(1.42) translateY(0); } 50% { transform:scale(1.42) translateY(-2.3%); } }
    .fault-title { margin:clamp(18px,4vh,44px) 0 0; font-size:clamp(30px,5.4vh,58px); font-weight:750; line-height:1.24; letter-spacing:.015em; color:#0d3b5d; }
    .fault-message { margin:clamp(10px,1.7vh,18px) 0 0; max-width:880px; color:var(--muted); font-size:clamp(15px,2.15vh,23px); line-height:1.85; }
    .phone-card { display:flex; align-items:center; gap:clamp(12px,1.9vh,20px); margin-top:clamp(15px,4.2vh,46px); padding:clamp(10px,1.7vh,20px) clamp(26px,4.4vh,50px) clamp(10px,1.7vh,20px) clamp(16px,2.4vh,28px); border:1px solid var(--line); border-radius:clamp(17px,2.4vh,24px); background:rgba(255,255,255,.94); box-shadow:0 16px 40px rgba(9,80,140,.08); }
    .phone-icon { display:flex; align-items:center; justify-content:center; width:clamp(44px,6.2vh,66px); height:clamp(44px,6.2vh,66px); border-radius:50%; color:var(--blue); background:var(--blue-soft); } .phone-icon svg { width:clamp(21px,2.8vh,30px); height:clamp(21px,2.8vh,30px); }
    .phone-copy { display:flex; flex-direction:column; align-items:flex-start; gap:3px; } .phone-label { color:#7d93a3; font-size:clamp(11.5px,1.4vh,15px); font-weight:650; letter-spacing:.14em; } .phone-number { color:var(--blue-deep); font-size:clamp(26px,4.1vh,44px); font-weight:750; letter-spacing:.045em; line-height:1.15; font-variant-numeric:tabular-nums; }
    .fault-thanks { margin:clamp(12px,3.4vh,36px) 0 0; color:#8ba2b1; font-size:clamp(13.5px,1.7vh,18px); letter-spacing:.06em; }
    @media (max-width:1400px) { .visual-halo,.visual-ring { display:none; } } @media (max-width:1200px) { .contact-item { display:none; } } @media (max-height:720px) { .fault-body { padding:12px 32px 4px; } .fault-page { min-height:600px; } }
    @media (prefers-reduced-motion:reduce) { .visual-ring, .visual-card .init-art { animation:none; } }
    .debug-dock { position:fixed; inset:0; z-index:200; display:none; } .debug-dock.is-open { display:block; } .debug-scrim { position:absolute; inset:0; background:rgba(6,28,45,.24); }
    .debug-panel { position:absolute; width:min(30rem,calc(100vw - 2rem)); max-height:calc(100vh - 6rem); overflow:auto; padding:.875rem 1rem 1rem; border:1px solid rgba(255,255,255,.18); border-radius:1.125rem; color:#fff; background:linear-gradient(158deg,#0b4f80,#08395c); box-shadow:0 1.5rem 3.5rem rgba(4,26,42,.42); }
    .debug-head { display:flex; align-items:center; gap:.5rem; padding-bottom:.6875rem; border-bottom:1px solid rgba(255,255,255,.16); } .debug-badge { padding:.125rem .4375rem; border-radius:.25rem; color:#08395c; background:#fff; font-size:.625rem; font-weight:800; } .debug-head-title { font-size:.8125rem; font-weight:700; } .debug-head-hint { margin-left:auto; color:rgba(255,255,255,.56); font-size:.6875rem; }
    .debug-close { width:1.75rem; height:1.75rem; margin-left:.375rem; padding:0; border:0; border-radius:50%; color:#fff; background:rgba(255,255,255,.14); cursor:pointer; }
    .debug-group { padding-top:.6875rem; } .debug-group + .debug-group { margin-top:.6875rem; border-top:1px solid rgba(255,255,255,.12); } .debug-label { margin:0 0 .4375rem; color:rgba(255,255,255,.62); font-size:.6875rem; font-weight:700; } .debug-row { display:flex; flex-wrap:wrap; gap:.375rem; }
    .debug-chip { display:inline-flex; align-items:center; padding:.375rem .75rem; border:1px solid rgba(255,255,255,.26); border-radius:62rem; color:#fff; background:rgba(255,255,255,.08); font-size:.75rem; font-weight:650; text-decoration:none; cursor:pointer; } .debug-chip[aria-pressed="true"],.debug-chip[aria-current="page"] { border-color:#fff; color:#08395c; background:#fff; } .debug-chip i { margin-left:.3rem; font-size:.625rem; font-style:normal; opacity:.66; }
  </style>
</head>
<body>
  <main class="fault-page" aria-label="设备初始化">
    <section class="status-bar" aria-label="设备信息">
      <div class="status-left">
        <button class="status-logo" id="debugTrigger" type="button" aria-expanded="false" aria-haspopup="dialog" aria-label="Fuji Electric"><span>FE</span></button>
        <div class="status-item machine-id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 6h6M9 18h6"/></svg><span>Machine ID：<strong>fuji12345678</strong></span></div>
        <div class="status-item contact-item"><span><span data-i18n="contact">联系我们</span>：800-1234-5678</span></div>
      </div>
      <div class="status-right"><time class="status-item" data-i18n="date">11月4日 23:40</time><svg width="18" height="16" viewBox="0 0 18 16" fill="currentColor" aria-label="网络状态"><rect x="1" y="11" width="3" height="4" rx="1"/><rect x="6" y="7" width="3" height="8" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg></div>
    </section>
    <section class="fault-body">
      <div class="visual-wrap"><div class="visual-halo" aria-hidden="true"></div><div class="visual-ring" aria-hidden="true"></div><div class="visual-card"><img class="init-art" src="assets/busy-initializing.png" alt="" aria-hidden="true"></div></div>
      <h1 class="fault-title" id="faultTitle">设备正在初始化</h1><p class="fault-message" id="faultMessage">设备正在准备，请稍候。准备完成后即可继续购买。</p>
      <div class="phone-card"><span class="phone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6.5 4h3l1.5 4-2 1.6a11 11 0 0 0 5.4 5.4L16 13l4 1.5v3a2 2 0 0 1-2.2 2A14.5 14.5 0 0 1 4 5.2 2 2 0 0 1 6 3z"/></svg></span><span class="phone-copy"><span class="phone-label" data-i18n="phoneLabel">客服电话</span><span class="phone-number">800-1234-5678</span></span></div>
      <p class="fault-thanks" data-i18n="thanks">感谢您的理解与支持</p>
    </section>
  </main>
  <div class="debug-dock" id="debugDock"><div class="debug-scrim" data-debug-close></div><div class="debug-panel" id="debugPanel" role="dialog" aria-label="调试面板">
    <div class="debug-head"><span class="debug-badge">DEBUG</span><span class="debug-head-title">测试入口</span><span class="debug-head-hint">上线前移除</span><button class="debug-close" type="button" data-debug-close aria-label="关闭">✕</button></div>
    <section class="debug-group"><p class="debug-label">屏幕尺寸</p><div class="debug-row"><button class="debug-chip" data-size-preset="s10">10″ <i>5×2</i></button><button class="debug-chip" data-size-preset="m21">21″ <i>5×3</i></button><button class="debug-chip" data-size-preset="l27">27″ <i>6×3</i></button><button class="debug-chip" data-size-preset="auto">自动</button><a class="debug-chip" href="setup.html?return=busy.html">自定义…</a></div></section>
    <section class="debug-group"><p class="debug-label">设备状态</p><div class="debug-row"><button class="debug-chip" data-state="initializing">初始化</button><button class="debug-chip" data-state="busy">忙碌</button><button class="debug-chip" id="recoverButton">恢复 → 售卖界面</button></div></section>
    <section class="debug-group"><p class="debug-label">故障页面</p><div class="debug-row"><button class="debug-chip" data-debug-nav="out-of-service.html">整机</button><button class="debug-chip" data-debug-nav="cleaning.html">清洗</button><button class="debug-chip" aria-current="page">初始化/忙碌</button><button class="debug-chip" data-debug-nav="cup-blocking.html">取杯</button><button class="debug-chip" data-debug-nav="payment-error.html">支付异常</button><button class="debug-chip" data-debug-nav="order-error.html">订单/制作</button></div></section>
  </div></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const I18N = {
      zh:{htmlLang:"zh-CN",contact:"联系我们",date:"11月4日 23:40",phoneLabel:"客服电话",thanks:"感谢您的理解与支持",initializing:{docTitle:"初始化中",title:"设备正在初始化",message:"设备正在准备，请稍候。准备完成后即可继续购买。"},busy:{docTitle:"设备忙碌",title:"设备暂停购买",message:"设备当前忙碌，请稍候。恢复后即可继续购买。"}},
      ja:{htmlLang:"ja",contact:"お問い合わせ",date:"11月4日 23:40",phoneLabel:"お問い合わせ電話番号",thanks:"ご理解とご協力をお願いいたします",initializing:{docTitle:"初期化中",title:"初期化しています",message:"準備が完了するまでしばらくお待ちください。完了後、ご購入いただけます。"},busy:{docTitle:"一時停止中",title:"ただいま購入を一時停止しています",message:"装置が混み合っています。しばらくしてから再度お試しください。"}},
      en:{htmlLang:"en",contact:"Contact",date:"Nov 4, 23:40",phoneLabel:"Customer service",thanks:"Thank you for your understanding",initializing:{docTitle:"Initializing",title:"Machine is initializing",message:"Please wait while the machine gets ready. You can continue purchasing shortly."},busy:{docTitle:"Machine busy",title:"Purchasing is temporarily paused",message:"The machine is currently busy. Please wait a moment."}},
      ko:{htmlLang:"ko",contact:"문의",date:"11월 4일 23:40",phoneLabel:"고객센터 전화",thanks:"양해해 주셔서 감사합니다",initializing:{docTitle:"초기화 중",title:"기기를 초기화하고 있습니다",message:"준비가 끝날 때까지 잠시만 기다려 주세요. 완료 후 구매하실 수 있습니다."},busy:{docTitle:"기기 사용 중",title:"현재 구매가 일시 중지되었습니다",message:"기기가 현재 사용 중입니다. 잠시만 기다려 주세요."}}
    };
    let language = I18N[params.get("lang")] ? params.get("lang") : "zh";
    try { if (!I18N[params.get("lang")] && I18N[localStorage.getItem("fujiLanguage")]) language = localStorage.getItem("fujiLanguage"); } catch (error) { console.warn(error); }
    let state = params.get("state") === "busy" ? "busy" : "initializing";
    function render() {
      const dictionary = I18N[language];
      const copy = dictionary[state];
      document.documentElement.lang = dictionary.htmlLang;
      document.title = copy.docTitle + " - Fuji Electric";
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = dictionary[el.dataset.i18n]; });
      document.getElementById("faultTitle").textContent = copy.title;
      document.getElementById("faultMessage").textContent = copy.message;
      document.querySelector(".fault-page").setAttribute("aria-label", copy.title);
      document.querySelectorAll("[data-state]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.state === state)));
    }
    window.fujiBusyState = function (next) { if (next !== "busy" && next !== "initializing") return false; state = next; render(); return true; };
    const RECOVERED = ["ok","normal","online","ready","recovered","resumed"];
    let leaving = false;
    window.fujiDeviceState = function (next) {
      const value = typeof next === "string" ? next : next && next.status;
      if (leaving || typeof value !== "string" || !RECOVERED.includes(value.trim().toLowerCase())) return false;
      leaving = true; window.location.replace("index.html?lang=" + encodeURIComponent(language)); return true;
    };
    render();
  </script>
  <script>
    (function () {
      const trigger = document.getElementById("debugTrigger"), dock = document.getElementById("debugDock"), panel = document.getElementById("debugPanel");
      function place() { const r = trigger.getBoundingClientRect(); panel.style.left = Math.max(16,Math.min(r.left,innerWidth-panel.offsetWidth-16)) + "px"; panel.style.top = Math.max(16,Math.min(r.bottom+12,innerHeight-220)) + "px"; panel.style.maxHeight = Math.max(240,innerHeight-panel.offsetTop-20) + "px"; }
      function close() { dock.classList.remove("is-open"); trigger.setAttribute("aria-expanded","false"); }
      trigger.addEventListener("click",() => { dock.classList.toggle("is-open"); trigger.setAttribute("aria-expanded",String(dock.classList.contains("is-open"))); if (dock.classList.contains("is-open")) place(); });
      dock.addEventListener("click",event => { if (event.target.closest("[data-debug-close]")) close(); }); document.addEventListener("keydown",event => { if (event.key === "Escape") close(); });
      const device = window.FUJI_DEVICE || {mode:"auto"}, REF = {s10:[1024,768],m21:[1920,1080],l27:[2560,1440]};
      dock.querySelectorAll("[data-size-preset]").forEach(button => { const preset = button.dataset.sizePreset; button.setAttribute("aria-pressed",String(preset === "auto" ? device.mode === "auto" : device.mode === "preset" && device.layout === preset)); button.addEventListener("click",() => { const payload = preset === "auto" ? {mode:"auto",preset:null,layout:null,w:0,h:0} : {mode:"preset",preset,layout:preset,w:REF[preset][0],h:REF[preset][1]}; try { localStorage.setItem("fujiDevice",JSON.stringify(payload)); } catch(error){console.warn(error);} location.reload(); }); });
      dock.querySelectorAll("[data-debug-nav]").forEach(button => button.addEventListener("click",() => { location.href = button.dataset.debugNav + "?lang=" + language; }));
      dock.querySelectorAll("[data-state]").forEach(button => button.addEventListener("click",() => window.fujiBusyState(button.dataset.state)));
      document.getElementById("recoverButton").addEventListener("click",() => window.fujiDeviceState("ok"));
    })();
  </script>
</body>
</html>
