<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fa">
  <script>
    (function () {
      const supported = ["zh", "en", "ja", "ko"];
      const requested = new URLSearchParams(location.search).get("lang");
      let saved = "";
      try { saved = localStorage.getItem("fujiLanguage") || ""; } catch (error) {}
      const language = supported.includes(requested) ? requested : (supported.includes(saved) ? saved : "zh");
      document.documentElement.lang = language === "zh" ? "zh-CN" : language;
    })();
  </script>
  <title>Fuji Electric · 竖屏商品选择</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      --surface-2: #eef5fa;
      --border: #e4ebf0;
      --text: #102d43;
      --text-2: #6c7e8c;
      --accent: #0878ce;
      --accent-dark: #075b9e;
      --accent-deep: #064b83;
      --accent-weak: #e8f4fd;
      --muted: #8a9aa6;
      --radius: 1rem;
      --page-x: 2rem;
      --font-cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC";
    }
    html[lang="ja"] { --font-cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", "PingFang SC"; }
    html[lang="ko"] { --font-cjk: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", "PingFang SC"; }
    /* 设计画布 1200×1920：1rem = 16 设计像素，按宽高中较小的比例整体缩放。 */
    html { font-size: min(100vw / 75, 100vh / 120); font-size: min(100vw / 75, 100dvh / 120); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      color: var(--text); background: #e9eff5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, var(--font-cjk), sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 0.1875rem solid rgba(8,120,206,.3); outline-offset: 0.1875rem; }
    button:disabled { cursor: default; }
    .hidden { display: none !important; }

    .portrait-app {
      position: relative; display: flex; flex-direction: column;
      width: 100%; max-width: 75rem; height: 100vh; height: 100dvh;
      margin: 0 auto; overflow: hidden; background: var(--bg);
    }

    /* 设备状态栏 */
    .status-bar {
      z-index: 20; display: flex; flex: 0 0 3.25rem; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 0 var(--page-x); border-bottom: 0.0625rem solid #dae5ee;
      color: #4a6478; background: #e9eff5; font-size: 0.875rem; letter-spacing: .01em;
    }
    .status-left, .status-right, .status-item { display: flex; align-items: center; }
    .status-left { gap: 1.75rem; min-width: 0; }
    .status-right { gap: 1.25rem; flex: 0 0 auto; }
    .status-item { gap: 0.5rem; white-space: nowrap; }
    .status-item svg { width: 1rem; height: 1rem; }
    .machine-id { color: #6d8598; }
    .machine-id strong { color: #35566e; font-weight: 600; }
    .network-status { color: #6f93aa; }
    .network-status.offline { color: #b07818; }

    /* 品牌导航 */
    .brand-header {
      z-index: 30; display: flex; flex: 0 0 6.5rem; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 0 var(--page-x); background: var(--surface); border-bottom: 0.0625rem solid #e7eef3;
    }
    .brand { display: flex; align-items: center; gap: 0.875rem; min-width: 0; color: var(--accent-dark); }
    .brand-mark { font-size: 2.25rem; font-style: italic; font-weight: 900; letter-spacing: -.12em; transform: skew(-8deg); }
    .brand-name { font-size: 1.5rem; font-weight: 750; letter-spacing: -.025em; white-space: nowrap; }
    /* ===== 复用横屏既有控件规格：payment.html 帮助按钮 + 商品页语言菜单 ===== */
    .header-actions { display: flex; align-items: center; gap: 1.125rem; margin-left: auto; }
    .header-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.625rem;
      min-width: 8.25rem; min-height: 3.375rem; padding: 0 1.4375rem;
      border: 0.0625rem solid var(--border); border-radius: 62.4375rem;
      color: var(--text); background: #fff; cursor: pointer;
    }
    .header-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }
    .header-button svg { width: 1.25rem; height: 1.25rem; }
    .language-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5625rem;
      min-height: 3.25rem; padding: 0 1.3125rem;
      border: 0.0625rem solid var(--border); border-radius: 62.4375rem;
      color: var(--text); background: var(--surface); white-space: nowrap; cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .language-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }
    .language-button svg { width: 1.25rem; height: 1.25rem; }
    .language-picker { position: relative; display: flex; flex: 0 0 auto; }
    .language-picker .caret { transition: transform .18s ease; }
    .language-picker.open .caret { transform: rotate(180deg); }
    .language-menu {
      position: absolute; z-index: 70; top: calc(100% + 0.75rem); right: 0;
      display: none; min-width: 14.125rem; padding: 0.625rem;
      border: 0.0625rem solid var(--border); border-radius: 1.25rem;
      background: #fff; box-shadow: 0 1.125rem 2.5rem rgba(16,45,67,.16);
    }
    .language-picker.open .language-menu, .language-menu.open { display: block; }
    .language-option {
      display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 3.5rem;
      padding: 0 1rem; border: 0; border-radius: 0.8125rem;
      color: var(--text); background: transparent; font-size: 1rem; font-weight: 600;
      text-align: left; cursor: pointer;
    }
    .language-option:hover { background: var(--accent-weak); }
    .language-option.active { color: #fff; background: var(--accent); }
    .language-option .lang-flag { font-size: 1.3125rem; line-height: 1; }

    /* 横向广告：图片与容器同比例，contain 不裁切、不拉伸。 */
    .ad-section { flex: 0 0 18rem; padding: 0 var(--page-x) 1rem; }
    .ad-viewport { position: relative; width: 100%; height: 17rem; overflow: hidden; border-radius: var(--radius); background: #eaf4fb; }
    .ad-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .35s ease; }
    .ad-slide.active { opacity: 1; }
    .ad-dots {
      position: absolute; left: 50%; bottom: 0.75rem; z-index: 3; display: flex; gap: 0.5rem;
      padding: 0.375rem 0.625rem; border-radius: 62.4375rem; background: rgba(255,255,255,.86); transform: translateX(-50%);
    }
    .ad-dot { width: 0.5rem; height: 0.5rem; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 50%; background: #a9c3d4; cursor: pointer; }
    .ad-dot.active { width: 1.25rem; border-radius: 62.4375rem; background: var(--accent); }

    /* 分类：左对齐，内容超宽时仅本栏横向滑动。 */
    .category-section { flex: 0 0 5.5rem; padding: 0 var(--page-x) 1rem; }
    .category-nav {
      display: flex; align-items: center; gap: 0.75rem; width: 100%; height: 4rem;
      overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scroll-behavior: smooth;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-button {
      display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center;
      min-height: 44px; height: 3.5rem; padding: 0 1.5rem; border: 0.0625rem solid #d7e5ef;
      border-radius: 62.4375rem; color: #35566e; background: #fff; font-size: 1.125rem; font-weight: 650;
      white-space: nowrap; cursor: pointer;
    }
    .category-button:hover { border-color: #9ecbe8; background: #f0f8fd; }
    .category-button.active { color: #fff; border-color: var(--accent); background: var(--accent); }

    /* 商品区永远 3 列 × 3 行；剩余高度全部留给商品。 */
    .product-grid {
      display: grid; flex: 1 1 auto; min-height: 0; padding: 0 var(--page-x);
      grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    .product-card {
      position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
      padding: 1rem; border: 0.0625rem solid #e1eaf1; border-radius: var(--radius);
      background: var(--surface); box-shadow: 0 0.25rem 0.875rem rgba(16,45,67,.05);
    }
    .product-media { position: relative; display: grid; flex: 1 1 auto; place-items: center; min-height: 0; }
    .product-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    .product-card[data-pack="can"] .product-image { max-width: 88%; max-height: 100%; }
    .product-card[data-pack="bottle"] .product-image { max-width: 80%; max-height: 100%; }
    .product-card[data-pack="bag"] .product-image { max-width: 96%; max-height: 94%; }
    .product-card[data-pack="box"] .product-image { max-width: 94%; max-height: 90%; }
    .promotion-tag {
      position: absolute; top: 0; left: 0; z-index: 2; padding: 0.375rem 0.75rem;
      border-radius: 62.4375rem; color: var(--accent-dark); background: var(--accent-weak);
      font-size: 0.8125rem; font-weight: 750;
    }
    .product-info {
      position: relative; z-index: 5; display: grid; flex: 0 0 7.5rem;
      grid-template-columns: minmax(0, 1fr) 2.875rem; grid-template-rows: auto auto;
      column-gap: 0.75rem; padding-top: 0.75rem;
    }
    .product-name {
      display: -webkit-box; grid-column: 1; grid-row: 1; align-self: start; min-height: 2.7em; margin: 0;
      overflow: hidden; color: var(--text); font-size: 1.125rem; font-weight: 700; line-height: 1.35;
      -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere;
    }
    .price-line { display: flex; grid-column: 1; grid-row: 2; align-items: baseline; align-self: end; gap: 0.5rem; min-width: 0; }
    .product-price { color: var(--accent); font-size: 1.375rem; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
    .original-price { color: var(--muted); font-size: 0.9375rem; font-weight: 500; white-space: nowrap; }
    /* 复用 packaged.html .add-button：2.875rem 圆形蓝描边、svg 50%、原有阴影与按压动效 */
    .add-button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.875rem; aspect-ratio: 1; min-width: 44px; min-height: 44px; padding: 0;
      border: 0.125rem solid var(--accent); border-radius: 50%;
      color: var(--accent); background: #fff;
      box-shadow: 0 0.25rem 0.75rem rgba(8,119,201,.16);
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .14s ease;
    }
    .add-button:hover {
      color: #fff; background: var(--accent);
      box-shadow: 0 0.5rem 1.125rem rgba(8,119,201,.32); transform: translateY(-0.0625rem);
    }
    .add-button:active { transform: scale(.94); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.24); }
    .add-button svg { width: 50%; height: 50%; stroke-width: 2.4; }
    /* 售罄沿用既有纯图形方案：白雾 + 禁止圆牌，不增加售罄文字。 */
    .sold-out-veil { position: absolute; inset: 0; z-index: 3; display: none; background: rgba(247,251,253,.72); }
    .sold-out-mark {
      position: absolute; top: 34%; left: 50%; z-index: 4; display: none; place-items: center;
      width: 4.5rem; height: 4.5rem; border-radius: 50%; color: #8a9aa6; background: #fff;
      box-shadow: 0 0.5rem 1.5rem rgba(37,65,83,.12); transform: translate(-50%,-50%);
    }
    .sold-out-mark svg { width: 2.5rem; height: 2.5rem; }
    .product-card.is-sold-out .sold-out-veil, .product-card.is-sold-out .sold-out-mark { display: grid; }
    .product-card.is-sold-out .sold-out-veil { display: block; }
    .product-card.is-sold-out .product-image { filter: grayscale(1); opacity: .42; }
    .product-card.is-sold-out .product-name, .product-card.is-sold-out .product-price { color: var(--muted); }
    .product-card.is-sold-out .add-button,
    .product-card.is-sold-out .add-button:hover,
    .product-card.is-sold-out .add-button:active {
      color: #aabdc9; border-color: #bccbd6; background: #f2f6f9;
      box-shadow: none; transform: none; cursor: default;
    }
    .product-card.is-sold-out .promotion-tag { color: #8295a2; background: #eef2f5; }

    /* 底栏：分页在左，购物车胶囊在右，不遮挡商品。 */
    .bottom-bar {
      display: flex; flex: 0 0 7rem; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1rem var(--page-x); border-top: 0.0625rem solid #e2ebf1; background: #fff;
    }
    /* 复用 packaged.html 分页控件：2.75rem × 2.625rem、渐变底、蓝色渐变选中态 */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 0.625rem; min-width: 0; color: var(--text-2); font-size: 0.8125rem; }
    .page-numbers { display: inline-flex; align-items: center; gap: 0.625rem; }
    .page-nav, .page-number {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 2.75rem; height: 2.625rem; padding: 0 0.875rem;
      border: 0.0625rem solid #c6dbe8; border-radius: 0.75rem;
      color: var(--accent-dark); background: linear-gradient(180deg, #ffffff, #f2f8fc);
      box-shadow: 0 0.1875rem 0.5rem rgba(24,66,96,.09), inset 0 0.0625rem 0 #fff;
      font-size: 0.9375rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .page-nav:hover:not(:disabled), .page-number:hover:not(.active) {
      border-color: var(--accent); color: var(--accent); transform: translateY(-0.125rem);
      box-shadow: 0 0.5625rem 1.125rem rgba(8,119,201,.2);
    }
    .page-nav:active:not(:disabled), .page-number:active:not(.active) { transform: translateY(0); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.14); }
    .page-number.active {
      border-color: transparent; color: #fff;
      background: linear-gradient(135deg, #2f95da, #0e6bad);
      box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.32), inset 0 0.0625rem 0 rgba(255,255,255,.28);
    }
    .page-nav:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; background: #f5f9fc; }
    .page-nav svg { width: 1.125rem; height: 1.125rem; }
    .page-summary { margin-left: 0.875rem; color: var(--text-2); font-size: 0.875rem; white-space: nowrap; }
    .page-summary strong { color: #35566e; font-weight: 700; }
    /* 复用 packaged.html .open-cart-button + .cart-count（含 badge/pulse 加购反馈动效） */
    .open-cart-button {
      display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0.625rem;
      min-height: 3.25rem; padding: 0 1.5rem; border: 0; border-radius: 62.4375rem;
      color: #fff; background: var(--accent); box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.22);
      font-size: 1.25rem; font-weight: 700; letter-spacing: .01em; cursor: pointer;
    }
    .open-cart-button svg { width: 1.3125rem; height: 1.3125rem; }
    .cart-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.8125rem; height: 1.8125rem; padding: 0 0.5rem;
      border-radius: 62.4375rem; color: var(--accent-dark); background: #fff;
      font-size: 0.9375rem; font-weight: 800;
    }
    .open-cart-button .cart-count { min-width: 1.75rem; height: 1.75rem; font-size: 1rem; color: var(--accent); }
    @keyframes cart-badge-blink {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,255,255,.85); }
      16%  { transform: scale(1.45); box-shadow: 0 0 0 0.4rem rgba(255,255,255,.72); }
      34%  { transform: scale(1);    box-shadow: 0 0 0 0.52rem rgba(255,255,255,0); }
      54%  { transform: scale(1.3);  box-shadow: 0 0 0 0.32rem rgba(255,255,255,.62); }
      72%  { transform: scale(1);    box-shadow: 0 0 0 0.46rem rgba(255,255,255,0); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    @keyframes cart-button-pulse {
      0%   { transform: scale(1);    box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.22), 0 0 0 0 rgba(8,119,201,.5); }
      35%  { transform: scale(1.045); box-shadow: 0 0.75rem 1.75rem rgba(8,119,201,.3), 0 0 0 0.5rem rgba(8,119,201,.26); }
      100% { transform: scale(1);    box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.22), 0 0 0 1.5rem rgba(8,119,201,0); }
    }
    .cart-count.is-bumping { animation: cart-badge-blink .72s cubic-bezier(.36,.07,.19,.97) 1 both; }
    .open-cart-button.is-bumping { animation: cart-button-pulse .78s ease-out 1; }
    @media (prefers-reduced-motion: reduce) {
      .cart-count.is-bumping, .open-cart-button.is-bumping { animation: none; }
    }

    /* 购物车抽屉 */
    .drawer-layer { position: fixed; inset: 0; z-index: 100; visibility: hidden; pointer-events: none; }
    .drawer-layer.open { visibility: visible; pointer-events: auto; }
    .drawer-backdrop { position: absolute; inset: 0; background: rgba(13,45,66,.42); opacity: 0; transition: opacity .24s ease; }
    .drawer-layer.open .drawer-backdrop { opacity: 1; }
    .cart-sheet {
      position: absolute; left: 50%; bottom: 0; display: flex; flex-direction: column;
      width: min(69rem, calc(100% - 4rem)); height: min(58rem, 86vh); height: min(58rem, 86dvh);
      overflow: hidden; border-radius: 1.5rem 1.5rem 0 0; background: #fff;
      box-shadow: 0 -1rem 3rem rgba(13,45,66,.16); transform: translate(-50%,102%); transition: transform .28s ease;
    }
    .drawer-layer.open .cart-sheet { transform: translate(-50%,0); }
    /* 复用 packaged.html 购物车面板：深蓝头部、条目字号、合计与结算按钮 */
    .cart-header {
      display: flex; flex: 0 0 6.25rem; align-items: center; justify-content: space-between;
      padding: 0 2.375rem; color: #fff; background: var(--accent-dark);
    }
    .cart-title { display: flex; align-items: center; gap: 0.8125rem; margin: 0; font-size: 1.625rem; font-weight: 720; }
    .cart-title > svg { width: 1.6875rem; height: 1.6875rem; }
    .close-cart { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; padding: 0; border: 0; color: #fff; background: transparent; cursor: pointer; }
    .close-cart svg { width: 1.625rem; height: 1.625rem; }
    .cart-items { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; padding: 0; overflow-y: auto; scroll-behavior: smooth; }
    .cart-item {
      display: grid; grid-template-columns: 9.375rem minmax(0,1fr) auto; align-items: center;
      gap: 0.75rem 1.5rem; padding: 0.875rem 2.375rem; border-bottom: 0.0625rem solid #edf1f4;
    }
    .cart-thumb { width: 9.36rem; height: 9.36rem; aspect-ratio: 1; object-fit: contain; border-radius: 0; background: transparent; filter: drop-shadow(0 0.25rem 0.5rem rgba(24,58,84,.12)); }
    .cart-item-main { min-width: 0; }
    .cart-item-name { display: flex; align-items: center; gap: 0.625rem; margin: 0 0 0.5625rem; font-size: 1.375rem; font-weight: 750; line-height: 1.25; }
    .cart-item-title { display: -webkit-box; min-width: 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; line-break: strict; }
    .cart-item-variant { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0; color: var(--text-2); font-size: 1.0625rem; line-height: 1.45; }
    .cart-item-qty { flex: none; padding: 0.125rem 0.5rem; border-radius: 62.4375rem; color: var(--accent-dark); background: #eaf2fa; font-size: 0.875rem; font-weight: 800; line-height: 1.3; white-space: nowrap; }
    .cart-item-tail { display: flex; flex-direction: row; align-items: center; gap: 1.125rem; }
    .cart-item-price { font-size: 1.625rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
    /* 竖屏保留数量增减：按钮沿用横屏 .remove-item 的 3.5rem / .875rem / #f2f6f9 规格 */
    .quantity-stepper { display: flex; align-items: center; gap: 0.5rem; }
    .quantity-button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 3.5rem; height: 3.5rem; border: 0; border-radius: 0.875rem;
      color: #4c6172; background: #f2f6f9; font-size: 1.75rem; cursor: pointer;
      transition: background .16s ease, color .16s ease;
    }
    .quantity-button:hover { color: var(--accent); background: #e3edf6; }
    .quantity-button:active { background: #d7e5f1; }
    .quantity-value { min-width: 1.5rem; text-align: center; font-size: 1.125rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .remove-item { display: inline-flex; align-items: center; justify-content: center; width: 3.5rem; height: 3.5rem; padding: 0; border: 0; border-radius: 0.875rem; color: #4c6172; background: #f2f6f9; cursor: pointer; transition: background .16s ease, color .16s ease; }

    function t(key, vars = {}) {

    document.getElementById("cartBackdrop").addEventListener("click", closeCart);
    document.getElementById("cartItems").addEventListener("click", event => {
      const remove = event.target.closest("[data-cart-remove]");
      if (remove) { state.cart.delete(Number(remove.dataset.cartRemove)); renderCart(); return; }
      const button = event.target.closest("[data-cart-action]");
      if (button) changeQuantity(Number(button.dataset.id), button.dataset.cartAction === "increase" ? 1 : -1);
    });
    document.getElementById("checkoutButton").addEventListener("click", () => { if (cartQuantity()) showToast(t("checkoutPending")); });
    document.getElementById("helpButton").addEventListener("click", openHelp);
    document.getElementById("helpClose").addEventListener("click", closeHelp);
    document.getElementById("helpDone").addEventListener("click", closeHelp);
    document.getElementById("helpBackdrop").addEventListener("click", closeHelp);
    document.getElementById("languageButton").addEventListener("click", () => setLanguageMenu(!document.getElementById("languagePicker").classList.contains("open")));
    languageMenu.addEventListener("click", event => { const button = event.target.closest("[data-set-language]"); if (button) setLanguage(button.dataset.setLanguage); });
    document.addEventListener("click", event => { if (!document.getElementById("languagePicker").contains(event.target)) setLanguageMenu(false); });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (helpLayer.classList.contains("open")) closeHelp();
      else if (cartLayer.classList.contains("open")) closeCart();
      else setLanguageMenu(false);
    });
    document.getElementById("adDots").addEventListener("click", event => { const dot = event.target.closest("[data-ad-index]"); if (dot) setAd(Number(dot.dataset.adIndex)); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { if (state.adTimer) clearInterval(state.adTimer); } else startAdRotation(); });
    window.addEventListener("online", () => document.getElementById("networkStatus").classList.remove("offline"));
    window.addEventListener("offline", () => document.getElementById("networkStatus").classList.add("offline"));

    window.fujiPortrait = {
      state: () => ({ language: state.language, category: state.category, page: state.page, pageCount: pageCount(), visibleIds: Array.from(productGrid.querySelectorAll("[data-product-id]"), card => Number(card.dataset.productId)), cartCount: cartQuantity(), total: cartTotal(), soldOut: Array.from(state.soldOut), cartOpen: cartLayer.classList.contains("open"), helpOpen: helpLayer.classList.contains("open"), adIndex: state.adIndex }),
      setCategory, goToPage, addToCart, setLanguage, openCart, closeCart, openHelp, closeHelp, setAd,
      setSoldOut(ids) {
        if (ids === "off" || (Array.isArray(ids) && ids.length === 0)) state.soldOut.clear();
        else state.soldOut = new Set((Array.isArray(ids) ? ids : String(ids).split(",")).map(Number).filter(Number.isFinite));
        state.soldOut.forEach(id => state.cart.delete(id));
        renderProducts(); renderCart();
      }
    };

    applyI18n(); renderCategories(); renderProducts(); renderPagination(); renderCart();
    document.getElementById("networkStatus").classList.toggle("offline", !navigator.onLine);
    setAd(Math.max(0, Math.min(1, Number(params.get("ad")) || 0)), false); startAdRotation(); setInterval(updateTime, 30000);
    if (params.get("cart") === "1") openCart();
    if (params.get("help") === "1") openHelp();
  </script>
</body>
</html>
