<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 首帧语言：样式生效前把 <html lang> 定到实际语言，避免中文界面先按日文字形渲染一帧 -->
  <script>
    (function () {
      var map = { ja: "ja", zh: "zh-CN", en: "en", ko: "ko", fr: "fr", vi: "vi", th: "th" };
      var lang = null;
      try {
        var requested = new URLSearchParams(window.location.search).get("lang");
        lang = map[requested] || map[localStorage.getItem("fujiLanguage")] || null;
      } catch (error) {
        console.warn("首帧语言读取失败。", error);
      }
      if (lang) document.documentElement.lang = lang;
    })();
  </script>

  <!-- 设备配置引导：读取 setup.html 保存的档位，决定排版标记与根字号基准 -->
  <script>
    (function () {
      var KEY = "fujiDevice";
      var root = document.documentElement;
      var device = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) device = JSON.parse(raw);
      } catch (error) {
        console.warn("设备配置读取失败。", error);
      }

      // 与 setup.html 中的推断逻辑保持一致
      function layoutForWidth(width) {
        if (width >= 2200) return "l27";
        if (width >= 1280) return "m21";
        return "s10";
      }

      var mode = device && device.mode ? device.mode : "auto";
      var layout = null;
      var base = null;

      if (mode === "preset" && device.layout) {
        layout = device.layout;
      } else if (mode === "custom" && device.w > 0 && device.h > 0) {
        layout = layoutForWidth(device.w);
        base = Math.min(device.w / 120, device.h / 67.5);
      } else {
        mode = "auto";
        layout = layoutForWidth(window.innerWidth);
      }

      root.dataset.deviceMode = mode;
      root.dataset.deviceLayout = layout;
      window.FUJI_DEVICE = { mode: mode, layout: layout };

      // 自定义分辨率：把根字号钳到该基准对应的设计字号，且不超过真实视口允许的尺寸
      if (base && base > 0) {
        var style = document.createElement("style");
        style.textContent =
          'html[data-device-mode="custom"]{font-size:max(12px,min(' +
          base.toFixed(3) + 'px,100vw / 120,100vh / 67.5));}';
        document.head.appendChild(style);
      }
    })();
  </script>
  <title>Welcome</title>
  <style>
    :root {
      --fuji-blue: #075b9e;
      --fuji-blue-soft: rgba(7, 91, 158, .88);
      --text: #17384e;
      --white: #ffffff;
    }

    /* ===== 视口等比缩放基准（与 index.html 一致）=====
       设计稿 1920×1080，1rem = 16 设计像素。 */
    html { font-size: min(100vw / 120, 100vh / 67.5); }
    html { font-size: min(100vw / 120, 100dvh / 67.5); }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限，小屏（10 吋平板）上不会缩到看不清 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, var(--font-cjk), sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 统一字体：拉丁固定 SF Pro / Segoe UI；CJK 随文档语言切换，避免同一流程内跳字 */
    :root { --font-cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC"; }
    html[lang="ja"] { --font-cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", "PingFang SC"; }
    html[lang="ko"] { --font-cjk: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", "PingFang SC"; }
    html[lang="th"] { --font-cjk: "Noto Sans Thai", "Thonburi", "Leelawadee UI", "Sukhumvit Set", "Tahoma", "PingFang SC"; }
    html[lang="th"] body { line-height: 1.35; }

    button { font: inherit; }
    button:focus-visible { outline: 0.1875rem solid rgba(255,255,255,.9); outline-offset: 0.25rem; }

    .welcome-screen {
      position: relative;
      --welcome-left: 10.5%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #eaf1f3;
      cursor: pointer;
    }
    .welcome-carousel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #eaf1f3;
    }
    .welcome-track {
      display: flex;
      width: 100%;
      height: 100%;
      transform: translateX(0);
      transition: transform .9s cubic-bezier(.45, .05, .25, 1);
      will-change: transform;
    }
    .welcome-background {
      flex: 0 0 100%;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .start-control {
      position: absolute;
      z-index: 2;
      left: var(--welcome-left);
      bottom: 20%;
    }
    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      width: auto;
      min-width: 16.75rem;
      max-width: 28rem;
      min-height: 4.875rem;
      padding: 0 2rem;
      border: 0.0625rem solid rgba(255,255,255,.38);
      border-radius: 1rem;
      color: var(--white);
      background: var(--fuji-blue-soft);
      box-shadow: 0 0.5rem 1.5rem rgba(28,62,82,.14);
      font-size: 1.375rem;
      font-weight: 650;
      letter-spacing: .04em;
      white-space: nowrap;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .start-button:hover { background: rgba(7,91,158,.96); transform: translateY(-0.125rem); }
    .start-button:active { transform: translateY(0); }
    .start-button svg { width: 1.5rem; height: 1.5rem; }

    /* 底部工具行：语言 + 屏幕尺寸入口同排放置，测试时一眼可见 */
    .welcome-tools {
      position: absolute;
      z-index: 2;
      left: var(--welcome-left);
      bottom: 7%;
      display: flex;
      align-items: flex-end;
      gap: 1.25rem;
    }
    .language-control {
      display: flex;
      align-items: center;
      gap: clamp(0.5rem, .6vw, 0.75rem);
    }
    .language-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      width: clamp(6.375rem, 6.9vw, 8.25rem);
      min-height: 4.875rem;
      padding: 0.625rem 0.75rem;
      border: 0.0625rem solid rgba(255,255,255,.82);
      border-radius: 0.8125rem;
      color: var(--text);
      background: rgba(255,255,255,.72);
      box-shadow: 0 0.3125rem 1rem rgba(28,62,82,.08);
      backdrop-filter: blur(0.5rem);
      -webkit-backdrop-filter: blur(0.5rem);
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .language-button:hover { border-color: rgba(7,91,158,.48); background: rgba(255,255,255,.9); }
    .language-button.active {
      border-color: var(--fuji-blue);
      color: var(--white);
      background: rgba(7,91,158,.88);
    }
    .language-flag { font-size: 1.5rem; line-height: 1; }
    .language-name { font-size: 0.875rem; font-weight: 600; line-height: 1.2; white-space: nowrap; }

    /* 左上品牌标热区：调试浮窗的隐藏入口（透明覆盖层，视觉上无变化；上线前随浮窗一并移除） */
    .welcome-logo-hit {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      width: 17%;
      height: 10%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
    /* ===== 调试浮窗：点左侧 LOGO 唤出，默认不显示（上线前整块移除） ===== */
    .debug-trigger { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .debug-trigger:focus-visible { outline: 0.125rem solid rgba(7,91,158,.5); outline-offset: 0.25rem; border-radius: 0.5rem; }

    .debug-dock { position: fixed; inset: 0; z-index: 200; display: none; }
    .debug-dock.is-open { display: block; }
    .debug-scrim { position: absolute; inset: 0; background: rgba(6,28,45,.24); }
    .debug-panel {
      position: absolute;
      width: min(30rem, calc(100vw - 2rem));
      max-height: calc(100vh - 6rem);
      overflow: auto;
      padding: 0.875rem 1rem 1rem;
      border: 0.0625rem solid rgba(255,255,255,.18);
      border-radius: 1.125rem;
      color: #fff;
      background: linear-gradient(158deg, #0b4f80 0%, #08395c 100%);
      box-shadow: 0 1.5rem 3.5rem rgba(4,26,42,.42);
      animation: debug-dock-in .16s ease-out;
    }
    @keyframes debug-dock-in { from { opacity: 0; transform: translateY(-0.375rem); } }

    .debug-head { display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.6875rem; border-bottom: 0.0625rem solid rgba(255,255,255,.16); }
    .debug-badge { padding: 0.125rem 0.4375rem; border-radius: 0.25rem; color: #08395c; background: #fff; font-size: 0.625rem; font-weight: 800; letter-spacing: .1em; }
    .debug-head-title { font-size: 0.8125rem; font-weight: 700; letter-spacing: .02em; }
    .debug-head-hint { margin-left: auto; color: rgba(255,255,255,.56); font-size: 0.6875rem; }
    .debug-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      margin-left: 0.375rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.14);
      font: inherit;
      font-size: 0.8125rem;
      line-height: 1;
      cursor: pointer;
    }
    .debug-close:hover { background: rgba(255,255,255,.28); }

    .debug-group { padding-top: 0.6875rem; }
    .debug-group + .debug-group { margin-top: 0.6875rem; border-top: 0.0625rem solid rgba(255,255,255,.12); }
    .debug-label { margin: 0 0 0.4375rem; color: rgba(255,255,255,.62); font-size: 0.6875rem; font-weight: 700; letter-spacing: .08em; }
    .debug-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .debug-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3125rem;
      padding: 0.375rem 0.75rem;
      border: 0.0625rem solid rgba(255,255,255,.26);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: .01em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .debug-chip:hover { background: rgba(255,255,255,.2); }
    .debug-chip[aria-current="page"], .debug-chip[aria-pressed="true"] { border-color: #fff; color: #08395c; background: #fff; }
    .debug-chip i { font-size: 0.625rem; font-style: normal; opacity: .66; }
    .debug-note { margin: 0.4375rem 0 0; color: rgba(255,255,255,.48); font-size: 0.625rem; line-height: 1.5; }
    /* 搬进浮窗的旧控件：原本为深色状态栏设计，这里保持原样即可；带 visible 门控的组在浮窗内始终显示 */
    .debug-panel .demo-controls, .debug-panel .demo-states { display: flex; }

  </style>
</head>

  <script>
    (function initWelcomeCarousel() {
      const track = document.getElementById("welcomeTrack");
      if (!track) return;
      const slideCount = 3;
      const interval = 5000;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let index = 0;
      let timer = null;

      function render(nextIndex) {
        index = nextIndex;
        track.style.transform = `translateX(-${index * 100}%)`;
      }

      function advance() {
        if (reduceMotion) {
          render((index + 1) % slideCount);
          return;
        }
        render(index + 1);
      }

      track.addEventListener("transitionend", event => {
        if (event.target !== track || event.propertyName !== "transform") return;
        if (index < slideCount) return;
        track.style.transition = "none";
        render(0);
        void track.offsetWidth;
        track.style.transition = "";
      });

      function start() {
        stop();
        timer = window.setInterval(advance, interval);
      }

      function stop() {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      start();
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
    })();
  </script>

  <script>
    const languageConfig = {
      ja: { htmlLang: "ja", startLabel: "注文を始める" },
      zh: { htmlLang: "zh-CN", startLabel: "开始点餐" },
      en: { htmlLang: "en", startLabel: "Start Order" },
      ko: { htmlLang: "ko", startLabel: "주문 시작" },
      fr: { htmlLang: "fr", startLabel: "Commander" },
      vi: { htmlLang: "vi", startLabel: "Bắt đầu gọi món" },
      th: { htmlLang: "th", startLabel: "เริ่มสั่งเครื่องดื่ม" }
    };

    const languageButtons = document.querySelectorAll("[data-language]");
    const startLabel = document.getElementById("startLabel");
    let currentLanguage = "zh";

    function selectLanguage(language) {
      const config = languageConfig[language] || languageConfig.zh;
      currentLanguage = languageConfig[language] ? language : "zh";
      document.documentElement.lang = config.htmlLang;
      startLabel.textContent = config.startLabel;
      languageButtons.forEach(button => {
        const active = button.dataset.language === currentLanguage;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      try {
        localStorage.setItem("fujiLanguage", currentLanguage);
      } catch (error) {
        console.warn("语言偏好无法保存。", error);
      }
    }

    function goToProducts() {
      window.location.href = `index.html?lang=${encodeURIComponent(currentLanguage)}`;
    }

    languageButtons.forEach(button => {
      button.addEventListener("click", event => {
        event.stopPropagation();
        selectLanguage(button.dataset.language);
        goToProducts();
      });
    });

    document.querySelector(".welcome-screen").addEventListener("click", () => goToProducts());

    // 与其他页面一致：URL 的 ?lang 优先，其次本机保存的语言，最后中文
    let initialLanguage = "zh";
    const requestedLanguage = new URLSearchParams(window.location.search).get("lang");
    if (languageConfig[requestedLanguage]) initialLanguage = requestedLanguage;
    try {
      const savedLanguage = localStorage.getItem("fujiLanguage");
      if (!languageConfig[requestedLanguage] && languageConfig[savedLanguage]) initialLanguage = savedLanguage;
    } catch (error) {
      console.warn("使用默认语言。", error);
    }
    selectLanguage(initialLanguage);
  </script>

  <script>
    // ===== 调试浮窗：点左侧 LOGO 唤出（默认不显示，上线前整块移除）=====
    (function initDebugDock() {
      const trigger = document.getElementById("debugTrigger");
      const dock = document.getElementById("debugDock");
      const panel = document.getElementById("debugPanel");
      if (!trigger || !dock || !panel) return;

      function place() {
        const rect = trigger.getBoundingClientRect();
        const left = Math.max(16, Math.min(rect.left, window.innerWidth - panel.offsetWidth - 16));
        const top = Math.max(16, Math.min(rect.bottom + 12, window.innerHeight - 220));
        panel.style.left = `${left}px`;
        panel.style.top = `${top}px`;
        panel.style.maxHeight = `${Math.max(240, window.innerHeight - top - 20)}px`;
      }
      function open() {
        dock.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        place();
      }
      function close() {
        dock.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      }

      trigger.addEventListener("click", event => {
        event.stopPropagation();
        if (dock.classList.contains("is-open")) close(); else open();
      });
      trigger.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
      });
      dock.addEventListener("click", event => {
        if (event.target.closest("[data-debug-close]")) close();
      });
      document.addEventListener("keydown", event => { if (event.key === "Escape") close(); });
      window.addEventListener("resize", () => { if (dock.classList.contains("is-open")) place(); });

      // 屏幕尺寸：直接写入本机配置再重载，不用离开当前页
      const device = window.FUJI_DEVICE || { mode: "auto", layout: "" };
      const REF = { s10: [1024, 768], m21: [1920, 1080], l27: [2560, 1440] };
      dock.querySelectorAll("[data-size-preset]").forEach(button => {
        const preset = button.dataset.sizePreset;
        const active = preset === "auto"
          ? device.mode === "auto"
          : device.mode === "preset" && device.layout === preset;
        button.setAttribute("aria-pressed", String(active));
        button.addEventListener("click", () => {
          const payload = preset === "auto"
            ? { mode: "auto", preset: null, layout: null, w: 0, h: 0 }
            : { mode: "preset", preset, layout: preset, w: REF[preset][0], h: REF[preset][1] };
          try { localStorage.setItem("fujiDevice", JSON.stringify(payload)); } catch (error) { console.warn(error); }
          window.location.reload();
        });
      });

      dock.querySelectorAll("[data-debug-nav]").forEach(button => {
        button.addEventListener("click", () => { window.location.href = button.dataset.debugNav; });
      });
    })();
  </script>
</body>
</html>
