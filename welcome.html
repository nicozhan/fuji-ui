<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 设备配置引导：读取 setup.html 保存的档位，决定排版标记与根字号基准 -->
  <script>
    (function () {
      var KEY = "fujiDevice";
      var root = document.documentElement;
      var device = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) device = JSON.parse(raw);
      } catch (error) {
        console.warn("设备配置读取失败。", error);
      }

      // 与 setup.html 中的推断逻辑保持一致
      function layoutForWidth(width) {
        if (width >= 2200) return "l27";
        if (width >= 1280) return "m21";
        return "s10";
      }

      var mode = device && device.mode ? device.mode : "auto";
      var layout = null;
      var base = null;

      if (mode === "preset" && device.layout) {
        layout = device.layout;
      } else if (mode === "custom" && device.w > 0 && device.h > 0) {
        layout = layoutForWidth(device.w);
        base = Math.min(device.w / 120, device.h / 67.5);
      } else {
        mode = "auto";
        layout = layoutForWidth(window.innerWidth);
      }

      root.dataset.deviceMode = mode;
      root.dataset.deviceLayout = layout;
      window.FUJI_DEVICE = { mode: mode, layout: layout };

      // 自定义分辨率：把根字号钳到该基准对应的设计字号，且不超过真实视口允许的尺寸
      if (base && base > 0) {
        var style = document.createElement("style");
        style.textContent =
          'html[data-device-mode="custom"]{font-size:max(12px,min(' +
          base.toFixed(3) + 'px,100vw / 120,100vh / 67.5));}';
        document.head.appendChild(style);
      }
    })();
  </script>
  <title>Welcome</title>
  <style>
    :root {
      --fuji-blue: #075b9e;
      --fuji-blue-soft: rgba(7, 91, 158, .88);
      --text: #17384e;
      --white: #ffffff;
    }

    /* ===== 视口等比缩放基准（与 index.html 一致）=====
       设计稿 1920×1080，1rem = 16 设计像素。 */
    html { font-size: min(100vw / 120, 100vh / 67.5); }
    html { font-size: min(100vw / 120, 100dvh / 67.5); }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限，小屏（10 吋平板）上不会缩到看不清 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 0.1875rem solid rgba(255,255,255,.9); outline-offset: 0.25rem; }

    .welcome-screen {
      position: relative;
      --welcome-left: 10.5%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #eaf1f3;
      cursor: pointer;
    }
    .welcome-carousel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #eaf1f3;
    }
    .welcome-track {
      display: flex;
      width: 100%;
      height: 100%;
      transform: translateX(0);
      transition: transform .9s cubic-bezier(.45, .05, .25, 1);
      will-change: transform;
    }
    .welcome-background {
      flex: 0 0 100%;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .start-control {
      position: absolute;
      z-index: 2;
      left: var(--welcome-left);
      bottom: 20%;
    }
    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      width: 16.75rem;
      min-height: 4.875rem;
      padding: 0 2rem;
      border: 0.0625rem solid rgba(255,255,255,.38);
      border-radius: 1rem;
      color: var(--white);
      background: var(--fuji-blue-soft);
      box-shadow: 0 0.5rem 1.5rem rgba(28,62,82,.14);
      font-size: 1.375rem;
      font-weight: 650;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .start-button:hover { background: rgba(7,91,158,.96); transform: translateY(-0.125rem); }
    .start-button:active { transform: translateY(0); }
    .start-button svg { width: 1.5rem; height: 1.5rem; }

    /* 底部工具行：语言 + 屏幕尺寸入口同排放置，测试时一眼可见 */
    .welcome-tools {
      position: absolute;
      z-index: 2;
      left: var(--welcome-left);
      bottom: 7%;
      display: flex;
      align-items: flex-end;
      gap: 1.25rem;
    }
    .language-control {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .language-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      width: 8.25rem;
      min-height: 4.875rem;
      padding: 0.625rem 0.75rem;
      border: 0.0625rem solid rgba(255,255,255,.82);
      border-radius: 0.8125rem;
      color: var(--text);
      background: rgba(255,255,255,.72);
      box-shadow: 0 0.3125rem 1rem rgba(28,62,82,.08);
      backdrop-filter: blur(0.5rem);
      -webkit-backdrop-filter: blur(0.5rem);
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .language-button:hover { border-color: rgba(7,91,158,.48); background: rgba(255,255,255,.9); }
    .language-button.active {
      border-color: var(--fuji-blue);
      color: var(--white);
      background: rgba(7,91,158,.88);
    }
    .language-flag { font-size: 1.5rem; line-height: 1; }
    .language-name { font-size: 0.875rem; font-weight: 600; line-height: 1.2; white-space: nowrap; }

    /* 屏幕尺寸入口（部署调试用，上线前与 DEMO 开关一并移除） */
    .setup-button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 4.875rem;
      padding: 0.5rem 1.0625rem 0.5rem 0.75rem;
      border: 0.0625rem solid rgba(255, 255, 255, .82);
      border-radius: 0.8125rem;
      color: var(--text);
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 0.3125rem 1rem rgba(28, 62, 82, .08);
      backdrop-filter: blur(0.5rem);
      -webkit-backdrop-filter: blur(0.5rem);
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .setup-button:hover { border-color: rgba(7, 91, 158, .48); background: rgba(255, 255, 255, .92); }
    .setup-button:active { box-shadow: 0 0.1875rem 0.625rem rgba(28, 62, 82, .12); }
    .setup-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 2.375rem;
      height: 2.375rem;
      border-radius: 0.625rem;
      color: var(--fuji-blue);
      background: rgba(7, 91, 158, .1);
    }
    .setup-icon svg { width: 1.375rem; height: 1.375rem; }
    .setup-text { display: flex; flex-direction: column; gap: 0.1875rem; }
    .setup-caption {
      color: #5b7285;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: .02em;
      line-height: 1.1;
      white-space: nowrap;
    }
    .setup-value {
      display: flex;
      align-items: baseline;
      gap: 0.375rem;
      color: var(--text);
      font-size: 1.0625rem;
      font-weight: 750;
      letter-spacing: -.01em;
      line-height: 1.1;
      white-space: nowrap;
    }
    .setup-value b { color: var(--fuji-blue); font-weight: 800; }
    .setup-value i { color: #7d8fa0; font-size: 0.6875rem; font-style: normal; font-weight: 650; }
    .setup-chevron {
      flex: 0 0 auto;
      width: 0.875rem;
      height: 0.875rem;
      margin-left: 0.125rem;
      color: #7d8fa0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="welcome-screen">
    <div class="welcome-carousel" aria-hidden="true">
      <div class="welcome-track" id="welcomeTrack">
        <img class="welcome-background" src="assets/welcome-slide-1.jpg" alt="" width="1672" height="941" fetchpriority="high">
        <img class="welcome-background" src="assets/welcome-slide-2.jpg" alt="" width="1671" height="941">
        <img class="welcome-background" src="assets/welcome-slide-3.jpg" alt="" width="1672" height="941">
        <img class="welcome-background" src="assets/welcome-slide-1.jpg" alt="" width="1672" height="941">
      </div>
    </div>

    <div class="start-control">
      <button class="start-button" id="startButton" type="button">
        <span id="startLabel">开始点餐</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
      </button>
    </div>

    <div class="welcome-tools">
      <div class="language-control" role="group" aria-label="Language">
        <button class="language-button" type="button" data-language="ja" aria-pressed="false">
          <span class="language-flag" aria-hidden="true">🇯🇵</span>
          <span class="language-name">日本語</span>
        </button>
        <button class="language-button active" type="button" data-language="zh" aria-pressed="true">
          <span class="language-flag" aria-hidden="true">🇨🇳</span>
          <span class="language-name">简体中文</span>
        </button>
        <button class="language-button" type="button" data-language="en" aria-pressed="false">
          <span class="language-flag" aria-hidden="true">🇺🇸</span>
          <span class="language-name">English</span>
        </button>
        <button class="language-button" type="button" data-language="ko" aria-pressed="false">
          <span class="language-flag" aria-hidden="true">🇰🇷</span>
          <span class="language-name">한국어</span>
        </button>
      </div>

      <button class="setup-button" id="setupButton" type="button" title="屏幕尺寸设置：重新选择 10″ / 21″ / 27″ 或自定义分辨率（Demo）">
        <span class="setup-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="4.2" width="18.4" height="12.4" rx="1.8"/><path d="M9.2 20.2h5.6M12 16.6v3.6"/></svg>
        </span>
        <span class="setup-text">
          <span class="setup-caption">屏幕尺寸</span>
          <span class="setup-value"><b id="deviceBadge">—</b><i>切换</i></span>
        </span>
        <svg class="setup-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </main>

  <script>
    (function initWelcomeCarousel() {
      const track = document.getElementById("welcomeTrack");
      if (!track) return;
      const slideCount = 3;
      const interval = 5000;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let index = 0;
      let timer = null;

      function render(nextIndex) {
        index = nextIndex;
        track.style.transform = `translateX(-${index * 100}%)`;
      }

      function advance() {
        if (reduceMotion) {
          render((index + 1) % slideCount);
          return;
        }
        render(index + 1);
      }

      track.addEventListener("transitionend", event => {
        if (event.target !== track || event.propertyName !== "transform") return;
        if (index < slideCount) return;
        track.style.transition = "none";
        render(0);
        void track.offsetWidth;
        track.style.transition = "";
      });

      function start() {
        stop();
        timer = window.setInterval(advance, interval);
      }

      function stop() {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
      }

      start();
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
    })();
  </script>

  <script>
    const languageConfig = {
      ja: { htmlLang: "ja", startLabel: "注文を始める" },
      zh: { htmlLang: "zh-CN", startLabel: "开始点餐" },
      en: { htmlLang: "en", startLabel: "Start Order" },
      ko: { htmlLang: "ko", startLabel: "주문 시작" }
    };

    const languageButtons = document.querySelectorAll("[data-language]");
    const startLabel = document.getElementById("startLabel");
    let currentLanguage = "zh";

    function selectLanguage(language) {
      const config = languageConfig[language] || languageConfig.zh;
      currentLanguage = languageConfig[language] ? language : "zh";
      document.documentElement.lang = config.htmlLang;
      startLabel.textContent = config.startLabel;
      languageButtons.forEach(button => {
        const active = button.dataset.language === currentLanguage;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      try {
        localStorage.setItem("fujiLanguage", currentLanguage);
      } catch (error) {
        console.warn("语言偏好无法保存。", error);
      }
    }

    function goToProducts() {
      window.location.href = `index.html?lang=${encodeURIComponent(currentLanguage)}`;
    }

    languageButtons.forEach(button => {
      button.addEventListener("click", event => {
        event.stopPropagation();
        selectLanguage(button.dataset.language);
        goToProducts();
      });
    });

    document.querySelector(".welcome-screen").addEventListener("click", () => goToProducts());

    let initialLanguage = "zh";
    try {
      const savedLanguage = localStorage.getItem("fujiLanguage");
      if (languageConfig[savedLanguage]) initialLanguage = savedLanguage;
    } catch (error) {
      console.warn("使用默认语言。", error);
    }
    selectLanguage(initialLanguage);
  </script>

  <script>
    // 设备设置入口：显示当前生效的档位，点击回到设置页重新选择
    (function initDeviceEntry() {
      const button = document.getElementById("setupButton");
      const badge = document.getElementById("deviceBadge");
      const device = window.FUJI_DEVICE || { mode: "auto", layout: "s10" };
      const labels = { s10: "10″", m21: "21″", l27: "27″" };

      if (badge) {
        const prefix = device.mode === "auto" ? "自动 " : device.mode === "custom" ? "自定 " : "";
        badge.textContent = prefix + (labels[device.layout] || "10″");
      }

      if (button) {
        button.addEventListener("click", event => {
          // 欢迎页整屏点击会进入商品页，这里必须阻断冒泡
          event.stopPropagation();
          window.location.href = "setup.html?return=welcome.html";
        });
      }
    })();
  </script>
</body>
</html>
