<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 首帧语言：样式生效前把 <html lang> 定到实际语言，避免中文界面先按日文字形渲染一帧 -->
  <script>
    (function () {
      var map = { ja: "ja", zh: "zh-CN", en: "en", ko: "ko" };
      var lang = null;
      try {
        var requested = new URLSearchParams(window.location.search).get("lang");
        lang = map[requested] || map[localStorage.getItem("fujiLanguage")] || null;
      } catch (error) {
        console.warn("首帧语言读取失败。", error);
      }
      if (lang) document.documentElement.lang = lang;
    })();
  </script>

  <!-- 设备配置引导：读取 setup.html 保存的档位，决定排版标记与根字号基准 -->
  <script>
    (function () {
      var KEY = "fujiDevice";
      var root = document.documentElement;
      var device = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) device = JSON.parse(raw);
      } catch (error) {
        console.warn("设备配置读取失败。", error);
      }

      // 与 setup.html 中的推断逻辑保持一致
      function layoutForWidth(width) {
        if (width >= 2200) return "l27";
        if (width >= 1280) return "m21";
        return "s10";
      }

      var mode = device && device.mode ? device.mode : "auto";
      var layout = null;
      var base = null;

      if (mode === "preset" && device.layout) {
        layout = device.layout;
      } else if (mode === "custom" && device.w > 0 && device.h > 0) {
        layout = layoutForWidth(device.w);
        base = Math.min(device.w / 120, device.h / 67.5);
      } else {
        mode = "auto";
        layout = layoutForWidth(window.innerWidth);
      }

      root.dataset.deviceMode = mode;
      root.dataset.deviceLayout = layout;
      window.FUJI_DEVICE = { mode: mode, layout: layout };

      // 自定义分辨率：把根字号钳到该基准对应的设计字号，且不超过真实视口允许的尺寸
      if (base && base > 0) {
        var style = document.createElement("style");
        style.textContent =
          'html[data-device-mode="custom"]{font-size:max(12px,min(' +
          base.toFixed(3) + 'px,100vw / 120,100vh / 67.5));}';
        document.head.appendChild(style);
      }
    })();
  </script>
  <title>Fuji Packaged Goods Vending UI</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      /* 商品卡单层背景：上浅下白，无分界线，透明底饮品直接落在上面 */
      --card-surface: #ffffff;
      --surface-2: #eef5fa;
      --border: #e4ebf0;
      --text: #102d43;
      --text-2: #6c7e8c;
      --accent: #0877c9;
      --accent-dark: #075b9e;
      --accent-deep: #064b83;
      --accent-weak: #e8f4fd;
      --danger: #8a9aa6;
      --radius: 0.9375rem;
      --radius-sm: 0.5rem;
      --status-h: 3.5rem;
      --header-h: 6.5rem;
      --pager-h: 4rem;
      --grid-gap: 0.75rem;
      /* 广告海报原始比例 848×1855（assets/ad-poster-*.jpg）；广告栏按此比例贴合，不再留左右底衬 */
      --ad-poster-w: 848;
      --ad-poster-h: 1855;
      --ad-max-w: 62.5rem; /* 1000 设计像素，超大屏封顶 */
      /* 分类标签栏：一屏固定露出 4 个标签位，第 5 个起横向滑动 */
      --tab-w: 11.5rem;
      --tab-gap: 0.75rem;
      --tab-window: calc(var(--tab-w) * 4 + var(--tab-gap) * 3);
    }

    /* ===== 视口等比缩放基准 =====
       设计稿 1920×1080，1rem = 16 设计像素。
       根字号随视口按 min(宽比, 高比) 缩放，所有尺寸（rem）随之等比变化，
       因此在 10 吋平板、27 吋大屏上看起来完全一致，只是整体放大/缩小。 */
    html {
      font-size: min(100vw / 120, 100vh / 67.5);
      font-size: min(100vw / 120, 100dvh / 67.5);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    @media (orientation: landscape) {
      /* 横屏时给字号一个下限：小屏（10 吋平板）上文字不会等比缩到看不清，改为版面更紧凑 */
      html { font-size: max(12px, min(100vw / 120, 100vh / 67.5)); }
      html { font-size: max(12px, min(100vw / 120, 100dvh / 67.5)); }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 47.5rem; }

    body {
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, var(--font-cjk), sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 统一字体：拉丁固定 SF Pro / Segoe UI；CJK 随文档语言切换，避免同一流程内跳字 */
    :root { --font-cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC"; }
    html[lang="ja"] { --font-cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", "PingFang SC"; }
    html[lang="ko"] { --font-cjk: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", "PingFang SC"; }


    button { font: inherit; }
    button, [role="switch"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 0.1875rem solid rgba(8, 119, 201, .28); outline-offset: 0.1875rem; }
    .hidden { display: none !important; }

    .vending-app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 40rem;
      overflow: hidden;
    }

    .status-bar {
      z-index: 30;
      display: flex;
      flex: 0 0 var(--status-h);
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0 1.75rem;
      border-bottom: 0.0625rem solid #dae5ee;
      color: #4a6478;
      background: #e9eff5;
      font-size: 0.8125rem;
      letter-spacing: .01em;
    }

    .status-left, .status-right, .status-item, .demo-control {
      display: flex;
      align-items: center;
    }

    .status-left, .status-right { gap: 1.75rem; }
    .status-item { gap: 0.5rem; white-space: nowrap; }
    .status-item svg { width: 1rem; height: 1rem; }
    .status-right svg { color: #8ea6b6; }
    .machine-id { color: #6d8598; }
    .machine-id strong { color: #35566e; font-weight: 500; }

    .demo-control {
      gap: 0.5625rem;
      padding: 0.25rem 0.5rem 0.25rem 0.3125rem;
      border: 0.0625rem solid rgba(255,255,255,.28);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(0,0,0,.12);
      cursor: pointer;
    }

    .demo-badge {
      padding: 0.1875rem 0.4375rem;
      border-radius: 62.4375rem;
      color: var(--accent-deep);
      background: #fff;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .demo-label { font-size: 0.75rem; }
    .switch-track {
      position: relative;
      width: 2.125rem;
      height: 1.1875rem;
      border-radius: 62.4375rem;
      background: rgba(255,255,255,.32);
      transition: background .2s ease;
    }
    .switch-thumb {
      position: absolute;
      top: 0.1875rem;
      left: 0.1875rem;
      width: 0.8125rem;
      height: 0.8125rem;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s ease;
    }
    .demo-control[aria-checked="true"] .switch-track { background: #64d7ff; }
    .demo-control[aria-checked="true"] .switch-thumb { transform: translateX(0.9375rem); }

    /* 临时 Demo：预包装页排版档位（10 / 21 / 27 吋屏对应的网格），三段式直选 */
    .layout-switch { gap: 0.5rem; padding: 0.25rem 0.375rem 0.25rem 0.3125rem; cursor: default; }
    .layout-options {
      display: flex;
      align-items: center;
      gap: 0.125rem;
      padding: 0.125rem;
      border-radius: 62.4375rem;
      background: rgba(0,0,0,.18);
    }
    .layout-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.0625rem;
      min-width: 2.5rem;
      padding: 0.1875rem 0.3125rem;
      border: 0;
      border-radius: 62.4375rem;
      color: rgba(255,255,255,.76);
      background: transparent;
      line-height: 1.05;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .layout-option b { font-size: 0.6875rem; font-weight: 750; letter-spacing: .01em; }
    .layout-option i { font-size: 0.5625rem; font-style: normal; font-weight: 650; opacity: .72; }
    .layout-option:hover { color: #fff; background: rgba(255,255,255,.16); }
    .layout-option[aria-pressed="true"] {
      color: var(--accent-deep);
      background: #fff;
      box-shadow: 0 0.125rem 0.375rem rgba(0,0,0,.18);
    }
    .layout-option[aria-pressed="true"] i { opacity: .78; }
    .layout-option:focus-visible { outline: 0.125rem solid #fff; outline-offset: 0.0625rem; }

    /* 状态栏宽度收紧：先舍「排版」文字，再舍两个 DEMO 徽标，最后舍联系电话与时钟 */
    @media (max-width: 1500px) {
      .status-bar .layout-switch .demo-label { display: none; }
      .status-right { gap: 1.375rem; }
    }
    @media (max-width: 1240px) {
      .status-bar .contact-item { display: none; }
      .status-bar .layout-switch .demo-badge { display: none; }
      .status-right { gap: 1rem; }
    }
    @media (max-width: 1120px) {
      .status-right time { display: none; }
      .status-bar { font-size: 0.75rem; }
      .layout-option { min-width: 2.25rem; padding: 0.1875rem 0.25rem; }
    }

    .home-button, .fault-button, .mode-button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3125rem 0.875rem 0.3125rem 0.6875rem;
      border: 0.0625rem solid rgba(255,255,255,.34);
      border-radius: 62.4375rem;
      color: #fff;
      background: rgba(255,255,255,.1);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .home-button svg, .fault-button svg, .mode-button svg { width: 0.9375rem; height: 0.9375rem; }
    .home-button:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.62); }
    .home-button:active { background: rgba(255,255,255,.3); }
    .mode-button:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.62); }
    .mode-button:active { background: rgba(255,255,255,.3); }
    .mode-button.is-active, .mode-button.is-active:hover {
      border-color: rgba(255,255,255,.7);
      color: var(--accent-deep);
      background: #fff;
    }
    /* 临时 Demo：进入「暂停服务」画面 */
    .fault-button {
      border-color: rgba(255,196,120,.46);
      color: #ffdda8;
      background: rgba(224,145,47,.16);
    }
    .fault-button:hover { background: rgba(224,145,47,.3); border-color: rgba(255,196,120,.78); }
    .fault-button:active { background: rgba(224,145,47,.4); }


    .main-header {
      z-index: 25;
      display: flex;
      flex: 0 0 var(--header-h);
      align-items: center;
      gap: 1.5rem;
      padding: 0 2.125rem;
      border-bottom: 0.0625rem solid var(--border);
      background: var(--surface);
    }

    .brand {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.625rem;
      color: #101c26;
      font-size: 1.25rem;
      font-weight: 750;
      white-space: nowrap;
    }
    .brand-mark {
      color: var(--accent);
      font-size: 1.9375rem;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -.12em;
      transform: skew(-8deg);
    }

    .pill-button, .category-button, .language-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5625rem;
      min-height: 3.25rem;
      border: 0.0625rem solid var(--border);
      border-radius: 62.4375rem;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .pill-button { padding: 0 1.4375rem; }
    .pill-button svg, .language-button svg { width: 1.25rem; height: 1.25rem; }
    .pill-button:hover { border-color: #b9d9ed; background: var(--accent-weak); }

    /* 分类标签栏：固定 4 个标签位宽，超出部分横向滑动（触摸拖拽 / 滚轮 / 边缘渐隐提示） */
    .category-nav-wrap {
      position: relative;
      flex: 0 1 auto;
      width: var(--tab-window);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
    }
    .category-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--tab-gap);
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x;
      cursor: grab;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-nav.is-dragging { cursor: grabbing; scroll-behavior: auto; scroll-snap-type: none; }
    .category-fade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.375rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .category-fade.left { left: 0; background: linear-gradient(90deg, var(--surface) 55%, rgba(255,255,255,0)); }
    .category-fade.right { right: 0; background: linear-gradient(270deg, var(--surface) 55%, rgba(255,255,255,0)); }
    .category-nav-wrap.can-left .category-fade.left { opacity: 1; }
    .category-nav-wrap.can-right .category-fade.right { opacity: 1; }

    /* 大屏（≥1440）横向空间充裕：标签全部展开，不必滑动；小屏仍是 4 个位置 + 滑动 */
    @media (min-width: 1440px) {
      .category-nav-wrap { width: auto; }
      .category-nav { overflow: visible; }
      .category-fade { display: none; }
    }
    .category-button {
      flex: 0 0 var(--tab-w);
      min-width: 0;
      padding: 0 1rem;
      /* 触摸屏无悬浮态：默认就带浅蓝底与描边，让用户一眼看出这是可点的按钮 */
      border-color: #b9d9ed;
      background: var(--accent-weak);
      font-size: 0.9375rem;
      font-weight: 650;
      scroll-snap-align: start;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .14s ease;
    }
    .category-button > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-button:focus-visible { outline-offset: -0.125rem; }
    .category-button svg { flex: 0 0 auto; width: 1.125rem; height: 1.125rem; }
    .category-button:hover { border-color: #9ecbe8; background: #ddedfa; }
    .category-button:active { transform: translateY(0.0625rem); border-color: #8dc3e5; background: #d2e8f8; }
    .category-button.active,
    .category-button.active:hover { color: #fff; border-color: var(--accent); background: var(--accent); }
    .category-button.active:active { transform: translateY(0.0625rem); background: var(--accent-dark); }
    .category-button .chevron { width: 0.875rem; height: 0.875rem; margin-left: 0.3125rem; }
    .language-button { flex: 0 0 auto; padding: 0 1.3125rem; }
    .language-picker { position: relative; display: flex; flex: 0 0 auto; margin-left: auto; }
    .language-picker .caret { transition: transform .18s ease; }
    .language-picker.open .caret { transform: rotate(180deg); }
    .language-menu {
      position: absolute;
      z-index: 70;
      top: calc(100% + 0.75rem);
      right: 0;
      display: none;
      min-width: 14.125rem;
      padding: 0.625rem;
      border: 0.0625rem solid var(--border);
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.125rem 2.5rem rgba(16,45,67,.16);
    }
    .language-picker.open .language-menu { display: block; }
    .language-option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 3.5rem;
      padding: 0 1rem;
      border: 0;
      border-radius: 0.8125rem;
      color: var(--text);
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .language-option:hover { background: var(--accent-weak); }
    .language-option.active { color: #fff; background: var(--accent); }
    .language-option .lang-flag { font-size: 1.3125rem; line-height: 1; }

    .workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .ad-sidebar {
      position: relative;
      /* 宽度 = 可用高度 × 海报比例：海报 contain 后正好铺满，左右不再留底衬；超出 1000 设计像素则封顶 */
      flex: 0 0 auto;
      aspect-ratio: var(--ad-poster-w) / var(--ad-poster-h);
      max-width: var(--ad-max-w);
      min-width: 0;
      overflow: hidden;
      /* 图片按 contain 显示后会留出左右（或上下）留白，用中性底衬住海报 */
      background: linear-gradient(180deg, #f1f4f7 0%, #e7edf2 55%, #dfe6ec 100%);
    }
    .ad-slides {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ad-slide {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      /* 只做等比缩放：不拉伸、不裁切，整张海报始终完整可见 */
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transition: opacity .7s ease;
      user-select: none;
      -webkit-user-drag: none;
    }
    .ad-slide.active { opacity: 1; }
    .ad-dots {
      position: absolute;
      right: 0;
      bottom: 1.125rem;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      pointer-events: none;
    }
    .ad-dots span {
      width: 0.4375rem;
      height: 0.4375rem;
      border-radius: 62.4375rem;
      background: rgba(255,255,255,.58);
      box-shadow: 0 0.0625rem 0.3125rem rgba(12,45,70,.35);
      transition: width .3s ease, background .3s ease;
    }
    .ad-dots span.active { width: 1.375rem; background: #fff; }

    .product-stage {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 1.75rem 2rem 0;
      overflow: hidden;
    }

    .product-viewport {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .product-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .42s cubic-bezier(.22,.8,.28,1);
      will-change: transform;
    }

    .product-page {
      --cols: 4;
      --rows: 2;
      display: grid;
      flex: 0 0 100%;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      align-content: stretch;
      justify-content: stretch;
      justify-items: stretch;
      gap: var(--grid-gap);
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    .workspace.ad-off .ad-sidebar { display: none; }
    .workspace.ad-off .product-stage { padding: 1.25rem 1.625rem 0; }
    /* 排版档位：27 吋 6 列时收紧横向间距，给卡片留出更多宽度 */
    .workspace[data-layout="l27"] .product-page { gap: clamp(0.5rem, .72vw, 0.75rem); }
    /* 6 列但卡片够宽时（大屏），名称整体降一档，长英文名也能压在两行内 */
    @container card (min-width: 340px) {
      .workspace[data-layout="l27"] .product-name { font-size: clamp(0.8125rem, .88vw, 1.0625rem); }
    }
    /* 多页时左右留出箭头通道，避免箭头压住最后一列商品的「＋」 */
    .product-stage.has-pages { padding-right: 4.625rem; padding-left: 4.625rem; }
    .workspace.ad-off .product-stage.has-pages { padding: 1.25rem 4.625rem 0; }

    .slide-arrow {
      position: absolute;
      z-index: 6;
      top: calc((100% - var(--pager-h)) / 2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(2.75rem, 3vw, 3.5rem);
      aspect-ratio: 1;
      padding: 0;
      border: 0.0625rem solid rgba(255,255,255,.72);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, #2b8fd6, #0f6cb0);
      box-shadow: 0 0.625rem 1.625rem rgba(11,84,140,.3);
      cursor: pointer;
      transform: translateY(-50%);
      transition: opacity .22s ease, transform .22s ease, box-shadow .22s ease;
    }
    .slide-arrow.next { right: 0.625rem; }
    .slide-arrow.prev { left: 0.625rem; }
    .slide-arrow svg { width: 46%; height: 46%; }
    .slide-arrow:hover { transform: translateY(-50%) scale(1.07); box-shadow: 0 0.875rem 2rem rgba(11,84,140,.38); }
    .slide-arrow:disabled { opacity: 0; pointer-events: none; }
    .product-stage.single-page .slide-arrow { display: none; }

    /* 商品卡：单层背景。饮品是透明底素材，直接呈现在卡片底色上，
       不再有「图片自带背景 + 卡片背景」双层的方形底板。 */
    .product-card {
      position: relative;
      display: grid;
      /* 信息区按内容取高（名称固定预留两行 + 价格），图片区吃掉剩余高度：
         这样 2 行 / 3 行排版切换时卡片内比例自动平衡，不会把文字挤扁 */
      grid-template-rows: minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 0.0625rem solid #e6edf2;
      border-radius: var(--radius);
      background: var(--card-surface);
      box-shadow: 0 0.1875rem 0.75rem rgba(33,73,101,.07);
      animation: card-in .24s ease both;
      /* 密度自适应：卡片宽度/高度决定名称、价格、按钮的尺寸 */
      container-type: size;
      container-name: card;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(0.375rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 商品图区：透明，只负责给主体留出呼吸空间（无独立底色、无圆角、无投影框） */
    .product-media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .product-media img {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      height: 100%;
      padding: 5% 6% 2%;
      object-fit: contain;
      object-position: center center;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      filter: drop-shadow(0 0.75rem 1.125rem rgba(24,58,84,.13));
      transition: transform .25s ease;
    }
    .product-card:hover .product-media img { transform: translateY(-2%) scale(1.02); }
    /* 不同包装形态给出不同的留白：罐/瓶更窄高，袋/盒更饱满 */
    .product-media img.pack-can, .product-media img.pack-bottle { padding: 2% 12% 2%; }
    .product-media img.pack-bag { padding: 4% 5% 2%; }
    .product-media img.pack-box { padding: 5% 4% 2%; }
    /* 业务标签：左上角固定位置、统一高度，颜色 + 图标双通道辨识 */
    .product-tag {
      position: absolute;
      z-index: 2;
      top: 0.75rem;
      left: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3125rem;
      box-sizing: border-box;
      min-width: 0;
      height: 1.625rem;
      padding: 0 0.625rem;
      border-radius: 62.4375rem;
      color: #fff;
      font-size: clamp(0.625rem, .62vw, 0.8125rem);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 0.25rem 0.625rem rgba(0,0,0,.14), inset 0 0.0625rem 0 rgba(255,255,255,.28);
    }
    .product-tag svg { width: 0.875rem; height: 0.875rem; flex: 0 0 0.875rem; }
    .product-tag.is-best { background: linear-gradient(135deg, #e2761f, #b9480a); }
    .product-tag.is-bogo { background: linear-gradient(135deg, #dd3f46, #a81a22); }
    .product-tag.is-limited { background: linear-gradient(135deg, #b98a2e, #8a5c06); }
    .product-tag.is-new { background: linear-gradient(135deg, #2f9e64, #0f6f40); }
    .product-tag.is-top { background: linear-gradient(135deg, #8a71d8, #5730b0); }

    /* 信息区：左「名称 / 价格」两行，右圆形加购按钮 */
    .product-info {
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.5rem, .8vw, 1rem);
      min-height: 0;
      padding: clamp(0.5rem, .78vw, 0.9375rem) clamp(0.6875rem, 1vw, 1.1875rem);
      background: transparent;
    }
    .product-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.3125rem;
      min-width: 0;
    }
    /* 阅读层级：名称（加粗加大） > 价格（品牌蓝独立一行） > 加购按钮 */
    .product-name {
      overflow: hidden;
      margin: 0;
      color: #102d43;
      display: -webkit-box;
      /* 长品牌名（如 Gatorade Thirst Quencher Fruit Punch）按两行预留高度，
         名称只有一行时价格基线也不会跳动 */
      min-height: 2.5em;
      font-size: clamp(0.8125rem, 0.94vw, 1.125rem);
      font-weight: 750;
      letter-spacing: -.008em;
      line-height: 1.25;
      overflow-wrap: break-word;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
    }
    .product-price {
      display: flex;
      align-items: baseline;
      gap: 0.125rem;
      margin: 0;
      color: var(--accent);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }
    .product-price .price-currency {
      font-size: clamp(0.6875rem, .8vw, 0.9375rem);
      font-weight: 750;
      opacity: .92;
    }
    .product-price .price-amount {
      font-size: clamp(1rem, 1.14vw, 1.3125rem);
      letter-spacing: .004em;
    }
    /* 划线原价：挂在现价右侧，比现价小一号、灰色、加删除线，不抢主价 */
    .product-price .price-was {
      margin-left: 0.4375rem;
      color: #7c8f9f;
      font-size: clamp(0.75rem, .88vw, 1.0625rem);
      font-weight: 650;
      letter-spacing: 0;
      text-decoration: line-through;
      text-decoration-thickness: 0.1em;
    }
    /* 加购按钮：统一圆形 + 品牌蓝描边，视觉更突出 */
    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(2.125rem, 2.5vw, 2.875rem);
      aspect-ratio: 1;
      padding: 0;
      border: 0.125rem solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      background: #fff;
      box-shadow: 0 0.25rem 0.75rem rgba(8,119,201,.16);
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .14s ease;
    }
    .add-button:hover {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0.5rem 1.125rem rgba(8,119,201,.32);
      transform: translateY(-0.0625rem);
    }
    .add-button:active { transform: scale(.94); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.24); }
    .add-button svg { width: 50%; height: 50%; stroke-width: 2.4; }

    /* ===== 高密度排版（6 列、3 行）的卡片微调 =====
       用容器查询而不是视口媒体查询：同一块屏上广告开/关、列数不同，
       卡片实际宽度会从 344px 变到 215px，各自都要匹配自己的字号。 */
    @container card (max-width: 310px) {
      .product-name { font-size: clamp(0.75rem, 1.02vw, 0.9375rem); }
      .product-price .price-currency { font-size: clamp(0.625rem, .72vw, 0.8125rem); }
      .product-price .price-amount { font-size: clamp(0.875rem, 1vw, 1.0625rem); }
      .product-price .price-was { margin-left: 0.3125rem; font-size: clamp(0.6875rem, .78vw, 0.875rem); }
      .product-info { gap: 0.375rem; padding: 0.4375rem 0.5625rem; }
      .add-button { width: clamp(1.75rem, 2.1vw, 2.25rem); }
      .product-tag { top: 0.5rem; left: 0.5rem; height: 1.375rem; padding: 0 0.4375rem; }
      .product-tag svg { width: 0.75rem; height: 0.75rem; flex-basis: 0.75rem; }
    }
    @container card (max-width: 250px) {
      .product-name { font-size: clamp(0.6875rem, .95vw, 0.875rem); }
      .product-price .price-was { margin-left: 0.25rem; }
      .product-info { padding: 0.375rem 0.4375rem; }
      .add-button { width: 1.75rem; }
    }
    /* 极窄卡片（10 吋屏同时开广告、或大屏强行开 6 列）：名称放宽到 3 行，避免长英文名被拦腰截断 */
    @container card (max-width: 170px) {
      .product-name { -webkit-line-clamp: 3; min-height: 3.75em; }
    }

    .pagination {
      display: flex;
      flex: 0 0 var(--pager-h);
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      color: var(--text-2);
      font-size: 0.8125rem;
    }
    .page-numbers { display: inline-flex; align-items: center; gap: 0.625rem; }
    .page-nav,
    .page-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.75rem;
      height: 2.625rem;
      padding: 0 0.875rem;
      border: 0.0625rem solid #c6dbe8;
      border-radius: 0.75rem;
      color: var(--accent-dark);
      background: linear-gradient(180deg, #ffffff, #f2f8fc);
      box-shadow: 0 0.1875rem 0.5rem rgba(24,66,96,.09), inset 0 0.0625rem 0 #fff;
      font-size: 0.9375rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .page-nav:hover:not(:disabled),
    .page-number:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-0.125rem);
      box-shadow: 0 0.5625rem 1.125rem rgba(8,119,201,.2);
    }
    .page-nav:active:not(:disabled),
    .page-number:active:not(.active) { transform: translateY(0); box-shadow: 0 0.125rem 0.375rem rgba(8,119,201,.14); }
    .page-number.active {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, #2f95da, #0e6bad);
      box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.32), inset 0 0.0625rem 0 rgba(255,255,255,.28);
    }
    .page-nav:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; background: #f5f9fc; }
    .page-nav svg { width: 1.125rem; height: 1.125rem; }
    .page-summary { margin-left: 0.875rem; color: var(--text-2); font-size: 0.875rem; white-space: nowrap; }
    /* 小屏（10 吋平板）上翻页行右侧会让出悬浮购物车按钮的位置，避免摘要被按钮压住 */
    @media (max-width: 1100px) {
      .pagination { padding-right: 4rem; }
    }

    .cart-panel {
      position: absolute;
      z-index: 20;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      /* 小屏放宽侧栏，给放大后的图片和「价格 + 删除」一行留出余量；大屏维持原宽 */
      width: clamp(24.375rem, 40vw, 41.75rem);
      /* 条目缩略图：随视口高度放大，同时受侧栏宽度约束，保证 3 件商品不用滚动 */
      --cart-thumb: max(4.5rem, min(15.5vh, 7.8vw));
      overflow: hidden;
      border-left: 0.0625rem solid rgba(7,91,158,.1);
      border-radius: 1.375rem 0 0 1.375rem;
      background: var(--surface);
      box-shadow: -0.875rem 0 2.375rem rgba(21,54,77,.15);
      transform: translateX(0);
      transition: transform .28s ease;
    }
    .cart-panel.closed { pointer-events: none; transform: translateX(calc(100% + 1.875rem)); }
    /* 10 吋屏：侧栏再放宽一档，给放大后的字号与「价格 + 删除」一行留余量 */
    @media (max-width: 1100px) {
      .cart-panel { width: 42vw; }
    }
    .cart-header {
      display: flex;
      flex: 0 0 6.25rem;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.375rem;
      color: #fff;
      background: var(--accent-dark);
    }
    .cart-title { display: flex; align-items: center; gap: 0.8125rem; margin: 0; font-size: 1.625rem; font-weight: 720; }
    .cart-title > svg { width: 1.6875rem; height: 1.6875rem; }
    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.8125rem;
      height: 1.8125rem;
      padding: 0 0.5rem;
      border-radius: 62.4375rem;
      color: var(--accent-dark);
      background: #fff;
      font-size: 0.9375rem;
      font-weight: 800;
    }
    /* 加购反馈：数字脉冲闪烁 + 按钮光环扩散，把注意力引向购物车 */
    @keyframes cart-badge-blink {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,255,255,.85); }
      16%  { transform: scale(1.45); box-shadow: 0 0 0 0.4rem rgba(255,255,255,.72); }
      34%  { transform: scale(1);    box-shadow: 0 0 0 0.52rem rgba(255,255,255,0); }
      54%  { transform: scale(1.3);  box-shadow: 0 0 0 0.32rem rgba(255,255,255,.62); }
      72%  { transform: scale(1);    box-shadow: 0 0 0 0.46rem rgba(255,255,255,0); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    @keyframes cart-button-pulse {
      0%   { transform: scale(1);    box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.22), 0 0 0 0 rgba(8,119,201,.5); }
      35%  { transform: scale(1.045); box-shadow: 0 0.75rem 1.75rem rgba(8,119,201,.3), 0 0 0 0.5rem rgba(8,119,201,.26); }
      100% { transform: scale(1);    box-shadow: 0 0.5rem 1.25rem rgba(8,119,201,.22), 0 0 0 1.5rem rgba(8,119,201,0); }
    }
    .cart-count.is-bumping {
      animation: cart-badge-blink .72s cubic-bezier(.36,.07,.19,.97) 1 both;
    }
    .open-cart-button.is-bumping {
      animation: cart-button-pulse .78s ease-out 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .cart-count.is-bumping, .open-cart-button.is-bumping { animation: none; }
    }
    .close-cart, .remove-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .close-cart { width: 2.5rem; height: 2.5rem; color: #fff; }
    .close-cart svg { width: 1.625rem; height: 1.625rem; }

    .cart-items { flex: 1 1 auto; min-height: 0; overflow-y: hidden; scroll-behavior: smooth; }
    .cart-items.scrollable { overflow-y: auto; }
    @keyframes cart-item-pop {
      0% { background: #dcecf9; box-shadow: inset 0.1875rem 0 0 var(--accent); }
      70% { background: #eef6fc; box-shadow: inset 0.1875rem 0 0 var(--accent); }
      100% { background: transparent; box-shadow: inset 0.1875rem 0 0 transparent; }
    }
    .cart-item.is-new { animation: cart-item-pop 1.6s ease-out both; }
    .cart-item {
      display: grid;
      grid-template-columns: var(--cart-thumb) minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem clamp(0.75rem, 1.4vw, 1.5rem);
      padding: clamp(0.4375rem, 1.5vh, 1.375rem) clamp(0.875rem, 2.4vw, 2.375rem);
      border-bottom: 0.0625rem solid #edf1f4;
    }
    .cart-thumb {
      width: var(--cart-thumb);
      height: var(--cart-thumb);
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
      filter: drop-shadow(0 0.25rem 0.5rem rgba(24,58,84,.12));
    }
    .cart-item-main { min-width: 0; }
    .cart-item-name {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin: 0 0 0.5625rem;
      font-size: 1.375rem;
      font-weight: 750;
      line-height: 1.25;
    }
    /* 名称最多两行：放大字号后长名字折行而不是被省略号截掉 */
    .cart-item-title {
      display: -webkit-box;
      min-width: 0;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
      /* 日文禁则：避免「ー」等字符被甩到行首 */
      line-break: strict;
    }
    .cart-item-qty {
      flex: none;
      padding: 0.125rem 0.5rem;
      border-radius: 62.4375rem;
      color: var(--accent-dark);
      background: #eaf2fa;
      font-size: 0.875rem;
      font-weight: 800;
      line-height: 1.3;
      white-space: nowrap;
    }
    /* 购物车条目：名称、分类、价格、删除按钮统一放大，触摸屏上更好读也更好点 */
    .cart-item-variant {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      color: var(--text-2);
      font-size: 1.0625rem;
      line-height: 1.45;
    }
    /* 价格与删除按钮改为一行：价格在左、删除键贴最右，删除热区从 2.75rem 放大到 3.5rem */
    .cart-item-tail {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(0.5rem, 1vw, 1.125rem);
    }
    .cart-item-price { font-size: 1.625rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
    .remove-item {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 0.875rem;
      color: #4c6172;
      /* 淡底让放大后的删除热区看得出来，不再只是一个悬空的图标 */
      background: #f2f6f9;
      transition: background .16s ease, color .16s ease;
    }
    .remove-item:hover { color: var(--accent); background: #e3edf6; }
    .remove-item:active { background: #d7e5f1; }
    .remove-item svg { width: 1.75rem; height: 1.75rem; }
    .empty-cart { padding: 4.375rem 1.875rem; color: var(--text-2); text-align: center; }

    .cart-footer {
      flex: 0 0 auto;
      padding: 1.5625rem 2.375rem 2.125rem;
      border-top: 0.0625rem solid var(--border);
      background: #fff;
    }
    .cart-total-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4375rem; }
    .cart-total-label { font-size: 1.1875rem; font-weight: 650; }
    .cart-total { font-size: 2.125rem; font-weight: 800; letter-spacing: -.02em; }
    .checkout-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.125rem;
      width: 100%;
      min-height: 4rem;
      border: 0;
      border-radius: 62.4375rem;
      color: #fff;
      background: var(--accent);
      font-size: 1.0625rem;
      font-weight: 700;
      cursor: pointer;
    }
    .checkout-button:hover { background: var(--accent-dark); }
    .checkout-button svg { width: 1.3125rem; height: 1.3125rem; }

    /* 10 吋平板：视口高度吃紧时压缩面板头部/底部留白，把空间让给 3 个商品条目 */
    @media (max-height: 780px) {
      .cart-header { flex-basis: 4.5rem; padding: 0 1.5rem; }
      .cart-title { font-size: 1.375rem; gap: 0.5rem; }
      .cart-title > svg { width: 1.375rem; height: 1.375rem; }
      .cart-count { min-width: 1.5rem; height: 1.5rem; font-size: 0.8125rem; }
      .close-cart { width: 2.125rem; height: 2.125rem; }
      .close-cart svg { width: 1.375rem; height: 1.375rem; }
      .cart-item-name { margin-bottom: 0.375rem; }
      .cart-footer { padding: 0.875rem 1.375rem 1.125rem; }
      .cart-total-row { margin-bottom: 0.75rem; }
      .cart-total { font-size: 1.875rem; }
      .checkout-button { min-height: 3.25rem; }
    }
    /* 极矮视口（1024×600 一类 10 吋屏）：再收一档头部与底部，保证放大后的 3 行仍在首屏内 */
    @media (max-height: 620px) {
      /* 极矮屏收窄缩略图上限，3 行才不会顶出可视区 */
      .cart-panel { --cart-thumb: max(4rem, min(14vh, 7vw)); }
      .cart-header { flex-basis: 3.25rem; padding: 0 1.25rem; }
      .cart-title { font-size: 1.25rem; }
      .cart-title > svg { width: 1.25rem; height: 1.25rem; }
      .close-cart { width: 1.875rem; height: 1.875rem; }
      .close-cart svg { width: 1.25rem; height: 1.25rem; }
      .cart-footer { padding: 0.75rem 1.25rem 0.875rem; }

    ];

    const SUPPORTED_LANGUAGES = ["ja", "zh", "en", "ko"];

    function resolveLanguage() {
      const requested = new URLSearchParams(window.location.search).get("lang");
      if (SUPPORTED_LANGUAGES.includes(requested)) return requested;
      try {
        const saved = localStorage.getItem("fujiLanguage");
        if (SUPPORTED_LANGUAGES.includes(saved)) return saved;
      } catch (error) {
        console.warn("语言偏好读取失败。", error);
      }
      return "ja";
    }

    let currentLanguage = resolveLanguage();

    function t(key, vars) {
      const dictionary = I18N[currentLanguage] || I18N.ja;
      const value = key.split(".").reduce((node, part) => (node ? node[part] : undefined), dictionary);
      const template = typeof value === "string" ? value : key;
      return vars
        ? template.replace(/\{(\w+)\}/g, (match, name) => (vars[name] !== undefined ? vars[name] : match))
        : template;
    }

    const productName = product => t(`products.${product.id}.name`);
    const productDescription = product => t(`products.${product.id}.desc`);
    const previewParams = new URLSearchParams(window.location.search);

    // 排版档位：按目标屏幕尺寸给出「列 × 行」，每页数量 = 列 × 行
    const LAYOUTS = {
      s10: { cols: 5, rows: 2, diag: 10 },  // 10 吋横屏：5 × 2 = 10
      m21: { cols: 5, rows: 3, diag: 21 },  // 21 吋横屏：5 × 3 = 15
      l27: { cols: 6, rows: 3, diag: 27 }   // 27 吋横屏：6 × 3 = 18
    };
    const LAYOUT_ALIASES = { "10": "s10", "21": "m21", "27": "l27", s10: "s10", m21: "m21", l27: "l27" };
    const LAYOUT_REFERENCE = { s10: [1024, 768], m21: [1920, 1080], l27: [2560, 1440] };
    // 优先级：URL 参数（调试直达） > 设备设置页保存的档位 / 视口推断 > 兜底 10 吋
    const initialLayout = LAYOUT_ALIASES[previewParams.get("layout")]
      || (window.FUJI_DEVICE && window.FUJI_DEVICE.layout)
      || "s10";

    const state = {
      category: "all",
      adEnabled: previewParams.get("ad") !== "off",
      layout: initialLayout,
      cartOpen: previewParams.get("cart") === "open",
      page: 0,
      cart: new Map([[1, 1], [3, 1], [4, 1]]),
      cartVariants: new Map()
    };

    const icons = {
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>',
      flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.8 7-6.6 0-3.5-2.3-5.8-4.2-7.8-.5 2-1.7 3-3 3.9.5-3.5-1.1-6.5-3.4-9.8-.4 3.4-2 5.2-3.6 7.1C3.3 11 5 14.1 5 15.4 5 19.2 8 22 12 22z"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M3.5 7l17 10M3.5 17l17-10M9 4.5 12 7l3-2.5M9 19.5 12 17l3 2.5"/></svg>',
      percent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>',
      crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 7.2 12 12 5.5 16.8 12 21 8.5l-1.7 9.5H4.7L3 8.5Z"/></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.3 6.2 6.2 2.3-6.2 2.3L12 20l-2.3-6.2L3.5 11.5l6.2-2.3L12 3Z"/></svg>',
      trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v4.6a4 4 0 0 1-8 0V4Z"/><path d="M8 5.6H5.5v1a3 3 0 0 0 3 3M16 5.6h2.5v1a3 3 0 0 1-3 3M12 12.6V17M9 20h6"/></svg>'
    };

    const tagIcon = { best: "flame", bogo: "percent", limited: "crown", new: "star", top: "trophy" };

    const workspace = document.getElementById("workspace");
    const productStage = document.getElementById("productStage");
    const productTrack = document.getElementById("productTrack");
    const pageNumbers = document.getElementById("pageNumbers");
    const pageSummary = document.getElementById("pageSummary");
    const slidePrev = document.getElementById("slidePrev");
    const slideNext = document.getElementById("slideNext");
    const pagePrevButton = document.getElementById("pagePrevButton");
    const pageNextButton = document.getElementById("pageNextButton");
    const adToggle = document.getElementById("adToggle");
    const adState = document.getElementById("adState");
    const layoutSwitch = document.getElementById("layoutSwitch");
    const visibleCount = document.getElementById("visibleCount");
    const cartPanel = document.getElementById("cartPanel");
    const openCartButton = document.getElementById("openCart");
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const toast = document.getElementById("toast");
    let toastTimer;

    const yen = value => `¥${value.toLocaleString("ja-JP")}`;
    // 划线原价 = 现价 + STRIKE_DELTA，仅用于展示，不参与购物车结算
    const STRIKE_DELTA = 20;
    // 价格拆成「货币符号 + 数字」，符号小一号，数字更突出；右侧挂一个小一号的划线原价
    const priceMarkup = value =>
      `<span class="price-currency">¥</span><span class="price-amount">${value.toLocaleString("ja-JP")}</span>` +
      `<s class="price-was">${yen(value + STRIKE_DELTA)}</s>`;
    const getProduct = id => products.find(product => product.id === Number(id));

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // 预包装：每页数量完全由排版档位决定（10 / 15 / 18），广告开关只管左侧广告栏的显隐
    function pageSize() {
      const layout = LAYOUTS[state.layout];
      return layout.cols * layout.rows;
    }

    function visibleProducts() {
      return state.category === "all" ? products : products.filter(p => p.category === state.category);
    }

    function pageCount() {
      return Math.max(1, Math.ceil(visibleProducts().length / pageSize()));
    }

    function productCardMarkup(product, index) {
      const name = productName(product);
      return `
        <article class="product-card" data-product-id="${product.id}" style="animation-delay:${index * 25}ms">
          <button class="product-media" type="button" data-add="${product.id}" aria-label="${t("addAria", { name })}">
            <img class="pack-${product.pack}" src="${product.image}" alt="${name}" width="640" height="640">
            ${product.tag ? `<span class="product-tag is-${product.tag}">${icons[tagIcon[product.tag]]}${t(`tags.${product.tag}`)}</span>` : ""}
          </button>
          <div class="product-info">
            <div class="product-copy">
              <h2 class="product-name" title="${name}">${name}</h2>
              <p class="product-price">${priceMarkup(product.price)}</p>
            </div>
            <button class="add-button" type="button" data-add="${product.id}" aria-label="${t("addAria", { name })}">${icons.plus}</button>
          </div>
        </article>
      `;
    }

    function updatePager() {
      const pages = pageCount();
      const current = Math.min(state.page, pages - 1);
      const list = visibleProducts();
      const perPage = pageSize();
      const start = current * perPage;
      const shown = list.slice(start, start + perPage).length;

      productTrack.style.transform = `translateX(-${current * 100}%)`;
      productStage.classList.toggle("single-page", pages <= 1);
      productStage.classList.toggle("has-pages", pages > 1);
      slidePrev.disabled = current <= 0;
      slideNext.disabled = current >= pages - 1;
      pagePrevButton.disabled = current <= 0;
      pageNextButton.disabled = current >= pages - 1;
      pageSummary.textContent = t("pageOf", { current: current + 1, total: pages });
      visibleCount.textContent = t("items", { n: shown });

      pageNumbers.querySelectorAll("[data-page]").forEach(button => {
        const active = Number(button.dataset.page) === current;
        button.classList.toggle("active", active);
        if (active) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function goToPage(next) {
      const target = Math.max(0, Math.min(pageCount() - 1, next));
      if (target === state.page) return;
      state.page = target;
      updatePager();
    }

    function renderProducts() {
      workspace.classList.toggle("ad-off", !state.adEnabled);
      const layout = LAYOUTS[state.layout];
      const perPage = pageSize();
      const pages = pageCount();
      state.page = Math.max(0, Math.min(state.page, pages - 1));

      workspace.dataset.layout = state.layout;
      adToggle.setAttribute("aria-checked", String(state.adEnabled));
      adState.textContent = state.adEnabled ? "ON" : "OFF";
      layoutSwitch.querySelectorAll("[data-layout]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.layout === state.layout));
      });

      const list = visibleProducts();
      productTrack.innerHTML = Array.from({ length: pages }, (_, pageIndex) => {
        const slice = list.slice(pageIndex * perPage, pageIndex * perPage + perPage);
        // 列数/行数取自当前档位（而非本页实际件数），保证末页卡片与前面页同尺寸
        const { cols, rows } = layout;
        return `
        <div class="product-page" style="--cols:${cols};--rows:${rows}">
          ${slice.map((product, index) => productCardMarkup(product, index)).join("")}
        </div>`;
      }).join("");

      pageNumbers.innerHTML = Array.from({ length: pages }, (_, index) => `
        <button class="page-number${index === state.page ? " active" : ""}" type="button" data-page="${index}" aria-label="${t("pageNumber", { n: index + 1 })}">${index + 1}</button>
      `).join("");

      updatePager();
    }

    // 加购反馈：购物车按钮与数字脉冲闪烁，让用户注意到购物车
    let cartBumpTimer;
    function bumpCartBadge() {
      const badges = document.querySelectorAll(".cart-count[data-cart-count]");
      const button = document.getElementById("openCart");
      badges.forEach(badge => badge.classList.remove("is-bumping"));
      if (button) button.classList.remove("is-bumping");
      // 强制回流，连续快速加购时动画也能从头重播
      void document.body.offsetWidth;
      badges.forEach(badge => badge.classList.add("is-bumping"));
      if (button) button.classList.add("is-bumping");
      window.clearTimeout(cartBumpTimer);
      cartBumpTimer = window.setTimeout(() => {
        badges.forEach(badge => badge.classList.remove("is-bumping"));
        if (button) button.classList.remove("is-bumping");
      }, 820);
    }

    function renderCart(highlightId) {
      const entries = [...state.cart.entries()]
        .map(([id, quantity]) => ({ product: getProduct(id), quantity }))
        .filter(entry => entry.product && entry.quantity > 0);
      const itemCount = entries.reduce((sum, entry) => sum + entry.quantity, 0);
      const total = entries.reduce((sum, entry) => sum + entry.product.price * entry.quantity, 0);

      document.querySelectorAll("[data-cart-count]").forEach(element => {
        element.textContent = itemCount;
      });
      document.getElementById("cartTotalLabel").textContent = t("cartTotal", { n: itemCount });
      cartTotal.textContent = yen(total);
      cartItems.classList.toggle("scrollable", entries.length > 3);

      if (!entries.length) {
        cartItems.innerHTML = `<div class="empty-cart">${t("emptyCart")}</div>`;
        return;
      }

      cartItems.innerHTML = entries.map(({ product, quantity }) => {
        const name = productName(product);
        const variant = t(`categories.${product.category}`);
        const highlight = highlightId === product.id ? " is-new" : "";
        // 数量为 1 时不显示「× 1」徽标，把宽度让给放大后的商品名
        const qtyBadge = quantity > 1 ? `<span class="cart-item-qty">× ${quantity}</span>` : "";
        return `
        <article class="cart-item${highlight}">
          <img class="cart-thumb" src="${product.image}" alt="${name}" width="210" height="210">
          <div class="cart-item-main">
            <h3 class="cart-item-name"><span class="cart-item-title" title="${name}">${name}</span></h3>
            <p class="cart-item-variant">${variant}${qtyBadge}</p>
          </div>
          <div class="cart-item-tail">
            <span class="cart-item-price">${yen(product.price * quantity)}</span>
            <button class="remove-item" type="button" data-remove="${product.id}" aria-label="${t("removeAria", { name })}">${icons.trash}</button>
          </div>
        </article>
      `;
      }).join("");
    }

    function setCartOpen(open) {
      state.cartOpen = open;
      cartPanel.classList.toggle("closed", !open);
      openCartButton.classList.toggle("hidden", open);
      cartPanel.setAttribute("aria-hidden", String(!open));
    }

    function cartItemCount() {
      return [...state.cart.values()].reduce((sum, quantity) => sum + (Number(quantity) || 0), 0);
    }

    const ORDER_LIMIT_NOTICE_MS = 3000;
    const orderLimitLayer = document.getElementById("orderLimitLayer");
    const orderLimitText = document.getElementById("orderLimitText");
    let orderLimitTimer;
    let orderLimitCloseTimer;

    function hideOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      orderLimitLayer.classList.remove("show");
      orderLimitCloseTimer = window.setTimeout(() => {
        orderLimitLayer.hidden = true;
      }, 220);
    }

    function showOrderLimit() {
      window.clearTimeout(orderLimitTimer);
      window.clearTimeout(orderLimitCloseTimer);
      orderLimitText.textContent = t("limitReached", { max: MAX_ORDER_ITEMS });
      orderLimitLayer.hidden = false;
      requestAnimationFrame(() => orderLimitLayer.classList.add("show"));
      orderLimitTimer = window.setTimeout(hideOrderLimit, ORDER_LIMIT_NOTICE_MS);
    }

    function addToCart(id) {
      if (cartItemCount() >= MAX_ORDER_ITEMS) {
        showOrderLimit();
        return;
      }
      state.cart.set(id, (state.cart.get(id) || 0) + 1);
      renderCart();
      // 加购后让购物车数字闪一下，提示「已进购物车」
      bumpCartBadge();
      showToast(t("added", { name: productName(getProduct(id)) }));
    }

    adToggle.addEventListener("click", () => {
      state.adEnabled = !state.adEnabled;
      state.page = 0;
      renderProducts();
      const count = Math.min(visibleProducts().length, pageSize());
      showToast(state.adEnabled ? t("adOn", { n: count }) : t("adOff", { n: count }));
    });

    // 记住本机档位：在商品页切换档位后写回设备配置，下次打开仍是这一档
    function persistLayout(layout) {
      try {
        const raw = localStorage.getItem("fujiDevice");
        const device = raw ? (JSON.parse(raw) || {}) : {};
        const ref = LAYOUT_REFERENCE[layout] || LAYOUT_REFERENCE.s10;
        device.mode = "preset";
        device.preset = layout;
        device.layout = layout;
        device.w = ref[0];
        device.h = ref[1];
        localStorage.setItem("fujiDevice", JSON.stringify(device));
        window.FUJI_DEVICE = { mode: "preset", layout };
        document.documentElement.dataset.deviceMode = "preset";
        document.documentElement.dataset.deviceLayout = layout;
      } catch (error) {
        console.warn("档位偏好无法保存。", error);
      }
    }

    // 排版档位切换：重置到第一页，并提示当前档位（屏幕尺寸 / 网格 / 每页数量）
    layoutSwitch.addEventListener("click", event => {
      const button = event.target.closest("[data-layout]");
      if (!button || button.dataset.layout === state.layout) return;
      state.layout = button.dataset.layout;
      state.page = 0;
      renderProducts();
      persistLayout(state.layout);
      const layout = LAYOUTS[state.layout];
      showToast(t("layoutToast", { diag: layout.diag, cols: layout.cols, rows: layout.rows, n: pageSize() }));
    });

    slideNext.addEventListener("click", () => goToPage(state.page + 1));
    slidePrev.addEventListener("click", () => goToPage(state.page - 1));
    pageNextButton.addEventListener("click", () => goToPage(state.page + 1));
    pagePrevButton.addEventListener("click", () => goToPage(state.page - 1));
    pageNumbers.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (button) goToPage(Number(button.dataset.page));
    });


    const adSlides = Array.from(document.querySelectorAll(".ad-slide"));
    const adDots = Array.from(document.querySelectorAll(".ad-dots span"));
    let adSlideIndex = 0;
    let adSlideTimer = null;

    function showAdSlide(nextIndex) {
      adSlideIndex = (nextIndex + adSlides.length) % adSlides.length;
      adSlides.forEach((slide, index) => slide.classList.toggle("active", index === adSlideIndex));
      adDots.forEach((dot, index) => dot.classList.toggle("active", index === adSlideIndex));
    }

    function startAdRotation() {
      if (adSlideTimer !== null || adSlides.length < 2) return;
      adSlideTimer = window.setInterval(() => showAdSlide(adSlideIndex + 1), 6000);
    }

    function stopAdRotation() {
      if (adSlideTimer === null) return;
      window.clearInterval(adSlideTimer);
      adSlideTimer = null;
    }

    startAdRotation();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopAdRotation();
      else startAdRotation();
    });

    productTrack.addEventListener("click", event => {
      const addButton = event.target.closest("[data-add]");
      if (addButton) {
        addToCart(Number(addButton.dataset.add));
        return;
      }
    });

    cartItems.addEventListener("click", event => {
      const remove = event.target.closest("[data-remove]");
      if (!remove) return;
      const id = Number(remove.dataset.remove);
      state.cart.delete(id);
      state.cartVariants.delete(id);
      renderCart();
    });

    document.getElementById("closeCart").addEventListener("click", () => setCartOpen(false));
    openCartButton.addEventListener("click", () => setCartOpen(true));
    document.getElementById("checkoutButton").addEventListener("click", () => {
      if (!state.cart.size) {
        showToast(t("selectProduct"));
        return;
      }
      const order = {
        items: [...state.cart.entries()].map(([id, quantity]) => {
          const product = getProduct(id);
          const variant = t(`categories.${product.category}`);
          return { productId: product.id, name: productName(product), price: product.price, quantity, image: product.image, variant, variantData: null };
        }),
        language: currentLanguage
      };
      try {
        localStorage.setItem("fujiOrder", JSON.stringify(order));
      } catch (error) {
        console.warn("订单暂存不可用，将使用默认演示订单。", error);
      }
      window.location.href = "payment.html";
    });

    document.querySelectorAll("[data-toast]").forEach(button => {
      button.addEventListener("click", () => showToast(button.dataset.toast));
    });

    /* ===== 分类标签栏：一屏 4 个标签位，多余部分横向滑动 =====
       触摸屏本就能直接拖（touch-action: pan-x），这里补齐鼠标拖拽、滚轮横滚、
       边缘渐隐提示，以及切换分类后把选中项滚进可视区。 */
    const categoryWrap = document.getElementById("categoryWrap");
    const categoryNav = document.getElementById("categoryNav");

    function updateCategoryScrollState() {
      if (!categoryNav) return;
      const max = categoryNav.scrollWidth - categoryNav.clientWidth;
      categoryWrap.classList.toggle("can-left", categoryNav.scrollLeft > 2);
      categoryWrap.classList.toggle("can-right", max > 2 && categoryNav.scrollLeft < max - 2);
    }

    function revealCategory(button) {
      if (!categoryNav || !button) return;
      const navBox = categoryNav.getBoundingClientRect();
      const box = button.getBoundingClientRect();
      if (box.left < navBox.left) {
        categoryNav.scrollLeft -= navBox.left - box.left + 8;
      } else if (box.right > navBox.right) {
        categoryNav.scrollLeft += box.right - navBox.right + 8;
      }
      updateCategoryScrollState();
    }

    if (categoryNav) {
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startLeft = 0;

      categoryNav.addEventListener("scroll", updateCategoryScrollState, { passive: true });
      window.addEventListener("resize", updateCategoryScrollState);

      // 鼠标拖拽（触摸屏走原生滚动）
      categoryNav.addEventListener("pointerdown", event => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;
        dragging = true;
        moved = false;
        startX = event.clientX;
        startLeft = categoryNav.scrollLeft;
        categoryNav.classList.add("is-dragging");
        categoryNav.setPointerCapture(event.pointerId);
      });
      categoryNav.addEventListener("pointermove", event => {
        if (!dragging) return;
        const delta = event.clientX - startX;
        if (Math.abs(delta) > 4) moved = true;
        if (!moved) return;
        categoryNav.scrollLeft = startLeft - delta;
      });
      const endDrag = event => {
        if (!dragging) return;
        dragging = false;
        categoryNav.classList.remove("is-dragging");
        if (categoryNav.hasPointerCapture(event.pointerId)) categoryNav.releasePointerCapture(event.pointerId);
        updateCategoryScrollState();
      };
      categoryNav.addEventListener("pointerup", endDrag);
      categoryNav.addEventListener("pointercancel", endDrag);
      // 拖动结束的那一下不要当成点击（否则会误切分类）
      categoryNav.addEventListener("click", event => {
        if (!moved) return;
        moved = false;
        event.preventDefault();
        event.stopPropagation();
      }, true);

      // 鼠标竖向滚轮 → 横向滚动
      categoryNav.addEventListener("wheel", event => {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        const max = categoryNav.scrollWidth - categoryNav.clientWidth;
        if (max <= 2) return;
        categoryNav.scrollLeft += event.deltaY;
        event.preventDefault();
      }, { passive: false });

      // 键盘左右键
      categoryNav.addEventListener("keydown", event => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        categoryNav.scrollLeft += event.key === "ArrowRight" ? categoryNav.clientWidth * 0.6 : -categoryNav.clientWidth * 0.6;
      });

      updateCategoryScrollState();
    }

    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        if (state.category === button.dataset.category) return;
        state.category = button.dataset.category;
        state.page = 0;
        document.querySelectorAll("[data-category]").forEach(item => {
          item.classList.toggle("active", item === button);
          item.removeAttribute("aria-current");
        });
        button.setAttribute("aria-current", "page");
        renderProducts();
        revealCategory(button);
        showToast(t("categoryToast", { name: t(button.dataset.labelKey), n: visibleProducts().length }));
      });
    });

    const languagePicker = document.getElementById("languagePicker");
    const languageButton = document.getElementById("languageButton");
    const languageMenu = document.getElementById("languageMenu");

    function setLanguageMenuOpen(open) {
      languagePicker.classList.toggle("open", open);
      languageButton.setAttribute("aria-expanded", String(open));
    }

    function applyLanguage(language, options = {}) {
      currentLanguage = I18N[language] ? language : "ja";
      document.documentElement.lang = I18N[currentLanguage].htmlLang || currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-aria]").forEach(element => {
        element.setAttribute("aria-label", t(element.dataset.i18nAria));
      });
      document.querySelectorAll("[data-i18n-title]").forEach(element => {
        element.setAttribute("title", t(element.dataset.i18nTitle));
      });
      document.querySelectorAll("[data-i18n-toast]").forEach(element => {
        element.dataset.toast = t(element.dataset.i18nToast);
      });

      document.getElementById("languageLabel").textContent = t("langName");
      languageMenu.setAttribute("aria-label", t("languageMenu"));
      languageButton.setAttribute("aria-label", t("languageMenu"));
      languageMenu.querySelectorAll("[data-set-language]").forEach(option => {
        const active = option.dataset.setLanguage === currentLanguage;
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", String(active));
      });

      renderProducts();
      renderCart();

      if (options.persist !== false) {
        try {
          localStorage.setItem("fujiLanguage", currentLanguage);
        } catch (error) {
          console.warn("语言偏好无法保存。", error);
        }
      }
    }

    languageButton.addEventListener("click", event => {
      event.stopPropagation();
      setLanguageMenuOpen(!languagePicker.classList.contains("open"));
    });

    languageMenu.addEventListener("click", event => {
      const option = event.target.closest("[data-set-language]");
      if (!option) return;
      event.stopPropagation();
      setLanguageMenuOpen(false);
      applyLanguage(option.dataset.setLanguage);
    });

    document.addEventListener("click", event => {
      if (!languagePicker.contains(event.target)) setLanguageMenuOpen(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setLanguageMenuOpen(false);
    });

    // 广告栏宽度 = 可用高度 × 海报比例（848×1855），并封顶 1000 设计像素。
    // CSS 里用 aspect-ratio 实现；这里再按实际像素写一次，规避个别浏览器在 flex 中解析不了
    // aspect-ratio 导致广告栏宽度塌成 0 的风险。
    function fitAdSidebar() {
      const sidebar = document.getElementById("adSidebar");
      if (!sidebar) return;
      const workspace = sidebar.parentElement;
      const height = workspace ? workspace.clientHeight : 0;
      if (!height) return;
      const styles = getComputedStyle(document.documentElement);
      const posterW = parseFloat(styles.getPropertyValue("--ad-poster-w")) || 848;
      const posterH = parseFloat(styles.getPropertyValue("--ad-poster-h")) || 1855;
      const maxRem = parseFloat(styles.getPropertyValue("--ad-max-w")) || 62.5;
      const rootFont = parseFloat(styles.fontSize) || 16;
      const width = Math.min(Math.round(height * posterW / posterH), Math.round(maxRem * rootFont));
      sidebar.style.width = `${width}px`;
      sidebar.style.flexBasis = `${width}px`;
    }

    fitAdSidebar();
    window.addEventListener("resize", fitAdSidebar);
    window.addEventListener("orientationchange", fitAdSidebar);

    applyLanguage(currentLanguage, { persist: false });
    setCartOpen(state.cartOpen);
  </script>
  <script>
    // ===== 调试浮窗：点左侧 LOGO 唤出（默认不显示，上线前整块移除）=====
    (function initDebugDock() {
      const trigger = document.getElementById("debugTrigger");
      const dock = document.getElementById("debugDock");
      const panel = document.getElementById("debugPanel");
      if (!trigger || !dock || !panel) return;

      function place() {
        const rect = trigger.getBoundingClientRect();
        const left = Math.max(16, Math.min(rect.left, window.innerWidth - panel.offsetWidth - 16));
        const top = Math.max(16, Math.min(rect.bottom + 12, window.innerHeight - 220));
        panel.style.left = `${left}px`;
        panel.style.top = `${top}px`;
        panel.style.maxHeight = `${Math.max(240, window.innerHeight - top - 20)}px`;
      }
      function open() {
        dock.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        place();
      }
      function close() {
        dock.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      }

      trigger.addEventListener("click", event => {
        event.stopPropagation();
        if (dock.classList.contains("is-open")) close(); else open();
      });
      trigger.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
      });
      dock.addEventListener("click", event => {
        if (event.target.closest("[data-debug-close]")) close();
      });
      document.addEventListener("keydown", event => { if (event.key === "Escape") close(); });
      window.addEventListener("resize", () => { if (dock.classList.contains("is-open")) place(); });

      // 屏幕尺寸：直接写入本机配置再重载，不用离开当前页
      const device = window.FUJI_DEVICE || { mode: "auto", layout: "" };
      const REF = { s10: [1024, 768], m21: [1920, 1080], l27: [2560, 1440] };
      dock.querySelectorAll("[data-size-preset]").forEach(button => {
        const preset = button.dataset.sizePreset;
        const active = preset === "auto"
          ? device.mode === "auto"
          : device.mode === "preset" && device.layout === preset;
        button.setAttribute("aria-pressed", String(active));
        button.addEventListener("click", () => {
          const payload = preset === "auto"
            ? { mode: "auto", preset: null, layout: null, w: 0, h: 0 }
            : { mode: "preset", preset, layout: preset, w: REF[preset][0], h: REF[preset][1] };
          try { localStorage.setItem("fujiDevice", JSON.stringify(payload)); } catch (error) { console.warn(error); }
          window.location.reload();
        });
      });

      dock.querySelectorAll("[data-debug-nav]").forEach(button => {
        button.addEventListener("click", () => { window.location.href = button.dataset.debugNav; });
      });
    })();
  </script>
